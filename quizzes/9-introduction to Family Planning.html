<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Population Problem & Family Planning</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        const rawQuizData = [
            { 
                id: 1, 
                question: "What is a key element of the concept of quality of care in family planning?", 
                options: ["Safety of methods", "High financial cost", "Limited service access", "Provider convenience"], 
                correct: 0, 
                rationale: "Quality of care in family planning primarily aims to secure the safety and effectiveness of the methods provided." 
            },
            { 
                id: 2, 
                question: "The term contraception literally translates to the prevention of the occurrence of pregnancy.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "The word contraception is derived from 'contra' meaning against, and 'conception' meaning pregnancy, thus translating to the prevention of pregnancy." 
            },
            { 
                id: 3, 
                question: "What was the total population of Egypt according to the first census carried out in eighteen eighty two?", 
                options: ["Six point seven million", "Five point four million", "Seven point two million", "Eight point one million"], 
                correct: 0, 
                rationale: "The first census in Egypt in 1882 recorded a total population of 6.7 million." 
            },
            { 
                id: 4, 
                question: "Which topic must be covered when counseling a client about family planning methods?", 
                options: ["Advantages and disadvantages", "Nutritional dietary guidelines", "Pediatric vaccination schedules", "Occupational health hazards"], 
                correct: 0, 
                rationale: "Counseling about family planning methods must cover their effectiveness, advantages and disadvantages, side effects, usage instructions, STD prevention, and return dates." 
            },
            { 
                id: 5, 
                question: "Clients have the right to obtain family planning services only if they belong to a specific socio economic status.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Clients have the right to access family planning services regardless of their sex, race, religion, color, and socio-economic status." 
            },
            { 
                id: 6, 
                question: "How does family planning primarily benefit women?", 
                options: ["Reducing high risk pregnancies", "Decreasing employment opportunities", "Increasing societal isolation", "Elevating maternal morbidity"], 
                correct: 0, 
                rationale: "Family planning benefits women significantly by decreasing maternal mortality and morbidity through the reduction of high-risk pregnancies." 
            },
            { 
                id: 7, 
                question: "Which task is part of the supervisory role of a nurse in family planning?", 
                options: ["Organizing group discussions", "Providing direct counseling", "Planning working hours", "Keeping accurate records"], 
                correct: 0, 
                rationale: "Organizing group discussions and case presentations with staff is an essential function under the nurse's supervisory role." 
            },
            { 
                id: 8, 
                question: "Decreased national savings is considered a socio economic consequence of rapid population growth.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "Rapid population growth leads to decreased national savings, which in turn negatively impacts governmental services." 
            },
            { 
                id: 9, 
                question: "Which factor represents an environmental influence on contraceptive counseling?", 
                options: ["Room arrangement", "Counselor experience", "Client emotional state", "Age of marriage"], 
                correct: 0, 
                rationale: "Environmental factors that influence contraceptive counseling include privacy, room arrangement, and the availability of visual aids." 
            },
            { 
                id: 10, 
                question: "What percentage of the population being under fifteen years old contributes to the dependency burden in a rapidly growing population?", 
                options: ["Forty percent", "Thirty percent", "Fifty percent", "Sixty percent"], 
                correct: 0, 
                rationale: "Rapid population growth increases the dependency burden, heavily driven by the fact that 40 percent of the population is under 15 years old." 
            },
            { 
                id: 11, 
                question: "One of the ultimate goals of family planning includes controlling the timing of the first birth.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "The ultimate goals of family planning include improving health, spacing children, limiting family size, and controlling the timing of the first birth." 
            },
            { 
                id: 12, 
                question: "What is Egypt's rank in the list of countries based on total population?", 
                options: ["Number fourteen", "Number twelve", "Number fifteen", "Number sixteen"], 
                correct: 0, 
                rationale: "Egypt officially ranks number 14 in the list of countries and dependencies by total population." 
            },
            { 
                id: 13, 
                question: "In the GATHER counseling framework what action corresponds to the letter T?", 
                options: ["Tell the client about methods", "Treat each client with respect", "Train the community leaders", "Track the medical complications"], 
                correct: 0, 
                rationale: "In the GATHER framework, the letter T stands for 'Tell the client about contraceptive methods'." 
            },
            { 
                id: 14, 
                question: "Family planning increases maternal morbidity by encouraging high risk pregnancies.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Family planning actively decreases maternal morbidity and mortality by reducing the occurrence of high-risk pregnancies." 
            },
            { 
                id: 15, 
                question: "Which factor is considered a socio cultural cause of rapid population growth?", 
                options: ["Early marriage", "Decline in death", "Lack of services", "Vaccine resistance"], 
                correct: 0, 
                rationale: "Socio-cultural factors such as early marriage and a generally high rate of marriage contribute heavily to rapid population growth." 
            },
            { 
                id: 16, 
                question: "What is a recognized health consequence of rapid population growth?", 
                options: ["Increased fertility hazards", "Improved medical services", "Decreased mortality rate", "Enhanced living standards"], 
                correct: 0, 
                rationale: "Increased fertility hazards, along with increased morbidity and mortality rates, are direct health consequences of rapid population growth." 
            },
            { 
                id: 17, 
                question: "Participating in the organization of family planning programs at the national level is an administrative role of the nurse.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "The administrative role of a nurse includes participating in the organization of programs at national, regional, or community levels." 
            },
            { 
                id: 18, 
                question: "What primarily occurs during the middle phase of family planning counseling?", 
                options: ["Making an informed choice", "Assessing reproductive goals", "Taking medical history", "Discussing when to return"], 
                correct: 0, 
                rationale: "The middle phase of family planning counseling focuses on making an informed choice and providing brief information about all available methods." 
            },
            { 
                id: 19, 
                question: "Which trait is an established criterion for an ideal contraceptive method?", 
                options: ["Reversible", "Permanent", "Expensive", "Complicated"], 
                correct: 0, 
                rationale: "An ideal contraceptive method should be reversible, safe, available, effective, acceptable, and easy to use." 
            },
            { 
                id: 20, 
                question: "A census in the year nineteen ninety six revealed that the population of Egypt had reached exactly fifty million.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "The census in 1996 found that the population of Egypt was 59.3 million, not exactly 50 million." 
            },
            { 
                id: 21, 
                question: "What does the very first step of the GATHER counseling framework involve?", 
                options: ["Greeting each client warmly", "Explaining the chosen method", "Asking about reproductive goals", "Scheduling a follow up visit"], 
                correct: 0, 
                rationale: "The first step in the GATHER counseling framework represents the letter G, which stands for greeting each client warmly." 
            },
            { 
                id: 22, 
                question: "Who among the following is recognized as a typical family planning service provider?", 
                options: ["Social workers", "Financial auditors", "Agricultural engineers", "Legal practitioners"], 
                correct: 0, 
                rationale: "Social workers are officially listed among the dedicated service providers for family planning, alongside nurses and physicians." 
            },
            { 
                id: 23, 
                question: "Maintaining continuous and adequate supplies at the service outlet is essential for providers to ensure good service.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "Adequate and continuous supplies are fundamentally needed at the provider's outlet to ensure an all-time good service for users." 
            },
            { 
                id: 24, 
                question: "When is the global population projected to reach eight billion according to current estimates?", 
                options: ["By twenty thirty", "By twenty forty", "By twenty fifty", "By twenty sixty"], 
                correct: 0, 
                rationale: "According to current projections, the global population will safely reach eight billion by the timeframe of 2025 to 2030." 
            },
            { 
                id: 25, 
                question: "What does birth control involve in addition to spacing and limiting pregnancies?", 
                options: ["Infertility treatment", "Malignancy management", "Genetic manipulation", "Nutritional planning"], 
                correct: 0, 
                rationale: "Birth control encompasses spacing and limiting pregnancies as well as managing infertility treatments to conceive wanted children." 
            },
            { 
                id: 26, 
                question: "Making an informed choice about a contraceptive method is a mandatory requirement during the initial clinical visit.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "Choosing the method via an informed choice is explicitly noted as a mandatory step during the initial visit for clinical services." 
            },
            { 
                id: 27, 
                question: "What is a primary component of the initial visit for family planning clinical services?", 
                options: ["Laboratory investigations", "Renewal of medical supplies", "Detection of complications", "Treatment of malignancies"], 
                correct: 0, 
                rationale: "The initial clinical visit requires a thorough assessment of the couple, which firmly includes required laboratory investigations." 
            },
            { 
                id: 28, 
                question: "Which factor is classified as a counselor factor that heavily influences contraceptive counseling?", 
                options: ["Communication skills", "Educational attainment", "Readiness for change", "Ideal family size"], 
                correct: 0, 
                rationale: "Communication skills, counselor experience, and the time of counseling are categorized as specific counselor factors." 
            },
            { 
                id: 29, 
                question: "Providing a massive and overly complex amount of medical information is one of the six principles for good counseling.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "One of the six main principles for good counseling is to give the 'appropriate' amount of information, rather than overwhelming the client." 
            },
            { 
                id: 30, 
                question: "How can a nurse strategically motivate people to learn about family planning?", 
                options: ["Using mass media communication", "Forcing mandatory clinic visits", "Withholding medical treatments", "Imposing financial penalties"], 
                correct: 0, 
                rationale: "Nurses can motivate people by utilizing different methods of mass media communication and talking to them about the advantages of family planning." 
            }
        ];

        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
