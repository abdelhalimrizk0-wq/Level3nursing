<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #ddd6fe; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(109, 40, 217, 0.15); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-violet-200">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-purple-100 rounded-2xl shadow-md p-8 mb-8 text-center border-t-4 border-purple-700 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-purple-800"></i></div>

            <h1 class="text-3xl font-bold text-purple-950 mb-2 font-cairo text-center" dir="auto">Digitalis and Analgesic Antipyretics</h1>

            <div class="flex items-center justify-center gap-2 text-purple-900 font-semibold bg-purple-300/60 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-purple-100 rounded-2xl shadow-lg p-8 text-center mt-8 border border-purple-300">
            <h2 class="text-2xl font-bold text-purple-950">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-purple-700 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-purple-500" id="total-display"></span>
            </div>
            <p id="score-message" class="text-purple-800 mb-6"></p>
            <button onclick="location.reload()" class="bg-purple-700 text-white px-8 py-3 rounded-xl hover:bg-purple-800 transition shadow-lg hover:shadow-purple-300">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY (GENERATE EXACTLY 18 QUESTIONS HERE) ---
        const rawQuizData = [
            {
                id: 1,
                question: "The most important active principles of digitalis used in medicine are:",
                options: [
                                "Digitoxin and digoxin",
                                "Atropine and hyoscine",
                                "Morphine and codeine",
                                "Quinine and ergot"
                ],
                correct: 0,
                rationale: "The lecture states that the most important active principles are digitoxin and digoxin which are used in medicine."
            },
            {
                id: 2,
                question: "The chronotropic effect of digitalis means it:",
                options: [
                                "Increases vagal tone leading to decreased heart rate",
                                "Increases heart rate",
                                "Raises blood pressure",
                                "Dilates the pupils"
                ],
                correct: 0,
                rationale: "The lecture states that digitalis increases the vagal tone leading to decreased heart rate, the chronotropic effect."
            },
            {
                id: 3,
                question: "Digitalis acts by altering the Na-K ATPase system, resulting in intracellular:",
                options: [
                                "Loss of potassium and gain of sodium and calcium",
                                "Gain of potassium and loss of calcium",
                                "Loss of sodium and calcium",
                                "Gain of magnesium"
                ],
                correct: 0,
                rationale: "The lecture states that alteration of the Na-K ATPase system results in intracellular loss of potassium and gain of sodium and calcium."
            },
            {
                id: 4,
                question: "Which of the following drugs interacts with digitalis to predispose to toxicity?",
                options: [
                                "Quinidine",
                                "Paracetamol",
                                "Insulin",
                                "Vitamin C"
                ],
                correct: 0,
                rationale: "The lecture lists drug interactions especially with quinidine, reserpine, verapamil, diuretics, catecholamines and antibiotics."
            },
            {
                id: 5,
                question: "The abnormal color vision in digitalis poisoning affects which colours?",
                options: [
                                "Blue and yellow",
                                "Red and green",
                                "Black and white",
                                "Orange and violet"
                ],
                correct: 0,
                rationale: "The lecture states that ocular manifestations include abnormal colour vision for blue and yellow colours."
            },
            {
                id: 6,
                question: "The pulse in early digitalis poisoning is:",
                options: [
                                "Slow and full",
                                "Rapid and weak",
                                "Irregular only",
                                "Absent"
                ],
                correct: 0,
                rationale: "The lecture states that the pulse is first slow and full due to the effect of digitalis on the heart."
            },
            {
                id: 7,
                question: "Digitalis induced arrhythmias are treated with:",
                options: [
                                "Diphenylhydantoin and lidocaine",
                                "Aspirin and paracetamol",
                                "Morphine and codeine",
                                "Insulin and glucose"
                ],
                correct: 0,
                rationale: "The lecture states that diphenylhydantoin and lidocaine are used to treat digitalis induced arrhythmia."
            },
            {
                id: 8,
                question: "Cholestyramine helps excretion of digitalis by:",
                options: [
                                "Binding it and interrupting the enterohepatic circulation",
                                "Increasing urine output",
                                "Neutralizing the drug in blood",
                                "Dialyzing the drug"
                ],
                correct: 0,
                rationale: "The lecture states that cholestyramine is a steroid-binding resin that prevents further absorption and reduces the half life by interrupting the enterohepatic circulation."
            },
            {
                id: 9,
                question: "Digibind is indicated in life threatening arrhythmia not responding to treatment and after ingestion of more than how much digoxin in an adult?",
                options: [
                                "10 mg",
                                "1 mg",
                                "100 mg",
                                "500 mg"
                ],
                correct: 0,
                rationale: "The lecture states that Digibind is used in cases of ingestion of more than 10 mg of digoxin in adults or 4 mg in children."
            },
            {
                id: 10,
                question: "Salicylates are derivatives of:",
                options: [
                                "Acetyl salicylic acid",
                                "Carbolic acid",
                                "Oxalic acid",
                                "Meconic acid"
                ],
                correct: 0,
                rationale: "The lecture states that salicylates are acetyl salicylic acid derivatives."
            },
            {
                id: 11,
                question: "Salicylates interfere with vitamin K utilization, resulting in:",
                options: [
                                "Hypoprothrombinemia",
                                "Anemia",
                                "Polycythemia",
                                "Thrombocytosis"
                ],
                correct: 0,
                rationale: "The lecture states that salicylates interfere with vitamin K utilization causing hypoprothrombinemia."
            },
            {
                id: 12,
                question: "Hearing loss, tinnitus and dizziness in salicylate poisoning occur in:",
                options: [
                                "Mild cases",
                                "Only severe cases",
                                "Never",
                                "Only in children"
                ],
                correct: 0,
                rationale: "The lecture lists hearing loss, tinnitus and dizziness among the features of mild cases of salicylate poisoning."
            },
            {
                id: 13,
                question: "Subconjunctival hemorrhages and ecchymosis of the eyelids appear in:",
                options: [
                                "Moderate cases of salicylate poisoning",
                                "Mild cases",
                                "Digitalis poisoning",
                                "Opium poisoning"
                ],
                correct: 0,
                rationale: "The lecture lists subconjunctival hemorrhages and ecchymosis of the eyelids among the features of moderate salicylate poisoning."
            },
            {
                id: 14,
                question: "Renal excretion of salicylates is enhanced by:",
                options: [
                                "Alkalinization of urine and forced alkaline diuresis",
                                "Acidification of urine",
                                "Antidiuretic hormone",
                                "Salt restriction"
                ],
                correct: 0,
                rationale: "The lecture states that renal excretion is enhanced by alkalinization of urine and forced alkaline diuresis."
            },
            {
                id: 15,
                question: "Myocardial infarction, renal failure, cor pulmonale and hypothyroidism predispose to digitalis toxicity.",
                options: [
                                "True",
                                "False"
                ],
                correct: 0,
                rationale: "The lecture lists these among the patient factors predisposing to digitalis toxicity."
            },
            {
                id: 16,
                question: "Salicylates enhance glucose-6-phosphatase activity, increasing peripheral utilization of glucose and causing hypoglycemia.",
                options: [
                                "True",
                                "False"
                ],
                correct: 0,
                rationale: "The lecture states that salicylates enhance glucose 6 phosphatase activity increasing peripheral utilization of glucose, causing hypoglycemia."
            },
            {
                id: 17,
                question: "The cause of death in acetaminophen toxicity is hepatic failure.",
                options: [
                                "True",
                                "False"
                ],
                correct: 0,
                rationale: "The lecture states that the cause of death in acetaminophen toxicity is hepatic failure."
            },
            {
                id: 18,
                question: "In acetaminophen toxicity, prevention of absorption is useless after 2 hours of ingestion.",
                options: [
                                "True",
                                "False"
                ],
                correct: 1,
                rationale: "The lecture states that further absorption is prevented up to 24 hours following ingestion by gastric lavage followed by activated charcoal."
            }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0;
        let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-purple-100 rounded-xl p-6 mb-6 border border-purple-300 shadow-sm">
                    <div class="flex justify-between items-center mb-4 border-b border-purple-200 pb-3">
                        <span class="bg-purple-700 text-white text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                        ${q.options.length === 2 ? '<span class="bg-fuchsia-700 text-white text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-purple-950 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-purple-300 hover:bg-purple-200 hover:border-purple-500 focus:outline-none flex items-center justify-between group bg-purple-50"><span class="font-medium text-purple-900 group-hover:text-purple-950 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 rounded-xl p-5 border animate-fade-in text-left">
                        <p class="text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) {
                    btn.classList.add('correct-answer');
                    btn.innerHTML += '<i class="fas fa-check float-right"></i>';
                } else if (i === optIndex) {
                    btn.classList.add('wrong-answer');
                    btn.innerHTML += '<i class="fas fa-times float-right"></i>';
                } else {
                    btn.classList.add('opacity-50');
                }
            });
            if (optIndex === q.correct) {
                score++;
                feedback.classList.add('correct-answer');
            } else {
                feedback.classList.add('wrong-answer');
            }
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score / quizData.length * 100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };

        renderQuiz();
    </script>
</body>
</html>
