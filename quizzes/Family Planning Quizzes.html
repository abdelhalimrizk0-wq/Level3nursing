                    { "id": 16, "question": "What should a client be counseled to expect regarding her menstrual cycle after taking ECPs?", "options": [ "Her next menses may come early or late.", "Her menstrual cycle will stop completely for one month.", "Her next menses will arrive exactly on its scheduled date.", "She will experience continuous heavy bleeding for two weeks." ], "correct": 0, "rationale": "Key counseling topics note that a woman's next menses may come early or late after taking emergency contraceptive pills." },
                    { "id": 17, "question": "Coitus interruptus has a high failure rate due to the potential leakage of seminal fluid before ejaculation.", "options": [ "True", "False" ], "correct": 0, "rationale": "Disadvantages of coitus interruptus include a high failure rate and high incidence of pregnancy due to leakage of seminal fluid." },
                    { "id": 18, "question": "What is a notable advantage of using coitus interruptus as a method of fertility regulation?", "options": [ "It permits sexual spontaneity.", "It provides high protection against sexually transmitted diseases.", "It has the lowest failure rate among natural contraceptive methods.", "It eliminates the need for ongoing emergency contraception completely." ], "correct": 0, "rationale": "Advantages of coitus interruptus include that it is medically safe, requires no preparation, is a good backup method, permits sexual spontaneity, and has no cost." },
                    { "id": 19, "question": "Which components are found in the combined oral contraceptive regimen for emergency contraception?", "options": [ "Ethinyl estradiol and levonorgestrel", "Ulipristal acetate and copper ions", "Progesterone and testosterone", "Copper ions and ethinyl estradiol" ], "correct": 0, "rationale": "COCs used for the Yuzpe method consist of a split dose containing 100 µg of ethinyl estradiol plus 0.50 mg of LNG per dose." },
                    { "id": 20, "question": "What is the amount of Levonorgestrel contained in the LNG IUD recently demonstrated to be effective as an emergency contraceptive?", "options": [ "52 mg", "30 mg", "1.5 mg", "0.75 mg" ], "correct": 0, "rationale": "The LNG 52 mg IUD has recently demonstrated effectiveness and can be effectively initiated up to 120 hours after unprotected intercourse as emergency contraception." },
                    { "id": 21, "question": "Emergency contraceptive pills protect against sexually transmitted diseases and HIV.", "options": [ "True", "False" ], "correct": 1, "rationale": "Key counseling topics emphasize that emergency contraception provides no protection from STDs or HIV." },
                    { "id": 22, "question": "Which of the following situations is a clear indication for using emergency contraceptive pills?", "options": [ "Taking the Today Sponge out too soon", "Taking the daily contraceptive pill at the exact scheduled time", "Using a condom that remains intact during intercourse", "Being in a mutually monogamous relationship" ], "correct": 0, "rationale": "Indications for emergency contraception include taking the Today Sponge out too soon, as well as missed pills, broken condoms, and miscalculated safe days." },
                    { "id": 23, "question": "Emergency contraception works to prevent pregnancy by interfering with which of the following physiological processes?", "options": [ "Ovulation", "Menstruation", "Menopause", "Lactation" ], "correct": 0, "rationale": "One of the primary mechanisms of action of emergency contraception is that it can prevent or delay ovulation." },
                    { "id": 24, "question": "Why might coitus interruptus lead to an unexpected pregnancy despite the male successfully withdrawing before full ejaculation?", "options": [ "Due to the leakage of seminal fluid before ejaculation.", "Because it unexpectedly thickens the cervical mucus.", "Because it delays ovulation in the female partner.", "Due to the increased viability of sperm in the vaginal tract." ], "correct": 0, "rationale": "Coitus interruptus has a high failure rate and high incidence of pregnancy due to leakage of seminal fluid prior to full ejaculation." },
                    { "id": 25, "question": "What counseling advice should be provided to a woman who chooses an IUD for emergency contraception?", "options": [ "She should consider using it for ongoing contraception.", "She must remove it immediately after her next menstrual period.", "She must take emergency contraceptive pills concurrently.", "She will be completely protected against all viral infections." ], "correct": 0, "rationale": "When an IUD is used for emergency contraception, the client should be counseled to consider it for ongoing contraception, as it provides excellent long-term protection." },
                    { "id": 26, "question": "How does emergency contraception affect the movement of the egg or sperm?", "options": [ "By making them less likely to meet.", "By increasing the speed of sperm travel.", "By forcing the egg to implant rapidly.", "By expanding the diameter of the fallopian tubes." ], "correct": 0, "rationale": "Emergency contraception can affect the movement of the egg or sperm, making them less likely to meet and thereby preventing fertilization." },
                    { "id": 27, "question": "Which of the following is considered a significant disadvantage of the coitus interruptus method?", "options": [ "It requires great control and can cause anxiety.", "It requires an expensive medical prescription.", "It involves complex preparation before sexual intercourse.", "It increases the risk of systemic hormonal side effects." ], "correct": 0, "rationale": "Disadvantages of coitus interruptus include a high failure rate as it requires great control, interruption of sexual excitement, diminished pleasure, and anxiety." },
                    { "id": 28, "question": "Based on the provided data, if 100 women have unprotected sex once during the second or third week of their cycle, how many pregnancies are expected when using progestin-only ECPs?", "options": [ "1 pregnancy", "Less than 1 pregnancy", "2 pregnancies", "8 pregnancies" ], "correct": 0, "rationale": "According to the effectiveness chart, progestin-only ECPs reduce the expected number of pregnancies to exactly 1 out of 100 women." },
                    { "id": 29, "question": "Based on the effectiveness chart, which emergency contraceptive pill regimen results in the lowest number of expected pregnancies per 100 women?", "options": [ "Ulipristal acetate", "Progestin-only ECPs", "Combined estrogen-progestin ECPs", "No ECPs" ], "correct": 0, "rationale": "The chart shows that Ulipristal acetate results in less than 1 pregnancy per 100 women, making it the most effective oral option listed." },
                    { "id": 30, "question": "What should a woman consider doing if she forgets to apply her birth control patch and has unprotected sex?", "options": [ "She can use emergency contraceptive pills to prevent pregnancy.", "She should apply three patches at once to make up for the missed dose.", "She must undergo immediate surgical intervention.", "She should rely solely on coitus interruptus for the rest of the cycle." ], "correct": 0, "rationale": "ECPs can be used any time a woman is worried she might become pregnant after forgetting her normal birth control method, such as not applying her birth control patch." }

            {
                title: "Hormonal Contraceptive Methods",
                questions: [
                    { id: "q1", question: "What is the primary mechanism by which Combined Oral Contraceptive pills prevent pregnancy?", options: [ "Prevention of ovulation by inhibiting follicular development", "Permanent alteration of the cellular structure of the fallopian tubes", "Direct chemical destruction of sperm cells entering the vagina", "Continuous stimulation of a luteinizing hormone surge" ], correct: 0, rationale: "The primary mechanism of action of Combined Oral Contraceptive pills is the prevention of ovulation by inhibiting follicular development and stopping the mid-cycle luteinizing hormone surge." },
                    { id: "q2", question: "How many menstrual periods per year does a woman typically experience when using extended-cycle pills dispensed in 13-week cycles?", options: [ "12 to 13", "3 to 4", "6 to 7", "1 to 2" ], correct: 1, rationale: "Extended-cycle pills are typically dispensed in 13-week cycles where the woman takes active pills for 12 weeks and inactive pills for 1 week, resulting in a period only 3 to 4 times per year." },
                    { id: "q3", question: "Which of the following compounds is classified as a type of estrogen used in combined oral contraceptive pills?", options: [ "Levonorgestrel", "Etonogestrel", "Ethinyl estradiol", "Norgestrel" ], correct: 2, rationale: "Ethinyl estradiol and mestranol are the types of estrogens used in Combined Oral Contraceptive pills. The others listed are progestins." },
                    { id: "q4", question: "Which of the following conditions is considered an ABSOLUTE contraindication for the use of Combined Oral Contraceptives?", options: [ "Mild hypertension adequately controlled on medications", "Diabetes mellitus for more than 20 years or associated with nephropathy", "History of clinical depression", "Age greater than 35 years and smoking less than 15 cigarettes per day" ], correct: 1, rationale: "Diabetes mellitus for more than 20 years or associated with retinopathy or nephropathy is an absolute contraindication. The other options are considered relative contraindications." },
                    { id: "q5", question: "When is the earliest recommended time for a breast-feeding postpartum mother to start taking combined oral contraceptive pills?", options: [ "Immediately after delivery", "After 3 to 6 weeks", "After 6 months or until breast-feeding is discontinued", "On the 7th day postpartum" ], correct: 2, rationale: "For a breast-feeding woman, starting combined pills should be delayed for 6 months or until breast-feeding is discontinued, as they can affect the quality and quantity of breast milk." },
                    { id: "q6", question: "What is the recommended action if a woman misses 2 combined oral contraceptive tablets in a row during the first week of her cycle?", options: [ "Discard the pack and wait for the next menstrual period to begin a new pack", "Take 2 tablets the day she remembers and 2 pills the next day, then resume 1 per day with a backup method", "Take only 1 extra pill the day she remembers without needing any additional backup method", "Stop taking the pills immediately and switch to a progestin-only injectable method" ], correct: 1, rationale: "If a patient misses 2 tablets in a row in the first or second week, she must take 2 tablets the day she remembers and 2 pills the next day, resume 1 per day, and use an additional form of contraception." },
                    { id: "q7", question: "If a woman taking combined oral contraceptives experiences severe abdominal pain, which dangerous complication might this symptom indicate?", options: [ "Pulmonary embolism or myocardial infarction", "Gallbladder disease, hepatic adenoma, or pancreatitis", "Stroke, severe hypertension, or migraine headache", "A deep vein blood clot in the lower extremities" ], correct: 1, rationale: "According to the danger signs of oral contraceptives, severe abdominal pain may indicate gallbladder disease, a blood clot, hepatic adenoma, or pancreatitis." },
                    { id: "q8", question: "How are Progestin-only pills packaged and administered?", options: [ "Packets of 21 active pills with a 7-day pill-free interval", "Packets of 28 pills where the last 7 are placebo tablets", "Packets of 28 active hormonal pills taken daily with no pill-free interval", "Packets of 13 active pills taken once a week continuously" ], correct: 2, rationale: "Progestin-only pills (mini-pills) are available in packets of 28 pills, all of which are active hormonal pills, and are taken daily with no waiting period or pill-free interval between packets." },
                    { id: "q9", question: "When should a breast-feeding postpartum mother begin taking Progestin-only pills?", options: [ "Immediately on the day of childbirth", "At the 6th week after childbirth", "At the 6th month after childbirth", "At the 3rd week after childbirth" ], correct: 1, rationale: "Progestin-only pills can be safely used by nursing mothers starting at the 6th week after childbirth without affecting the quantity and quality of breast milk." },
                    { id: "q10", question: "Which of the following describes the correct dosage and administration frequency for Depot Provera (DMPA)?", options: [ "150 mg given intramuscularly every 3 months", "200 mg given intramuscularly every 2 months", "104 mg given subcutaneously every 13 weeks", "300 mg given intramuscularly every month" ], correct: 0, rationale: "Depot Provera (DMPA) is administered as 150 mg intramuscularly every 3 months. The 300 mg dose is given every 6 months." },
                    { id: "q11", question: "If a woman is late for her progestogen-only contraceptive injection, after how many weeks of delay MUST she use a back-up method?", options: [ "More than 1 week", "More than 2 weeks", "More than 4 weeks", "More than 6 weeks" ], correct: 1, rationale: "Health teaching for injectables specifies that if a woman is late for more than 2 weeks, she must use a back-up method and return to take the injection regardless of how late she is." },
                    { id: "q12", question: "Which of the following is a recognized disadvantage of using progestogen-only injectables?", options: [ "They permanently eliminate the possibility of future pregnancies", "They can delay the return of fertility for up to 2 years", "They require the user to take a supplementary daily pill", "They significantly increase the risk of acquiring sexually transmitted diseases" ], correct: 1, rationale: "A major disadvantage of progestogen-only injectables is the delayed return of fertility, which can take up to 2 years after discontinuing the method." },
                    { id: "q13", question: "Which characteristic applies to contraceptive implants such as Implanon?", options: [ "They are rigid metal rods requiring surgical implantation in the lower abdomen", "They must be replaced by a health care provider every 6 months", "They release a low, steady dose of progestin and remain effective for 3 years", "They are designed to be easily inserted and removed by the user at home" ], correct: 2, rationale: "Contraceptive implants are flexible plastic rods placed under the skin of the upper arm that release a steady dose of progestin and are effective for 3 years." },
                    { id: "q14", question: "What is the proper usage cycle for the hormonal contraceptive vaginal ring?", options: [ "Inserted into the vagina each morning and removed each night", "Inserted for 7 days, then immediately replaced with a new ring", "Kept in the vagina continuously for 3 months before removal", "Stays in the vagina for 3 weeks, followed by 7 days without a ring" ], correct: 3, rationale: "The vaginal ring stays in the vagina for 3 weeks. The user then takes it out, throws it away, and waits 7 days before inserting a new ring." },
                    { id: "q15", question: "How frequently must a woman apply a new contraceptive patch during a standard monthly cycle?", options: [ "Once every 3 weeks", "Once a week for 3 weeks, followed by a patch-free week", "Once every day throughout the entire month", "Once a month for exactly 7 days" ], correct: 1, rationale: "A contraceptive patch is put on for 7 days and then replaced with a new one. A woman uses three patches each month (one per week for 3 weeks)." },
                    { id: "q16", question: "When using Progestin-only pills without missing any doses, after how many days of absent menstruation should a woman obtain a pregnancy test?", options: [ "21 days", "30 days", "45 days", "60 days" ], correct: 2, rationale: "Health teaching for mini-pills advises that if a woman has not had a period for 45 days, even if she hasn't missed a pill, she should get a pregnancy test." },
                    { id: "q17", question: "Concurrent use of which of the following groups of medications can reduce the effectiveness of oral contraceptive pills?", options: [ "Vitamin C and daily multivitamin supplements", "Anti-epileptics, antibiotics, and laxatives", "Nonsteroidal anti-inflammatory drugs and pain relievers", "Beta-blockers and statins" ], correct: 1, rationale: "Drug interactions that reduce the efficacy of oral contraceptive pills include medications such as anti-epileptics, antibiotics, and laxatives." },
                    { id: "q18", question: "Which of the following is considered a non-contraceptive advantage of Combined Oral Contraceptive pills?", options: [ "Complete protection against all viral sexually transmitted diseases", "Prevention of ovarian cysts, ectopic pregnancies, and endometrial cancer", "Significant and rapid acquisition of bone mineral density in adults", "Immediate enhancement of natural fertility upon missing a single dose" ], correct: 1, rationale: "Non-contraceptive advantages of combined pills include regulating menstruation and helping to prevent ovarian cysts, ovarian cancer, ectopic pregnancies, and endometrial cancer." },
                    { id: "q19", question: "How long is a woman instructed to use a back-up method of birth control when she first begins taking Progestin-only pills?", options: [ "For the first 7 days", "For the first 14 days", "For at least the first month", "For at least the first 3 months" ], correct: 3, rationale: "A disadvantage of Progestin-only pills is that they require the use of a back-up method of birth control for about the first 3 months of pill taking." },
                    { id: "q20", question: "What specific postoperative instruction should a woman receive after the insertion of a contraceptive implant in her upper arm?", options: [ "Keep the insertion area dry and out of sunshine and water for the first 5 days", "Vigorously massage the insertion area twice daily to enhance hormone absorption", "Apply a hot, moist compress to the insertion site every evening for a week", "Begin upper arm weightlifting immediately to verify the implant remains secure" ], correct: 0, rationale: "Counseling for Implanon instructs the woman to keep the area of insertion dry and out of sunshine and water for the first 5 days and to avoid massage or vigorous movements." },
                    { id: "q21", question: "Why is a woman explicitly instructed not to massage the site after receiving an injectable contraceptive?", options: [ "It significantly increases the risk of a severe localized bacterial infection", "It can cause the needle track to open and bleed excessively", "It leads to fast absorption of the hormones, compromising effectiveness", "It causes immediate and irreversible peripheral nerve damage" ], correct: 2, rationale: "Health teaching dictates that the injection site should not be massaged because this will lead to fast absorption of the hormones, potentially altering its intended duration of action." },
                    { id: "q22", question: "What is identified as the most common adverse effect experienced by women using combined oral contraceptive pills?", options: [ "Severe hypertension requiring medication", "Breakthrough bleeding", "Deep vein thrombosis in the lower extremities", "Acute pancreatitis" ], correct: 1, rationale: "Breakthrough bleeding is explicitly identified as the most common adverse effect of combined oral contraceptive pills." },
                    { id: "q23", question: "How does the progesterone component in hormonal contraceptives alter cervical mucus to inhibit sperm penetration?", options: [ "It makes the mucus profuse, watery, and highly elastic", "It turns the mucus highly acidic to chemically destroy sperm on contact", "It makes the mucus scanty, viscous, and cellular with low stretchiness", "It induces the secretion of specific antibodies that clump sperm together" ], correct: 2, rationale: "Progesterone inhibits sperm penetration by making the cervical mucous unfriendly: it becomes scanty, viscous, and cellular with low spinnbarkeit (stretchiness)." },
                    { id: "q24", question: "While Combined Oral Contraceptives protect against endometrial and ovarian carcinoma, they can increase the incidence of which of the following conditions?", options: [ "Breast cancer and lung cancer", "Cervix cancer and liver benign adenoma", "Colon cancer and bleeding gastric ulcers", "Bone cancer and acute leukemia" ], correct: 1, rationale: "Under complications, it is noted that COCs increase the incidence of cervix cancer and benign liver adenomas, while protecting against endometrial and ovarian carcinoma." },
                    { id: "q25", question: "Estrogen has absolutely no role in inhibiting follicular development; this biological action is entirely achieved by progesterone.", options: [ "True", "False" ], correct: 1, rationale: "False. Estrogen does have some effect on inhibiting follicular development because of negative feedback on the anterior pituitary that slows FSH secretion, although it is not as prominent as progesterone's effect." },
                    { id: "q26", question: "Combined oral contraceptive pills should be discontinued one month prior to elective surgery to avoid an increased risk of postoperative thrombosis.", options: [ "True", "False" ], correct: 0, rationale: "True. Elective surgery is a relative contraindication, and the pill should be discontinued one month prior to avoid an increased risk of postoperative thrombosis." },
                    { id: "q27", question: "Progestin-only pills are generally more effective than Combined Oral Contraceptive pills in preventing pregnancy for women who are not breast-feeding.", options: [ "True", "False" ], correct: 1, rationale: "False. Progestin-only pills are less effective than combined pills (97-98% effectiveness compared to over 99% for COCs)." },
                    { id: "q28", question: "Sayana Press is a lower dose of medroxyprogesterone acetate that is administered subcutaneously and effectively suppresses ovulation for at least 13 weeks.", options: [ "True", "False" ], correct: 0, rationale: "True. Sayana Press contains a lower dose of MPA (104 mg/0.65 mL), is administered via the subcutaneous route, and effectively suppresses ovulation for at least 13 weeks." },
                    { id: "q29", question: "The contraceptive patch prevents pregnancy by releasing estrogen and progestogen, and it must be applied directly to the internal vaginal wall.", options: [ "True", "False" ], correct: 1, rationale: "False. The contraceptive patch is put on an area of clean dry hairless skin like the top of the arm, back, or bottom of the abdomen, not the vaginal wall." },
                    { id: "q30", question: "One of the major advantages of all hormonal contraceptive methods is that they provide substantial protection against sexually transmitted diseases.", options: [ "True", "False" ], correct: 1, rationale: "False. A listed disadvantage for multiple hormonal methods (COCs, injectables, implants) is that they do NOT protect against sexually transmitted diseases (STDs)." }
                ]
            },

                    { question: "According to the text, what is the typical failure rate of the hormonal IUD?", options: [ "0.02%", "0.08%", "0.8%", "0.2%" ], correct: 0, rationale: "The typical failure rate of hormonal IUDs is 0.02%, while copper IUDs have a 0.08% failure rate." },
                    { question: "Which of the following hormone-releasing IUDs offers up to 3 years of pregnancy protection?", options: [ "Skyla", "Mirena", "Liletta", "Kyleena" ], correct: 0, rationale: "Skyla offers 3 years of pregnancy protection, while others offer longer durations (Mirena 8 years, Liletta 6-8 years, Kyleena 5 years)." },

                    { question: "Which of the following is a non-contraceptive advantage specific to the progesterone-releasing IUD?", options: [ "Decreased primary dysmenorrhea", "Protection against sexually transmitted diseases", "Immediate reversibility without medical assistance", "Total elimination of the risk of ectopic pregnancy" ], correct: 0, rationale: "The progesterone releasing IUD offers two important non-contraceptive advantages: less blood loss during menstruation and decreased primary dysmenorrhea." },
                    { question: "What is the approximate risk percentage for the expulsion of an IUD?", options: [ "5 percent", "10 percent", "15 percent", "1 percent" ], correct: 0, rationale: "The risk of expulsion is approximately 5 percent, and it may occur especially during periods in the first 3 months." },

                    { question: "An absolute contraindication for a Copper-T IUD insertion is:", options: [ "Wilson's disease", "Being a woman over 35 years of age", "Hypertension or vascular disease", "Breastfeeding" ], correct: 0, rationale: "Wilson's disease or a copper allergy is a specific contraindication for the Copper-T IUD." },
                    { question: "Which adverse effect is specifically related to progestin IUDs such as Mirena or Skyla?", options: [ "Major depression", "Increased glycogen metabolism", "Heavier painful bleeding", "Copper allergy" ], correct: 0, rationale: "Progestin IUD related adverse effects include headache, hair loss, major depression, breast tenderness, vaginitis, and pelvic pain." },
                    { question: "What is the estimated rate of cervical or uterine perforation during IUD insertion?", options: [ "1 in 1000 insertions", "1 in 100 insertions", "1 in 5000 insertions", "5 in 100 insertions" ], correct: 0, rationale: "Cervical or uterine perforation on insertion is rare, occurring in about 1 in 1000 IUD insertions." },
                    { question: "During which timeframe is the risk of Pelvic Inflammatory Disease (PID) highest following an IUD insertion?", options: [ "The first 4 weeks post insertion", "The first 3 months post insertion", "The first 6 months post insertion", "After the first year of insertion" ], correct: 0, rationale: "The text states that the risk of pelvic infections (PID) is highest in the first 4 weeks post insertion." },
                    { question: "If a patient with an IUD in place is diagnosed with a sexually transmitted infection but shows NO signs of pelvic inflammatory disease, what is the recommended management?", options: [ "Leave the IUD in place and treat the sexually transmitted infection", "Immediately remove the IUD before starting any medication", "Perform a transvaginal ultrasound and then remove the IUD", "Replace the current IUD with a new one after 48 hours" ], correct: 0, rationale: "For a sexually transmitted infection without signs of PID, the IUD may be left in place and the STD treated." },
                    { question: "When is it appropriate to insert an IUD after childbirth?", options: [ "Within 10 minutes after delivery of the placenta", "Strictly between 3 and 5 days postpartum", "Exactly 12 hours before discharge from the hospital", "Only after the infant has been completely weaned" ], correct: 0, rationale: "Insertion after childbirth can happen within 10 minutes after delivery of the placenta, within 48 hours, or after 4-6 weeks." },
                    { question: "What is the recommended timeline for inserting a hormone-releasing IUD after childbirth?", options: [ "At least 6 weeks after childbirth", "As early as 4 weeks after childbirth", "Immediately prior to the delivery of the placenta", "Exactly 3 months postpartum" ], correct: 0, rationale: "A copper T IUD can be inserted as early as 4 weeks postpartum, but other IUDs (hormone-releasing) require at least 6 weeks." },
                    { question: "When preparing a patient for an IUD insertion, when should a pain reliever like ibuprofen be administered?", options: [ "30 minutes before insertion", "2 hours before insertion", "Immediately after the procedure is completed", "24 hours prior to the procedure" ], correct: 0, rationale: "Ibuprofen or paracetamol may be given 30 minutes before insertion to help manage discomfort." },
                    { question: "Why do many physicians prefer to insert the IUD during the normal menstrual flow?", options: [ "The cervical canal is already somewhat dilated", "It completely eliminates the risk of uterine perforation", "It prevents the need for any pain medication prior to insertion", "It ensures the IUD remains perfectly sterile during insertion" ], correct: 0, rationale: "Inserting during menses assures the patient isn't pregnant, the cervical canal is somewhat dilated for comfort, and post-insertion bleeding will go unnoticed." },
                    { question: "What instrument does the provider gently pass through the cervix to measure the depth and position of the uterus?", options: [ "Uterine sound", "Tenaculum", "Vaginal speculum", "Plunger" ], correct: 0, rationale: "The provider slowly and gently passes the uterine sound through the cervix to measure the depth and position of the uterus." },
                    { question: "How long are the strings typically left hanging out of the cervix after an IUD is properly placed?", options: [ "About 3 centimeters", "About 5 centimeters", "About 1 centimeter", "They are cut completely flush with the cervix" ], correct: 0, rationale: "The provider cuts the strings on the IUD leaving about 3 centimeters hanging out of the cervix." },
                    { question: "How soon after an IUD placement can a woman return to normal activities such as exercise and swimming?", options: [ "As soon as she is comfortable", "After a mandatory 48-hour bed rest period", "Only after her first post-insertion menstrual period", "After completing a 7-day course of prophylactic antibiotics" ], correct: 0, rationale: "Once the IUD is placed, women can return to normal activities such as sex, exercise, and swimming as soon as they are comfortable." },
                    { question: "According to the nursing role, how often should a woman check for the presence of the IUD strings during the first month?", options: [ "Once a week", "Every single day", "Only if she experiences severe abdominal pain", "Once at the end of the month" ], correct: 0, rationale: "After insertion, the woman should be instructed to check for the presence of the strings once a week for the first month and then after each menses." },
                    { question: "Which temperature threshold is considered a sign of Pelvic Inflammatory Disease (PID) that patients should be instructed to watch for?", options: [ "Fever of 38.3°C", "Fever of 37.5°C", "Fever of 39.5°C", "Fever of 40.0°C" ], correct: 0, rationale: "Patients must be instructed about signs and symptoms of PID including a fever of 38.3°C, purulent vaginal discharge, and abdominal/pelvic pain." },
                    { question: "What should be done if a pregnancy is confirmed with an IUD in place?", options: [ "Perform a transvaginal ultrasound to exclude an ectopic pregnancy", "Leave the IUD in place to prevent a spontaneous miscarriage", "Administer broad-spectrum antibiotics and monitor for 48 hours", "Immediately perform a dilation and curettage procedure" ], correct: 0, rationale: "If a patient becomes pregnant with an IUD in place, a transvaginal ultrasound to exclude an ectopic pregnancy is critical, followed by removal of the IUD to reduce risks." },
                    { question: "What is the estimated duration of the IUD insertion procedure?", options: [ "5 to 15 minutes", "30 to 45 minutes", "1 to 2 hours", "Less than 2 minutes" ], correct: 0, rationale: "The text specifies that the IUD insertion procedure takes about 5 to 15 minutes." },
                    { question: "Which of the following is a designated condition requiring the removal of an IUD?", options: [ "Menopause", "Being prescribed an antibiotic medication", "Experiencing minor spotting 2 weeks post-insertion", "The desire to engage in strenuous exercise" ], correct: 0, rationale: "Menopause is explicitly listed as a condition under which an IUD should be removed. Minor spotting early on is normal, and exercise/antibiotics are not indications for removal." },
                    { question: "Intrauterine devices (IUDs) provide strong protection against sexually transmitted diseases (STDs).", options: [ "True", "False" ], correct: 1, rationale: "False. A noted disadvantage of IUDs is that they do not protect against sexually transmitted diseases (STDs)." },
                    { question: "The use of an IUD does not interfere with a mother's ability to breastfeed.", options: [ "True", "False" ], correct: 0, rationale: "True. The text lists 'They didn’t affect lactation' under advantages, and 'Breast feeding' is listed under indications." },
                    { question: "The hormonal IUD works in part by releasing levonorgestrel, which thickens the cervical mucus to interfere with sperm motility.", options: [ "True", "False" ], correct: 0, rationale: "True. The hormonal IUD releases levonorgestrel which thickens the cervical mucus and interferes with sperm motility and transport." },

                    { id: 25, question: "What is the exact statistical effectiveness rate of vasectomy in the first year as described in the text?", options: [ "99 percent with less than 1 pregnancy per 100 women", "99.5 percent with less than 5 pregnancies per 1000 women", "98 percent with less than 2 pregnancies per 100 women", "100 percent with no documented pregnancies in the first year" ], correct: 0, rationale: "A vasectomy is 99 percent effective with less than 1 pregnant per 100 women in the first year, which equates to 2 in 1000." },
                    { id: 26, question: "How long should a man wait after a vasectomy before returning for a semen test to confirm the procedure's success?", options: [ "3 months", "1 week", "6 weeks", "6 months" ], correct: 0, rationale: "The instructions after vasectomy surgery state the patient should return for a semen test 3 months after the operation." },
                    { id: 27, question: "What happens to the ovum every month after a woman undergoes a tubal ligation?", options: [ "It is broken up and absorbed by the body", "It accumulates permanently in the fallopian tubes", "It is fertilized but cannot safely reach the uterus", "It stops being released from the ovaries entirely" ], correct: 0, rationale: "After the procedure, the ovaries still release an egg every month, but it is broken up and safely absorbed by the body." },
                    { id: 28, question: "What is the long-term effectiveness rate of hysteroscopic sterilization over a 5-year period?", options: [ "Less than 1 woman out of 1000 will become pregnant", "Less than 5 women out of 1000 will become pregnant", "Less than 1 woman out of 100 will become pregnant", "Less than 2 women out of 1000 will become pregnant" ], correct: 0, rationale: "The text specifies that less than 1 woman out of 1000 women will become pregnant within 5 years of having a hysteroscopic sterilization procedure." },
                    { id: 29, question: "Which of the following may occur as a specific syndrome following the surgical disconnection of the fallopian tubes?", options: [ "Post tubal ligation syndrome", "Post-vasectomy pain syndrome", "Epididymitis", "Uterine prolapse syndrome" ], correct: 0, rationale: "A known disadvantage of tubal ligation is the possibility of developing Post tubal ligation syndrome." },
                    { id: 30, question: "During a vasectomy procedure, after local anesthesia is given and the incision is made, what actions can be performed on the vas deferens?", options: [ "Ligation or electrocautery or applying metal or plastic clips", "Complete surgical removal of the entire vas deferens", "Injection of a chemical scarring agent into the tube", "Insertion of a metallic coil directly into the tube" ], correct: 0, rationale: "During the procedure, actions performed on the vas deferens include ligation, electrocautery, or applying metal or plastic clips." }
                ]
            }
        ];

        // --- 2. GLOBAL STATE ---
        let activeQuizIndex = null;
        let currentQuizData = [];
        let score = 0;
        let answeredCount = 0;

        // --- 3. UI NAVIGATION ---
        function renderMenu() {
            const grid = document.getElementById('portal-grid');
            grid.innerHTML = masterQuizData.map((quiz, idx) => `
                <div class="bg-white rounded-xl p-6 border-2 border-purple-200 hover:border-purple-500 hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center group" onclick="startQuiz(${idx})">
                    <div class="bg-purple-100 p-4 rounded-full mb-4 group-hover:bg-purple-200 transition">
                        <i class="fas fa-file-medical text-3xl text-purple-700"></i>
                    </div>
                    <h2 class="text-xl font-bold text-purple-900 mb-2 font-cairo">${quiz.title}</h2>
                    <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm font-semibold">${quiz.questions.length} Questions</span>
                </div>
            `).join('');
        }

        function showMenu() {
            document.getElementById('active-quiz-view').classList.add('hidden-content');
            document.getElementById('portal-menu').classList.remove('hidden-content');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startQuiz(index) {
            activeQuizIndex = index;
            const quiz = masterQuizData[index];
            
            // Set Titles
            document.getElementById('active-quiz-title').innerText = quiz.title;
            
            // Apply original shuffle logic
            currentQuizData = quiz.questions.map(q => {
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
            });

            // Reset Score State
            score = 0;
            answeredCount = 0;
            document.getElementById('result-summary').classList.add('hidden-content');
            
            // Render
            renderQuiz();

            // Toggle Views
            document.getElementById('portal-menu').classList.add('hidden-content');
            document.getElementById('active-quiz-view').classList.remove('hidden-content');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 4. RENDER & CHECK LOGIC (Preserved entirely) ---
        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${currentQuizData.length}`;
            const container = document.getElementById('quiz-container');
            container.innerHTML = currentQuizData.map((q, index) => {
                return `
                <div class="card bg-purple-100 rounded-xl p-6 mb-6 border border-purple-300 shadow-sm">
                    <div class="flex justify-between items-center mb-4 border-b border-purple-200 pb-3">
                        <span class="bg-purple-700 text-white text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                        ${q.options.length === 2 ? '<span class="bg-fuchsia-700 text-white text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-purple-950 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-purple-300 hover:bg-purple-200 hover:border-purple-500 focus:outline-none flex items-center justify-between group bg-purple-50"><span class="font-medium text-purple-900 group-hover:text-purple-950 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 rounded-xl p-5 border animate-fade-in text-left">
                        <p class="text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = currentQuizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) {
                    btn.classList.add('correct-answer');
                    btn.innerHTML += '<i class="fas fa-check float-right"></i>';
                } else if (i === optIndex) {
                    btn.classList.add('wrong-answer');
                    btn.innerHTML += '<i class="fas fa-times float-right"></i>';
                } else {
                    btn.classList.add('opacity-50');
                }
            });
            if (optIndex === q.correct) {
                score++;
                feedback.classList.add('correct-answer');
            } else {
                feedback.classList.add('wrong-answer');
            }
            answeredCount++;
            if (answeredCount === currentQuizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score / currentQuizData.length * 100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };

        // Attach Restart logic locally instead of force-reloading window
        document.getElementById('restart-btn').addEventListener('click', () => {
            if(activeQuizIndex !== null) {
                startQuiz(activeQuizIndex);
            }
        });

        // Initialize portal on load
        renderMenu();
    </script>
</body>
</html>
