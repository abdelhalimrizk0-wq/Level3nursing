<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Physiological & Psychological Changes during the Postpartum Period</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        const rawQuizData = [
            { 
                id: 1, 
                question: "Estrogen and progesterone actively stimulate the production of milk in the mammary glands during the third trimester.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Estrogen inhibits milk production until the end of pregnancy, although it prepares the breasts for lactation." 
            },
            { 
                id: 2, 
                question: "What is a typical pulse characteristic during the early postnatal period?", 
                options: ["Physiological bradycardia", "Persistent tachycardia", "Irregular palpitations", "Ventricular fibrillation"], 
                correct: 0, 
                rationale: "During the early postnatal period, the pulse is usually full and slow, known as physiological bradycardia." 
            },
            { 
                id: 3, 
                question: "Which characteristic is mostly associated with lochia alba?", 
                options: ["Creamy white discharge", "Bright red bleeding", "Pinkish yellow fluid", "Clear watery secretion"], 
                correct: 0, 
                rationale: "Lochia alba is described as a creamy white or pale yellowish discharge containing leukocytes and decidual cells." 
            },
            { 
                id: 4, 
                question: "The uterus normally returns to its prepregnant weight of approximately fifty grams by the sixth week postpartum.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "As involution is completed around the 6th week, the uterus weighs approximately 50 grams." 
            },
            { 
                id: 5, 
                question: "During which timeframe does the taking hold phase of maternal adaptation typically begin?", 
                options: ["The third day postpartum", "The second week postpartum", "The first hour postpartum", "The fourth week postpartum"], 
                correct: 0, 
                rationale: "The taking-hold phase starts on the third day postpartum when the mother becomes driven to organize herself." 
            },
            { 
                id: 6, 
                question: "How long does the postpartum period generally last following a normal full term birth?", 
                options: ["Forty days", "Seven days", "Twenty days", "Ninety days"], 
                correct: 0, 
                rationale: "The duration of the postpartum period is typically 40 days or 6-8 weeks for maximum involution." 
            },
            { 
                id: 7, 
                question: "Oxytocin acts on the myoepithelial cells to facilitate the expulsion of breast milk.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "Oxytocin leads to the contraction of myoepithelial cells and the subsequent expulsion of milk." 
            },
            { 
                id: 8, 
                question: "What is the estimated blood loss associated with a typical vaginal birth?", 
                options: ["Three to five hundred milliliters", "Five to one thousand milliliters", "One to two hundred milliliters", "Two to three thousand milliliters"], 
                correct: 0, 
                rationale: "The usual blood loss with a vaginal birth ranges from 300 to 500 milliliters." 
            },
            { 
                id: 9, 
                question: "The external opening of the cervix returns completely to its original nulliparous dimpled shape following childbirth.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "The characteristic dimple-like os of the nullipara changes permanently to a transverse slit in multiparous women." 
            },
            { 
                id: 10, 
                question: "Which process involves the breakdown of uterine muscle fiber protein by specific enzymes?", 
                options: ["Autolysis", "Ischemia", "Diuresis", "Hemostasis"], 
                correct: 0, 
                rationale: "Autolysis is the self-digestion where protein material of uterine muscle fibers is broken down by enzymes." 
            },
            { 
                id: 11, 
                question: "When do postpartum blues typically reach their highest intensity?", 
                options: ["Fourth or fifth day", "First or second day", "Tenth or twelfth day", "Second or third week"], 
                correct: 0, 
                rationale: "Postpartum blues peak on the 4th or 5th postpartum days and may last from hours to days." 
            },
            { 
                id: 12, 
                question: "A temporary state of urinary retention may occur in the first few days after labor due to loss of bladder tone.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "The parturient may experience retention of urine due to transient loss of bladder tone from the pressure of the fetal head." 
            },
            { 
                id: 13, 
                question: "What physiological event primarily causes the initial reactionary rise in maternal body temperature?", 
                options: ["Muscle waste absorption", "Breast milk engorgement", "Endometrial tissue infection", "Urinary tract colonization"], 
                correct: 0, 
                rationale: "The reactionary rise in temperature in the first 24 hours is due to the absorption of waste products of muscular contractions and dehydration." 
            },
            { 
                id: 14, 
                question: "How do clotting factors and fibrinogen behave during the immediate puerperium?", 
                options: ["They remain notably elevated", "They decrease very rapidly", "They vanish completely entirely", "They fluctuate unpredictably"], 
                correct: 0, 
                rationale: "Clotting factors and fibrinogen are normally increased during pregnancy and remain elevated in the immediate puerperium." 
            },
            { 
                id: 15, 
                question: "Where should the uterine fundus typically be felt at the end of the first week postpartum?", 
                options: ["Midway between umbilicus and symphysis", "At the level of the central umbilicus", "Just above the upper pelvic brim", "Slightly above the umbilicus region"], 
                correct: 0, 
                rationale: "At the end of the 1st week, the fundus is midway between the umbilicus and symphysis pubis." 
            },
            { 
                id: 16, 
                question: "Which symptom is a common integumentary change during the first week postpartum?", 
                options: ["Excessive sweating", "Severe skin flaking", "Increased pigmentation", "Chronic intense itchiness"], 
                correct: 0, 
                rationale: "Diaphoresis is common during the first week to reduce the fluids retained during pregnancy." 
            },
            { 
                id: 17, 
                question: "A sudden onset of hypotension during the immediate postpartum period may indicate hemorrhage.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "If hypotension is present after birth, postpartum hemorrhage is highly suspected." 
            },
            { 
                id: 18, 
                question: "Which factor is a significant predisposing cause of diastasis recti abdominis?", 
                options: ["Multiple pregnancies", "Excessive exercising", "Complete strict bedrest", "Uterine underdistention"], 
                correct: 0, 
                rationale: "Over distention of the uterus as in multiple pregnancies pre-disposes a woman to diastasis recti abdominis." 
            },
            { 
                id: 19, 
                question: "How long does lochia serosa typically last after the initial rubra phase?", 
                options: ["Three to four days", "One to two weeks", "Five to six hours", "Ten to twelve days"], 
                correct: 0, 
                rationale: "Lochia serosa typically lasts for another 3-4 days after the rubra phase." 
            },
            { 
                id: 20, 
                question: "Which maternal phase involves the woman being passive and highly dependent on others?", 
                options: ["Taking in phase", "Taking hold phase", "Letting go phase", "Moving forward phase"], 
                correct: 0, 
                rationale: "During the taking-in phase, the woman reacts passively and is mostly dependent on others to meet her needs." 
            },
            { 
                id: 21, 
                question: "How much additional weight loss is typically attributed to the combined effects of diuresis and diaphoresis?", 
                options: ["Two to four kilograms", "Four to five kilograms", "One to two kilograms", "Five to seven kilograms"], 
                correct: 0, 
                rationale: "The rapid diuresis and diaphoresis during the second to fifth days after birth cause a 2 to 4 kg weight loss." 
            },
            { 
                id: 22, 
                question: "A spontaneous bowel evacuation is guaranteed to occur within the first twenty four hours after childbirth.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "A spontaneous bowel evacuation may not occur for 2 to 3 days after birth due to decreased motility." 
            },
            { 
                id: 23, 
                question: "What condition results from the vigorous contraction of uterine muscle fibers pinching open blood vessels?", 
                options: ["Ischemia", "Autolysis", "Diaphoresis", "Diuresis"], 
                correct: 0, 
                rationale: "Ischemia occurs when vigorous contractions act as living ligatures, reducing blood supply and stopping bleeding." 
            },
            { 
                id: 24, 
                question: "Lactosuria is most frequently observed on the very first day immediately following childbirth.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Lactosuria is common with milk engorgement on the 4th day at the start of lactation." 
            },
            { 
                id: 25, 
                question: "By what percentage does the maternal cardiac output normally decrease two weeks after birth?", 
                options: ["Thirty percent", "Fifty percent", "Ten percent", "Seventy percent"], 
                correct: 0, 
                rationale: "By 2 weeks after birth, cardiac output decreases by 30%." 
            },
            { 
                id: 26, 
                question: "Which abnormal lochia sign strongly suggests the presence of retained placental fragments?", 
                options: ["Prolonged rubra discharge", "Sudden complete suppression", "Fetid offensive odor", "Clear serous weeping"], 
                correct: 0, 
                rationale: "Prolongation of lochia rubra beyond the 7th postpartum day suggests retained parts of the placenta." 
            },
            { 
                id: 27, 
                question: "Perineal tightening exercises can successfully improve the tone and contractility of the vaginal orifice.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "Tone and contractility of the vaginal orifice may be improved by perineal tightening exercises like Kegel exercises." 
            },
            { 
                id: 28, 
                question: "When do nonlactating mothers generally begin to menstruate following childbirth?", 
                options: ["Six to eight weeks", "One to two weeks", "Ten to twelve weeks", "Three to four months"], 
                correct: 0, 
                rationale: "Mothers begin to menstruate in 6-8 weeks following birth." 
            },
            { 
                id: 29, 
                question: "Which factor can trigger a transient rise in body temperature on the third or fourth postpartum day?", 
                options: ["Breast milk engorgement", "Severe muscle weakness", "Extreme fluid retention", "Sudden blood volume loss"], 
                correct: 0, 
                rationale: "On the third or fourth day there may be a transient rise of temperature due to breast milk engorgement, constipation, or nervous excitation." 
            },
            { 
                id: 30, 
                question: "The letting go phase generally occurs after the mother has completely returned to her home environment.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "The letting-go phase generally occurs when the mother returns home and establishes her mothering functions." 
            }
        ];

        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
