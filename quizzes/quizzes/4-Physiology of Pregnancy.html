<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Physiology of Pregnancy</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY (GENERATE 50 QUESTIONS HERE) ---
        const rawQuizData = [
            { id: 1, question: "Which structural group primarily develops from the ectoderm layer?", options: ["Skin and nervous system", "Bones and blood vessels", "Mucous membranes and glands", "Muscles and cardiac tissue"], correct: 0, rationale: "After implantation, the ectoderm mainly forms the skin and nervous system." },
            { id: 2, question: "Fertilization normally occurs in the ampulla of the fallopian tube.", options: ["True", "False"], correct: 0, rationale: "Fertilization is the union of the male sperm and female ovum, which normally takes place in the ampulla of the fallopian tube." },
            { id: 3, question: "Approximately how many spermatozoa reach the cervical mucus after being deposited in the vagina?", options: ["Two million", "Three million", "Three hundred thousand", "Three hundred million"], correct: 0, rationale: "About 300 million sperm are deposited at intercourse, but only approximately 2 million reach the loose cervical mucus while the rest are destroyed." },
            { id: 4, question: "What does the peripheral layer of the morula eventually form?", options: ["The placenta", "The embryo", "The yolk sac", "The amniotic sac"], correct: 0, rationale: "The peripheral layer of the morula is called the trophoblast, which eventually forms the placenta." },
            { id: 5, question: "Capacitation is a reversible process that involves an increase in sperm motility.", options: ["True", "False"], correct: 1, rationale: "Capacitation is an irreversible process involving an increase in sperm motility and the removal of surface proteins before fertilization." },
            { id: 6, question: "When is the process of implantation normally completed?", options: ["The eleventh day after ovulation", "The seventh day after fertilization", "The fourth day after ovulation", "The fourteenth day after fertilization"], correct: 0, rationale: "The implantation process begins about the 7th day after fertilization and is normally complete by the 11th day after ovulation." },
            { id: 7, question: "Which specific structure eventually develops into the fully functioning placenta?", options: ["Chorionic frondosum", "Chorionic laeve", "Zona pellucida", "Corona radiata"], correct: 0, rationale: "The chorionic villi become more profuse in the decidual basalis forming the Chorionic frondosum, which develops directly into the placenta." },
            { id: 8, question: "The yolk sac lies on the side of which specific embryonic layer?", options: ["Endoderm", "Ectoderm", "Mesoderm", "Trophoblast"], correct: 0, rationale: "The yolk sac lies on the side of the endoderm and provides brief nourishment for the developing embryo." },
            { id: 9, question: "Ova are considered fertile for about twelve to twenty four hours after ovulation.", options: ["True", "False"], correct: 0, rationale: "A mature ovum is generally considered fertile for about 12 to 24 hours after ovulation occurs." },
            { id: 10, question: "Which hormone influences the cervix to secrete thin alkaline mucus during ovulation?", options: ["Estrogen", "Progesterone", "Testosterone", "Prolactin"], correct: 0, rationale: "At ovulation the cervix secretes a flow of thin alkaline mucus that attracts spermatozoa under the influence of estrogen." },
            { id: 11, question: "The embryonic period of development spans across which specific time frame?", options: ["Week two to week eight", "Week one to week two", "Week eight to birth", "Week ten to week twelve"], correct: 0, rationale: "The embryonic period encompasses the time frame from 2 to 8 weeks of gestation." },
            { id: 12, question: "The cells of the morula become grouped into an inner cell mass made of large cells.", options: ["True", "False"], correct: 1, rationale: "The inner cell mass is composed of small cells, whereas the peripheral layer is composed of large cells." },
            { id: 13, question: "How long do spermatozoa remain in the uterine tubes to undergo capacitation before fertilizing the ovum?", options: ["2 to 6 hours", "30 to 40 minutes", "12 to 24 hours", "48 to 72 hours"], correct: 0, rationale: "Spermatozoa reach the tubes quickly but remain for 2 to 6 hours undergoing enzymatic changes known as capacitation before they can fertilize the ovum." },
            { id: 14, question: "What causes the morula to transition into a blastocyst?", options: ["Fluid collection", "Cell division", "Enzymatic changes", "Implantation process"], correct: 0, rationale: "Fluid collects between the inner cell mass and the peripheral layer of the morula, which leads to the formation of the blastocyst." },
            { id: 15, question: "When is the placenta completely formed and functioning?", options: ["Ten to twelve weeks", "Eight to ten weeks", "Four to six weeks", "Two to four weeks"], correct: 0, rationale: "The placenta is completely formed and fully functioning from 10 to 12 weeks after fertilization." },
            { id: 16, question: "The amniotic sac lies on the side of the ectoderm and contains fluid.", options: ["True", "False"], correct: 0, rationale: "The amniotic sac is a cavity located on the side of the ectoderm containing what is later called amniotic fluid." },
            { id: 17, question: "At what point is the developing organism officially referred to as a fetus?", options: ["After week eight", "After week two", "After week four", "After week twelve"], correct: 0, rationale: "The developing zygote is referred to as an embryo up to 8 weeks, after which it is known as a fetus until birth." },
            { id: 18, question: "What is the approximate diameter of a mature ovum?", options: ["0.15 millimeters", "0.25 millimeters", "1.15 millimeters", "1.50 millimeters"], correct: 0, rationale: "A mature ovum is about 0.15 mm in diameter and surrounded by the zona pellucida and corona radiata." },
            { id: 19, question: "What primarily prevents multiple spermatozoa from penetrating a single ovum?", options: ["Enzyme release", "Motility decrease", "Protein removal", "Mucus secretion"], correct: 0, rationale: "As soon as fusion occurs, the zona pellucida goes through chemical changes and releases an enzyme making it impossible for other spermatozoa to penetrate." },
            { id: 20, question: "What is formed by the combination of the ectoderm endoderm and mesoderm layers?", options: ["Embryonic plate", "Chorionic frondosum", "Decidual basalis", "Chorionic laeve"], correct: 0, rationale: "The three primary layers combined are known as the embryonic plate." }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
