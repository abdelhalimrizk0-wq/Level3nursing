<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Antenatal Care</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY (GENERATE 50 QUESTIONS HERE) ---
        const rawQuizData = [
            { id: 1, question: "Fetal heart sound is normally heard using a Pinard stethoscope after the tenth week of pregnancy.", options: ["True", "False"], correct: 1, rationale: "Fetal heart sound is heard by a Pinard stethoscope after the twentieth week of pregnancy. A sonicaid is used to hear it as early as the tenth week." },
            { id: 2, question: "Which maternal characteristic classifies a pregnant woman as having an intermediate risk.", options: ["Normal weight and height", "Parity of four and more", "History of diabetes mellitus", "Adequate hemoglobin levels"], correct: 1, rationale: "A parity of four and more places the pregnant woman in the intermediate risk category according to the risk assessment guidelines." },
            { id: 3, question: "What is the expected total maternal weight gain during a normal pregnancy.", options: ["Eight kilograms", "Ten kilograms", "Twelve kilograms", "Fourteen kilograms"], correct: 2, rationale: "The approximate weight gain during a normal pregnancy is twelve kilograms, distributed as two kilograms in the first half and ten kilograms in the second half." },
            { id: 4, question: "What is the normal coagulation time during pregnancy compared to the nonpregnant state.", options: ["Six minutes", "Eight minutes", "Ten minutes", "Twelve minutes"], correct: 1, rationale: "Coagulation time changes from twelve minutes to eight minutes during pregnancy, increasing the capacity for clotting and the risk of thrombosis." },
            { id: 5, question: "Quickening is considered a positive sign of pregnancy that confirms the presence of a fetus.", options: ["True", "False"], correct: 1, rationale: "Quickening is a presumptive symptom of pregnancy, meaning it suggests but does not positively confirm the pregnancy." },
            { id: 6, question: "The absence of fetal movements precedes intrauterine fetal death by how many hours.", options: ["Twelve hours", "Twenty hours", "Twenty four hours", "Twenty eight hours"], correct: 3, rationale: "The absence of fetal movements typically precedes intrauterine fetal death by twenty eight hours." },
            { id: 7, question: "Which components are used to calculate the estimated due date according to Naegele rule.", options: ["Add seven days and subtract three months", "Add seven days and add three months", "Subtract seven days and add three months", "Subtract seven days and subtract three months"], correct: 0, rationale: "Naegele rule calculates the estimated due date by adding seven days to the first day of the last menstrual period, subtracting three months, and adding one year." },
            { id: 8, question: "Preconception care emphasizes interventions given to females only after conception occurs.", options: ["True", "False"], correct: 1, rationale: "Preconception care is a set of interventions given to females before conception to identify and modify biomedical, behavioral, and social risks." },
            { id: 9, question: "Which medical disease is directly classified as a high risk condition during pregnancy.", options: ["Essential hypertension", "Diabetes mellitus", "Mild cardiac disease", "Treated renal disease"], correct: 1, rationale: "Diabetes mellitus is explicitly classified as a high risk medical disease during pregnancy." },
            { id: 10, question: "Which clinical finding is classified as a probable sign of pregnancy.", options: ["History of amenorrhea", "Morning sickness complaint", "Positive pregnancy test", "Hearing fetal heart rate"], correct: 2, rationale: "A positive pregnancy test is considered a probable sign, which strongly indicates pregnancy but does not definitively confirm it." },
            { id: 11, question: "What clinical condition causes the uterus to be lower than expected for the period of gestation.", options: ["Multiple pregnancy", "Polyhydramnios", "Large fetus", "Oligohydramnios"], correct: 3, rationale: "The uterus may be lower than expected due to a small fetus, intrauterine growth retardation, oligohydramnios, or a mistaken date of the last menstrual period." },
            { id: 12, question: "Hemodilution during pregnancy typically results in a lowered maternal hemoglobin level.", options: ["True", "False"], correct: 0, rationale: "Hemodilution of blood during pregnancy causes a physiological decrease in hemoglobin levels, hematocrit, and red blood cell count." },
            { id: 13, question: "Which maternal posture defines the relationship of fetal parts to one another.", options: ["Fetal lie", "Fetal presentation", "Fetal attitude", "Fetal position"], correct: 2, rationale: "Fetal attitude refers to the posturing of the joints and the relation of the fetal parts to one another." },
            { id: 14, question: "What maternal height measurement gives an indication of a contracted pelvis.", options: ["Less than one hundred fifty centimeters", "Exactly one hundred sixty centimeters", "More than one hundred sixty centimeters", "Exactly one hundred seventy centimeters"], correct: 0, rationale: "A maternal height shorter than one hundred fifty centimeters gives an indication of a contracted pelvis." },
            { id: 15, question: "It is recommended that all pregnant women see a trained health provider at least four times during pregnancy.", options: ["True", "False"], correct: 0, rationale: "To be most effective, it is recommended that all mothers see a trained provider at least four times during pregnancy at regular intervals." },
            { id: 16, question: "A raised systolic blood pressure indicates toxemia if it is above the baseline by how many millimeters of mercury.", options: ["Ten millimeters", "Twenty millimeters", "Thirty millimeters", "Forty millimeters"], correct: 2, rationale: "In late pregnancy, a raised systolic pressure of thirty millimeters of mercury above the baseline on two occasions indicates toxemia." },
            { id: 17, question: "At what gestational age should the hemoglobin test be routinely repeated.", options: ["Twenty weeks", "Twenty eight weeks", "Thirty two weeks", "Thirty six weeks"], correct: 3, rationale: "Hemoglobin testing should be routinely repeated at thirty six weeks of gestation during follow-up visits." },
            { id: 18, question: "The maternal abdomen appears longer if the fetal lie is transverse rather than longitudinal.", options: ["True", "False"], correct: 1, rationale: "The abdomen is longer if the fetal lie is longitudinal, and it appears lower and broad if the lie is transverse." },
            { id: 19, question: "Which diagnostic method is used to detect deep vein thrombosis during the examination of the legs.", options: ["Homan test", "Pawlik maneuver", "Pinard stethoscope", "Naegele rule"], correct: 0, rationale: "The calf must be observed for reddened areas or white areas which could be caused by deep vein thrombosis, often checked using the Homan test." },
            { id: 20, question: "Which service is a core component of preconception care.", options: ["Family planning counseling", "Fetal heart rate monitoring", "Measurement of fundal height", "Administration of analgesics"], correct: 0, rationale: "Family planning counseling to avoid unplanned pregnancies is a key component of preconception care." },
            { id: 21, question: "A primigravida is automatically classified as a low risk pregnancy due to the absence of previous complications.", options: ["True", "False"], correct: 1, rationale: "Being a primigravida classifies a pregnant woman under the intermediate risk category, not low risk." },
            { id: 22, question: "Which assessment finding provides a definite positive indication of pregnancy.", options: ["Breast tenderness", "Urinary frequency", "Fetal outline confirmation", "Abdominal enlargement"], correct: 2, rationale: "Ultrasonography to confirm the fetal outline is a positive or sure sign that definitively confirms the pregnancy." },
            { id: 23, question: "What is the normal baseline fetal heart rate range.", options: ["Eighty to one hundred beats per minute", "One hundred to one hundred twenty beats per minute", "One hundred twenty to one hundred sixty beats per minute", "One hundred sixty to two hundred beats per minute"], correct: 2, rationale: "The normal fetal heart rate ranges from one hundred twenty to one hundred sixty beats per minute." },
            { id: 24, question: "The uterus becomes palpable over the maternal abdomen after the twelfth week of gestation.", options: ["True", "False"], correct: 0, rationale: "The uterus will be palpable per abdomen after the twelfth week of gestation." },
            { id: 25, question: "Which specific type of white blood cell increases during pregnancy to enhance bactericidal properties.", options: ["Eosinophils", "Neutrophils", "Basophils", "Lymphocytes"], correct: 1, rationale: "White blood cells increase during pregnancy, especially neutrophils, which account for more than seventy percent of the increase." },
            { id: 26, question: "Which detail is primarily recorded under the obstetrical history during the initial visit.", options: ["Serious childhood illnesses", "Current maternal occupation", "Previous spontaneous abortions", "Known parental consanguinity"], correct: 2, rationale: "The date of the last abortion is recorded as part of the details of previous pregnancies under obstetrical history." },
            { id: 27, question: "Premature rupture of membranes is classified as a high risk condition if it occurs between which weeks of gestation.", options: ["Twenty to twenty four weeks", "Twenty four to twenty eight weeks", "Twenty eight to thirty three weeks", "Thirty four to thirty seven weeks"], correct: 2, rationale: "Premature rupture of membranes occurring specifically between twenty eight and thirty three weeks is classified as a high risk condition." },
            { id: 28, question: "What is the definition of the prefix ante in the context of maternity care.", options: ["After delivery", "Before delivery", "During delivery", "Following delivery"], correct: 1, rationale: "Ante means before, while natal means delivery, making antenatal care the care given before delivery." },
            { id: 29, question: "Which physical change is classified strictly as a presumptive sign of pregnancy.", options: ["Softening of the isthmus", "Positive pregnancy test", "Hearing fetal movement", "Chloasma and linea nigra"], correct: 3, rationale: "Chloasma and linea nigra are classified as presumptive signs, which suggest pregnancy but do not positively indicate it." },
            { id: 30, question: "White blood cells decrease during pregnancy to reduce the risk of maternal autoimmune diseases.", options: ["True", "False"], correct: 1, rationale: "White blood cells actually increase during pregnancy to enhance the blood phagocytic and bactericidal properties." },
            { id: 31, question: "Which obstetric technique is specifically used to locate the round hard head of the fetus and judge its mobility.", options: ["Homan test", "Pawlik maneuver", "Naegele rule", "Pinard method"], correct: 1, rationale: "Pawlik maneuver is used during abdominal palpation to locate the round hard head and judge its size, flexion, and mobility." },
            { id: 32, question: "Which finding places a pregnant woman in the intermediate risk category.", options: ["Uncontrolled premature labor", "Previous neonatal death", "Severe growth retardation", "Major fetal abnormality"], correct: 1, rationale: "A previous stillbirth or neonatal death places the mother in the intermediate risk category, whereas the other options are high risk conditions." },
            { id: 33, question: "How many fetal movements should a pregnant woman report feeling within a twelve hour period.", options: ["At least five movements", "At least ten movements", "At least fifteen movements", "At least twenty movements"], correct: 1, rationale: "During a fetal kick count assessment, the pregnant woman is expected to report at least ten movements in twelve hours." },
            { id: 34, question: "Cardiotocography is primarily used to record the maternal heartbeat and respiratory rate during pregnancy.", options: ["True", "False"], correct: 1, rationale: "Cardiotocography is an electronic fetal monitor used to record the fetal heartbeat and uterine contractions, not maternal respiratory rate." },
            { id: 35, question: "Which goal is a primary objective of prenatal care.", options: ["To reduce the number of breastfed babies", "To increase maternal and perinatal mortality", "To prepare the mother for labor and lactation", "To eliminate all possible pregnancy risks entirely"], correct: 2, rationale: "Preparing the mother for labor, lactation, and subsequent care of her child is a direct objective of prenatal care." },
            { id: 36, question: "What is the expected weight gain for a pregnant woman during the first twenty weeks of gestation.", options: ["One kilogram", "Two kilograms", "Ten kilograms", "Twelve kilograms"], correct: 1, rationale: "The approximate weight gain in the first twenty weeks is two kilograms, followed by ten kilograms in the remaining twenty weeks." },
            { id: 37, question: "A mucoid vaginal loss should be immediately reported to the obstetrician if it occurs before which week of pregnancy.", options: ["Twenty fourth week", "Twenty eighth week", "Thirty second week", "Thirty seventh week"], correct: 3, rationale: "Women are instructed to report any mucoid loss to the obstetrician if it happens before the thirty seventh week of pregnancy." },
            { id: 38, question: "Which clinical sign observed on the face indicates maternal anemia.", options: ["Facial edema", "Skin pallor", "Prominent chloasma", "Dark pigmentation"], correct: 1, rationale: "The face is observed during the general examination for skin color changes such as pallor, which is an indicator of anemia." },
            { id: 39, question: "What urine specific gravity level may be found due to the physiological changes of pregnancy.", options: ["Less than one point one zero two", "More than one point one zero two", "Less than two point one zero two", "More than two point one zero two"], correct: 0, rationale: "A low specific gravity of urine, specifically less than 1.102, may be found due to the normal physiological changes of pregnancy." },
            { id: 40, question: "Hegar sign is clinically defined as which anatomical change during early pregnancy.", options: ["Softening of the isthmus", "Enlargement of the abdomen", "Discoloration of the vagina", "Tenderness of the breasts"], correct: 0, rationale: "Hegar sign is a probable sign of pregnancy characterized by the softening of the uterine isthmus." }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
