  { id: 2, question: "Which factor contributes to the occurrence of renal glucosuria during pregnancy?", options: ["Reduced renal threshold", "Increased maternal insulin", "Decreased filtration rate", "Enhanced tubular reabsorption"], correct: 0, rationale: "Renal glucosuria is not uncommon due to a reduced renal threshold for glucose in pregnancy and should be differentiated from gestational diabetes." },
  { id: 3, question: "At which gestational age does the uterus typically regain a pyriform shape after being globular?", options: ["Eighth week", "Twelfth week", "Sixteenth week", "Twentieth week"], correct: 2, rationale: "The nonpregnant uterus is an inverted pear shape. At the 8th and 12th weeks, it is globular, and at the 16th week, it becomes pyriform again." },
  { id: 4, question: "What causes the delayed emptying of the stomach and reduced intestinal peristalsis during pregnancy?", options: ["Smooth muscle relaxing effect", "Mechanical abdominal compression", "Increased gastric acid secretion", "Elevated gonadotropin levels"], correct: 0, rationale: "The smooth muscle relaxing effect of progesterone causes delayed emptying of the stomach and reduced intestinal peristalsis, leading to flatulence and constipation." },

  { id: 10, question: "Which sign is characterized by the bluish discoloration of the vagina due to increased blood supply?", options: ["Goodell sign", "Chadwick sign", "Braxton Hicks sign", "Montgomery sign"], correct: 1, rationale: "An increased blood supply results in the bluish discoloration of the vagina, which is clinically known as Chadwick's sign." },
  { id: 11, question: "The nervous system remains completely undisturbed functionally throughout the entire duration of normal pregnancy.", options: ["True", "False"], correct: 1, rationale: "The nervous system becomes functionally disturbed by pregnancy, leading to issues like morning sickness of neurotic origin, sleepiness, depression, irritability, and insomnia." },
  { id: 12, question: "Which layer of the uterine muscle consists of a meshwork of interlacing fibers?", options: ["Outer longitudinal layer", "Inner circular layer", "Intermediate meshwork layer", "Internal mucosal layer"], correct: 2, rationale: "The muscle wall of the uterus consists of 3 layers in late pregnancy: an outer thin longitudinal layer, a thin inner circular layer, and a thick intermediate layer consisting of a meshwork of interlacing fibers." },
  { id: 13, question: "When does the cardiac output reach its maximum increase during pregnancy?", options: ["Twelfth to sixteenth week", "Twentieth to twenty fourth week", "Twenty eighth to thirty second week", "Thirty sixth to fortieth week"], correct: 2, rationale: "The cardiac output increases by about 30-50%, starting from the 12th week and reaching a maximum between the 28th and 32nd week of pregnancy." },
  { id: 14, question: "A waddling gait during pregnancy is caused by relaxation of the pelvic joint due to hormonal influences.", options: ["True", "False"], correct: 0, rationale: "A waddling gait occurs due to the relaxation of the pelvic joint because of hormonal influences such as relaxin and progesterone." },
  { id: 15, question: "What is the average total maternal weight gain during pregnancy?", options: ["Eight kilograms", "Ten kilograms", "Twelve kilograms", "Fourteen kilograms"], correct: 2, rationale: "Maternal body weight increases in pregnancy, except in the first trimester due to morning sickness, with an average total gain of 12 kg." },
  { id: 16, question: "Which group is most likely to exhibit marked progressive dilatation of the renal pelvis and ureter?", options: ["Multigravida women on the left side", "Primigravida women on the right side", "Multigravida women on the right side", "Primigravida women on the left side"], correct: 1, rationale: "There is progressive dilatation of the renal pelvis and ureter from the 16th week; this dilatation is marked in primigravida and is more on the right side." },
  { id: 17, question: "Peptic ulcers typically become more active and symptomatic during the course of pregnancy.", options: ["True", "False"], correct: 1, rationale: "Gastric acidity is often reduced during pregnancy, which causes peptic ulcers to become quiet rather than more active." },
  { id: 18, question: "How long does the corpus luteum produce high levels of estrogen and progesterone before the placenta takes over?", options: ["Four to six weeks", "Ten to twelve weeks", "Sixteen to eighteen weeks", "Twenty to twenty two weeks"], correct: 1, rationale: "The corpus luteum enlarges, producing a high level of estrogen and progesterone in the first 10-12 weeks." },
  { id: 19, question: "What defines the decidua basalis?", options: ["Decidua that covers the embryo completely", "Uterine lining not in contact with the fetus", "Uterine lining situated beneath implantation", "Mucous plug collected in the cervical canal"], correct: 2, rationale: "The decidua basalis is defined as the uterine lining located directly beneath the site of implantation." },
  { id: 20, question: "Pregnancy is typically associated with a state of hypercoagulability where fibrinogen becomes doubled.", options: ["True", "False"], correct: 0, rationale: "Normal pregnancy is associated with hyper-coagulability, and fibrinogen levels become doubled." },

  { id: 22, question: "What is the normal weight of the uterus at term under the influence of hormonal changes?", options: ["Five hundred grams", "Eight hundred grams", "One thousand grams", "Twelve hundred grams"], correct: 2, rationale: "The uterus grows and its weight increases from 50 grams before pregnancy to 1000 grams at term." },
  { id: 23, question: "Plasma urea and creatinine levels progressively increase due to enhanced renal blood flow during pregnancy.", options: ["True", "False"], correct: 1, rationale: "Renal blood flow increases in pregnancy, causing an increase in glomerular filtration which is associated with a FALL in plasma urea and creatinine levels, not an increase." },
  { id: 24, question: "How much protein is typically retained by the end of pregnancy due to positive nitrogen balance?", options: ["Two hundred grams", "Three hundred grams", "Four hundred grams", "Five hundred grams"], correct: 3, rationale: "There is a positive nitrogen balance in pregnancy, and about 500 grams of protein are retained by the end of pregnancy." },
  { id: 25, question: "What causes supine hypotension syndrome in a pregnant woman?", options: ["Enlarged uterus pressing on the inferior vena cava", "Significant reduction in maternal blood volume", "Upward displacement of the maternal diaphragm", "Increased peripheral resistance of blood vessels"], correct: 0, rationale: "Supine hypotension syndrome occurs when the enlarged uterus presses on the inferior vena cava in the supine position, reducing venous return to the heart." },
  { id: 26, question: "Increased activity of sebaceous glands due to progesterone excess can lead to acne and oily skin.", options: ["True", "False"], correct: 0, rationale: "Increased activity of sebaceous glands due to progesterone excess occurs in pregnancy and is manifested by acne, oily skin, and oily hair." },
  { id: 27, question: "From which part of the uterus does the lower uterine segment develop in late pregnancy?", options: ["Uterine fundus", "Uterine isthmus", "Cervical canal", "Uterine cornua"], correct: 1, rationale: "The lower uterine segment becomes developed in late pregnancy from the isthmus of the uterus." },

  { id: 1, question: "Fetal heart sound is normally heard using a Pinard stethoscope after the tenth week of pregnancy.", options: ["True", "False"], correct: 1, rationale: "Fetal heart sound is heard by a Pinard stethoscope after the twentieth week of pregnancy. A sonicaid is used to hear it as early as the tenth week." },
  { id: 2, question: "Which maternal characteristic classifies a pregnant woman as having an intermediate risk.", options: ["Normal weight and height", "Parity of four and more", "History of diabetes mellitus", "Adequate hemoglobin levels"], correct: 1, rationale: "A parity of four and more places the pregnant woman in the intermediate risk category according to the risk assessment guidelines." },
  { id: 3, question: "What is the expected total maternal weight gain during a normal pregnancy.", options: ["Eight kilograms", "Ten kilograms", "Twelve kilograms", "Fourteen kilograms"], correct: 2, rationale: "The approximate weight gain during a normal pregnancy is twelve kilograms, distributed as two kilograms in the first half and ten kilograms in the second half." },
  { id: 4, question: "What is the normal coagulation time during pregnancy compared to the nonpregnant state.", options: ["Six minutes", "Eight minutes", "Ten minutes", "Twelve minutes"], correct: 1, rationale: "Coagulation time changes from twelve minutes to eight minutes during pregnancy, increasing the capacity for clotting and the risk of thrombosis." },
  { id: 5, question: "Quickening is considered a positive sign of pregnancy that confirms the presence of a fetus.", options: ["True", "False"], correct: 1, rationale: "Quickening is a presumptive symptom of pregnancy, meaning it suggests but does not positively confirm the pregnancy." },
  { id: 6, question: "The absence of fetal movements precedes intrauterine fetal death by how many hours.", options: ["Twelve hours", "Twenty hours", "Twenty four hours", "Twenty eight hours"], correct: 3, rationale: "The absence of fetal movements typically precedes intrauterine fetal death by twenty eight hours." },
  { id: 7, question: "Which components are used to calculate the estimated due date according to Naegele rule.", options: ["Add seven days and subtract three months", "Add seven days and add three months", "Subtract seven days and add three months", "Subtract seven days and subtract three months"], correct: 0, rationale: "Naegele rule calculates the estimated due date by adding seven days to the first day of the last menstrual period, subtracting three months, and adding one year." },
  { id: 8, question: "Preconception care emphasizes interventions given to females only after conception occurs.", options: ["True", "False"], correct: 1, rationale: "Preconception care is a set of interventions given to females before conception to identify and modify biomedical, behavioral, and social risks." },
  { id: 9, question: "Which medical disease is directly classified as a high risk condition during pregnancy.", options: ["Essential hypertension", "Diabetes mellitus", "Mild cardiac disease", "Treated renal disease"], correct: 1, rationale: "Diabetes mellitus is explicitly classified as a high risk medical disease during pregnancy." },
  { id: 10, question: "Which clinical finding is classified as a probable sign of pregnancy.", options: ["History of amenorrhea", "Morning sickness complaint", "Positive pregnancy test", "Hearing fetal heart rate"], correct: 2, rationale: "A positive pregnancy test is considered a probable sign, which strongly indicates pregnancy but does not definitively confirm it." },
  { id: 11, question: "What clinical condition causes the uterus to be lower than expected for the period of gestation.", options: ["Multiple pregnancy", "Polyhydramnios", "Large fetus", "Oligohydramnios"], correct: 3, rationale: "The uterus may be lower than expected due to a small fetus, intrauterine growth retardation, oligohydramnios, or a mistaken date of the last menstrual period." },
  { id: 12, question: "Hemodilution during pregnancy typically results in a lowered maternal hemoglobin level.", options: ["True", "False"], correct: 0, rationale: "Hemodilution of blood during pregnancy causes a physiological decrease in hemoglobin levels, hematocrit, and red blood cell count." },
  { id: 13, question: "Which maternal posture defines the relationship of fetal parts to one another.", options: ["Fetal lie", "Fetal presentation", "Fetal attitude", "Fetal position"], correct: 2, rationale: "Fetal attitude refers to the posturing of the joints and the relation of the fetal parts to one another." },
  { id: 14, question: "What maternal height measurement gives an indication of a contracted pelvis.", options: ["Less than one hundred fifty centimeters", "Exactly one hundred sixty centimeters", "More than one hundred sixty centimeters", "Exactly one hundred seventy centimeters"], correct: 0, rationale: "A maternal height shorter than one hundred fifty centimeters gives an indication of a contracted pelvis." },
  { id: 15, question: "It is recommended that all pregnant women see a trained health provider at least four times during pregnancy.", options: ["True", "False"], correct: 0, rationale: "To be most effective, it is recommended that all mothers see a trained provider at least four times during pregnancy at regular intervals." },
  { id: 16, question: "A raised systolic blood pressure indicates toxemia if it is above the baseline by how many millimeters of mercury.", options: ["Ten millimeters", "Twenty millimeters", "Thirty millimeters", "Forty millimeters"], correct: 2, rationale: "In late pregnancy, a raised systolic pressure of thirty millimeters of mercury above the baseline on two occasions indicates toxemia." },
  { id: 17, question: "At what gestational age should the hemoglobin test be routinely repeated.", options: ["Twenty weeks", "Twenty eight weeks", "Thirty two weeks", "Thirty six weeks"], correct: 3, rationale: "Hemoglobin testing should be routinely repeated at thirty six weeks of gestation during follow-up visits." },
  { id: 18, question: "The maternal abdomen appears longer if the fetal lie is transverse rather than longitudinal.", options: ["True", "False"], correct: 1, rationale: "The abdomen is longer if the fetal lie is longitudinal, and it appears lower and broad if the lie is transverse." },
  { id: 19, question: "Which diagnostic method is used to detect deep vein thrombosis during the examination of the legs.", options: ["Homan test", "Pawlik maneuver", "Pinard stethoscope", "Naegele rule"], correct: 0, rationale: "The calf must be observed for reddened areas or white areas which could be caused by deep vein thrombosis, often checked using the Homan test." },
  { id: 20, question: "Which service is a core component of preconception care.", options: ["Family planning counseling", "Fetal heart rate monitoring", "Measurement of fundal height", "Administration of analgesics"], correct: 0, rationale: "Family planning counseling to avoid unplanned pregnancies is a key component of preconception care." },
  { id: 21, question: "A primigravida is automatically classified as a low risk pregnancy due to the absence of previous complications.", options: ["True", "False"], correct: 1, rationale: "Being a primigravida classifies a pregnant woman under the intermediate risk category, not low risk." },
  { id: 22, question: "Which assessment finding provides a definite positive indication of pregnancy.", options: ["Breast tenderness", "Urinary frequency", "Fetal outline confirmation", "Abdominal enlargement"], correct: 2, rationale: "Ultrasonography to confirm the fetal outline is a positive or sure sign that definitively confirms the pregnancy." },
  { id: 23, question: "What is the normal baseline fetal heart rate range.", options: ["Eighty to one hundred beats per minute", "One hundred to one hundred twenty beats per minute", "One hundred twenty to one hundred sixty beats per minute", "One hundred sixty to two hundred beats per minute"], correct: 2, rationale: "The normal fetal heart rate ranges from one hundred twenty to one hundred sixty beats per minute." },
  { id: 24, question: "The uterus becomes palpable over the maternal abdomen after the twelfth week of gestation.", options: ["True", "False"], correct: 0, rationale: "The uterus will be palpable per abdomen after the twelfth week of gestation." },
  { id: 25, question: "Which specific type of white blood cell increases during pregnancy to enhance bactericidal properties.", options: ["Eosinophils", "Neutrophils", "Basophils", "Lymphocytes"], correct: 1, rationale: "White blood cells increase during pregnancy, especially neutrophils, which account for more than seventy percent of the increase." },
  { id: 26, question: "Which detail is primarily recorded under the obstetrical history during the initial visit.", options: ["Serious childhood illnesses", "Current maternal occupation", "Previous spontaneous abortions", "Known parental consanguinity"], correct: 2, rationale: "The date of the last abortion is recorded as part of the details of previous pregnancies under obstetrical history." },
  { id: 27, question: "Premature rupture of membranes is classified as a high risk condition if it occurs between which weeks of gestation.", options: ["Twenty to twenty four weeks", "Twenty four to twenty eight weeks", "Twenty eight to thirty three weeks", "Thirty four to thirty seven weeks"], correct: 2, rationale: "Premature rupture of membranes occurring specifically between twenty eight and thirty three weeks is classified as a high risk condition." },
  { id: 28, question: "What is the definition of the prefix ante in the context of maternity care.", options: ["After delivery", "Before delivery", "During delivery", "Following delivery"], correct: 1, rationale: "Ante means before, while natal means delivery, making antenatal care the care given before delivery." },
  { id: 29, question: "Which physical change is classified strictly as a presumptive sign of pregnancy.", options: ["Softening of the isthmus", "Positive pregnancy test", "Hearing fetal movement", "Chloasma and linea nigra"], correct: 3, rationale: "Chloasma and linea nigra are classified as presumptive signs, which suggest pregnancy but do not positively indicate it." },
  { id: 30, question: "White blood cells decrease during pregnancy to reduce the risk of maternal autoimmune diseases.", options: ["True", "False"], correct: 1, rationale: "White blood cells actually increase during pregnancy to enhance the blood phagocytic and bactericidal properties." },
  { id: 31, question: "Which obstetric technique is specifically used to locate the round hard head of the fetus and judge its mobility.", options: ["Homan test", "Pawlik maneuver", "Naegele rule", "Pinard method"], correct: 1, rationale: "Pawlik maneuver is used during abdominal palpation to locate the round hard head and judge its size, flexion, and mobility." },
  { id: 32, question: "Which finding places a pregnant woman in the intermediate risk category.", options: ["Uncontrolled premature labor", "Previous neonatal death", "Severe growth retardation", "Major fetal abnormality"], correct: 1, rationale: "A previous stillbirth or neonatal death places the mother in the intermediate risk category, whereas the other options are high risk conditions." },
  { id: 33, question: "How many fetal movements should a pregnant woman report feeling within a twelve hour period.", options: ["At least five movements", "At least ten movements", "At least fifteen movements", "At least twenty movements"], correct: 1, rationale: "During a fetal kick count assessment, the pregnant woman is expected to report at least ten movements in twelve hours." },
  { id: 34, question: "Cardiotocography is primarily used to record the maternal heartbeat and respiratory rate during pregnancy.", options: ["True", "False"], correct: 1, rationale: "Cardiotocography is an electronic fetal monitor used to record the fetal heartbeat and uterine contractions, not maternal respiratory rate." },
  { id: 35, question: "Which goal is a primary objective of prenatal care.", options: ["To reduce the number of breastfed babies", "To increase maternal and perinatal mortality", "To prepare the mother for labor and lactation", "To eliminate all possible pregnancy risks entirely"], correct: 2, rationale: "Preparing the mother for labor, lactation, and subsequent care of her child is a direct objective of prenatal care." },
  { id: 36, question: "What is the expected weight gain for a pregnant woman during the first twenty weeks of gestation.", options: ["One kilogram", "Two kilograms", "Ten kilograms", "Twelve kilograms"], correct: 1, rationale: "The approximate weight gain in the first twenty weeks is two kilograms, followed by ten kilograms in the remaining twenty weeks." },
  { id: 37, question: "A mucoid vaginal loss should be immediately reported to the obstetrician if it occurs before which week of pregnancy.", options: ["Twenty fourth week", "Twenty eighth week", "Thirty second week", "Thirty seventh week"], correct: 3, rationale: "Women are instructed to report any mucoid loss to the obstetrician if it happens before the thirty seventh week of pregnancy." },
  { id: 38, question: "Which clinical sign observed on the face indicates maternal anemia.", options: ["Facial edema", "Skin pallor", "Prominent chloasma", "Dark pigmentation"], correct: 1, rationale: "The face is observed during the general examination for skin color changes such as pallor, which is an indicator of anemia." },
  { id: 39, question: "What urine specific gravity level may be found due to the physiological changes of pregnancy.", options: ["Less than one point one zero two", "More than one point one zero two", "Less than two point one zero two", "More than two point one zero two"], correct: 0, rationale: "A low specific gravity of urine, specifically less than 1.102, may be found due to the normal physiological changes of pregnancy." },
  { id: 40, question: "Hegar sign is clinically defined as which anatomical change during early pregnancy.", options: ["Softening of the isthmus", "Enlargement of the abdomen", "Discoloration of the vagina", "Tenderness of the breasts"], correct: 0, rationale: "Hegar sign is a probable sign of pregnancy characterized by the softening of the uterine isthmus." }

  { id: 2, question: "Which hemoglobin concentration range defines moderate anemia during pregnancy?", options: ["Seven to nine grams per deciliter", "Nine to eleven grams per deciliter", "Four to seven grams per deciliter", "Less than four grams per deciliter"], correct: 0, rationale: "According to the degrees of severity, moderate anemia is characterized by a hemoglobin level between seven and nine grams per deciliter." },
  { id: 3, question: "Which laboratory finding distinguishes physiological anemia of pregnancy from pathological anemia?", options: ["Normal serum ferritin levels", "Decreased overall plasma volume", "Elevated hematocrit percentages", "Abnormal red blood cell shape"], correct: 0, rationale: "Physiological anemia is distinguished from pathological anemia by normal indices of red blood cells and a normal serum ferritin level evaluating the body iron stores." },
  { id: 4, question: "Which cooking method significantly reduces the folic acid content in green leafy vegetables?", options: ["Utilizing prolonged boiling techniques", "Steaming for a short duration", "Grilling over an open flame", "Baking inside a sealed oven"], correct: 0, rationale: "Folic acid is destroyed by prolonged boiling, the addition of bicarbonate, or cooking in a large amount of water." },
  { id: 5, question: "Pregnant patients with severe anemia should be instructed to actively bear down during the first stage of labor.", options: ["True", "False"], correct: 1, rationale: "Nursing care during labor specifically instructs the anemic patient to avoid bearing down in the first stage of labor." },
  { id: 6, question: "Which condition is most likely to exacerbate sickling in pregnant patients with sickle cell anemia?", options: ["Cellular dehydration states", "Elevated oxygen tension", "Systemic alkalosis states", "Excessive fluid overload"], correct: 0, rationale: "Sickling is enhanced by hypoxia, dehydration, acidosis, trauma, and infection." },
  { id: 7, question: "When is the administration of parenteral iron therapy preferred over oral supplementation?", options: ["Diagnosis after the thirty sixth week", "Hemoglobin levels exceeding nine grams", "Initial diagnosis in the first trimester", "Requirement for prophylactic treatment"], correct: 0, rationale: "Parenteral iron therapy should replace oral iron in cases where anemia is detected after the thirty sixth week or in severe cases." },
  { id: 8, question: "The fetus primarily stores drawn maternal iron in the liver during the latter part of the second trimester.", options: ["True", "False"], correct: 0, rationale: "In the latter part of the second trimester, the fetus draws iron from the mother and stores it in the liver for use during the first four to six months of life." },
  { id: 9, question: "Which fetal complication is commonly associated with maternal anemia during the antenatal period?", options: ["Intrauterine growth retardation", "Congenital cardiac anomalies", "Excessive fetal birth weight", "Post term gestation period"], correct: 0, rationale: "Antenatal fetal complications of anemia include intrauterine hypoxia, impaired uteroplacental oxygen, and growth retardation." },
  { id: 10, question: "Which pharmacological agent is identified as a potential trigger for aplastic anemia during pregnancy?", options: ["Maternal chloramphenicol administration", "Daily ferrous sulphate consumption", "Routine folic acid supplementation", "Intravenous heparin administration"], correct: 0, rationale: "Aplastic anemia occurs rarely in pregnancy due to certain agents such as chloramphenicol or phenylbutazone that depress bone marrow hemopoiesis." },
  { id: 11, question: "Which dietary component inhibits the effective absorption of iron supplements?", options: ["High calcium dietary foods", "Fresh citrus fruit juices", "Dark green leafy vegetables", "Lean animal meat sources"], correct: 0, rationale: "Substances that inhibit iron absorption include excessive tea, coffee, high calcium foods, or supplements with antacids." },
  { id: 12, question: "Oral iron supplementation frequently causes maternal stools to turn abnormally black.", options: ["True", "False"], correct: 0, rationale: "Women taking oral iron should be explicitly warned that their stool may turn black as a side effect." },
  { id: 13, question: "Which specific intervention is universally required for all women during the postpartum period regardless of blood loss?", options: ["Routine oral iron supplementation", "Packed red blood cell transfusion", "Continuous intravenous fluid therapy", "Prophylactic maternal heparin therapy"], correct: 0, rationale: "Postpartum nursing care clearly dictates that all women will require an iron supplement after delivery." },
  { id: 14, question: "Which diagnostic procedure can detect thalassemia in a fetus under ultrasound guidance?", options: ["Fetal blood cordocentesis", "Amniotic fluid cultivation", "Maternal serum evaluation", "Doppler ultrasound velocimetry"], correct: 0, rationale: "Thalassemia can be detected in the fetus either by chorionic villus sampling or by sampling the fetus blood taken by cordocentesis under ultrasound guidance." },
  { id: 15, question: "Which clinical characteristic is specifically found in cases of folic acid deficiency anemia?", options: ["Deficient gastric hydrochloric acid", "Elevated peripheral reticulocytes", "Microcytic hypochromic red cells", "Abnormally high hematocrit values"], correct: 0, rationale: "A key clinical characteristic of folic acid deficiency anemia is a deficient or absent hydrochloric acid in the gastric secretion." },
  { id: 16, question: "By what percentage does the total maternal blood volume typically increase during a normal pregnancy?", options: ["Forty to fifty percent", "Ten to twenty percent", "Twenty to thirty percent", "Sixty to seventy percent"], correct: 0, rationale: "During pregnancy, the total blood volume is increased by about forty to fifty percent, contributing to hydremia and physiological anemia." },
  { id: 17, question: "Which factor places a pregnant woman at a high risk for developing anemia?", options: ["Short intervals between births", "Advanced maternal age status", "Excessive protein consumption", "Singleton fetal gestations"], correct: 0, rationale: "Women who have recently given birth, representing a short birth interval, are identified as a high risk group for anemia in pregnancy." },
  { id: 18, question: "Which laboratory finding is characteristic of iron deficiency anemia in pregnant patients?", options: ["Serum ferritin under thirty micrograms", "Hemoglobin above eleven grams", "Hematocrit exceeding thirty percent", "Serum iron above sixty micrograms"], correct: 0, rationale: "The complete blood picture investigation for iron deficiency anemia shows serum ferritin below thirty micrograms per one hundred milliliters." },
  { id: 19, question: "Why must parenteral iron be administered deep into the muscular tissue?", options: ["To prevent localized abscess formation", "To accelerate red blood cell production", "To bypass hepatic metabolic pathways", "To enhance overall systemic absorption"], correct: 0, rationale: "Nursing management specifies that parenteral iron should be given deep into muscles to prevent abscess formation." },
  { id: 20, question: "What is the recommended daily dietary intake of folic acid for prophylactic treatment during pregnancy?", options: ["Six hundred micrograms daily", "Two hundred micrograms daily", "Four hundred micrograms daily", "Eight hundred micrograms daily"], correct: 0, rationale: "Prophylactic treatment outlines a daily dietary intake of folic acid at six hundred micrograms per day." },
  { id: 21, question: "Which combination of blood abnormalities characterizes aplastic anemia during pregnancy?", options: ["Severe anemia with leucopenia and thrombocytopenia", "Mild anemia with leukocytosis and thrombocytosis", "Severe anemia with leukocytosis and thrombocytosis", "Mild anemia with leucopenia and thrombocytopenia"], correct: 0, rationale: "In cases of aplastic anemia, a complete blood count shows severe anemia combined with leucopenia and thrombocytopenia." },
  { id: 22, question: "Which complication is a direct consequence of maternal anemia during the postnatal period?", options: ["Severe postpartum hemorrhage", "Uterine hyperstimulation events", "Gestational hypertensive states", "Complete placental abruption"], correct: 0, rationale: "Postnatal effects of anemia on the mother specifically include postpartum hemorrhage and infection." },
  { id: 23, question: "Folic acid deficiency during pregnancy is directly linked to which specific type of birth defect?", options: ["Neural tube structural abnormalities", "Congenital cardiac septal defects", "Facial cleft lip and palate", "Fetal limb reduction defects"], correct: 0, rationale: "Folic acid deficiency can directly contribute to certain types of birth defects, such as neural tube abnormalities like spina bifida." },
  { id: 24, question: "What type of cellular appearance is classically associated with iron deficiency anemia?", options: ["Hypochromic microcytic cellular appearance", "Hyperchromic macrocytic cellular appearance", "Normochromic normocytic cellular appearance", "Hypochromic macrocytic cellular appearance"], correct: 0, rationale: "The text classifies iron deficiency anemia specifically as hypochromic microcytic anemia." },
  { id: 25, question: "Thalassemia is characterized by the excessive synthesis of normal alpha and beta globin chains.", options: ["True", "False"], correct: 1, rationale: "Thalassemia is a genetically inherited blood disorder characterized by the inadequate synthesis of alpha or beta globin chains." }
]

            "diabetes": {
                title: "Diabetes Mellitus with Pregnancy",
                author: "عبدالحليم رزق",
                icon: "fa-cubes-stacked",
                color: "text-amber-600",
                bg: "bg-amber-50",
                data: [
  { id: 1, question: "During the first trimester of pregnancy maternal insulin sensitivity typically increases slightly.", options: ["True", "False"], correct: 0, rationale: "During the first trimester, there is a slight increase in insulin sensitivity leading to greater glucose utilization and decreased fasting blood glucose." },
  { id: 2, question: "Which plasma glucose level after a one hour fifty gram glucose screening necessitates a formal three hour tolerance test?", options: ["One hundred forty milligrams per deciliter", "Ninety five milligrams per deciliter", "One hundred twenty milligrams per deciliter", "One hundred eighty milligrams per deciliter"], correct: 0, rationale: "A plasma glucose level of 140 mg/100 ml following the 50-gram glucose load necessitates proceeding to the 3-hour glucose tolerance test." },
  { id: 3, question: "When does gestational diabetes mellitus typically develop and become initially recognized during the course of pregnancy?", options: ["During the second or third trimester", "Throughout the entire first trimester", "Exclusively during the peripartum period", "Immediately following placental delivery"], correct: 0, rationale: "Gestational diabetes usually develops during the second or third trimester due to pregnancy-induced insulin resistance." },
  { id: 4, question: "What is the recommended fasting blood glucose target level for achieving optimal glycemic control during pregnancy?", options: ["Below ninety five milligrams per deciliter", "Below one hundred twenty milligrams per deciliter", "Below one hundred forty milligrams per deciliter", "Below one hundred ten milligrams per deciliter"], correct: 0, rationale: "Management protocols aim to maintain fasting blood glucose strictly below 95 mg/dL to achieve optimal glycemic control." },
  { id: 5, question: "Breastfeeding is actively discouraged for mothers with gestational diabetes to prevent severe neonatal hypoglycemic episodes.", options: ["True", "False"], correct: 1, rationale: "Postpartum care actually encourages breastfeeding, as it improves maternal glucose metabolism and benefits the infant while lowering insulin requirements." },
  { id: 6, question: "Which complication is a direct physiological consequence of fetal polyuria secondary to severe maternal hyperglycemia?", options: ["Increased incidence of polyhydramnios", "Severe intrauterine growth retardation", "Premature rupture of amniotic membranes", "Development of maternal preeclampsia"], correct: 0, rationale: "There is an increased incidence of polyhydramnios due to fetal polyuria, which occurs strictly secondary to maternal hyperglycemia." },
  { id: 7, question: "At what estimated fetal weight is a cesarean delivery strongly considered to actively prevent intrapartum shoulder dystocia?", options: ["Four thousand five hundred grams", "Four thousand grams", "Three thousand five hundred grams", "Three thousand eight hundred grams"], correct: 0, rationale: "Cesarean delivery may be considered when the estimated fetal weight is greater than or equal to 4500 g because of the high risk of shoulder dystocia." },
  { id: 8, question: "Maternal age younger than twenty five years represents a major independent risk factor for developing gestational diabetes.", options: ["True", "False"], correct: 1, rationale: "Maternal age greater than or equal to 35 years is identified as an increased risk factor, not an age younger than 25 years." },
  { id: 9, question: "Which placental hormone exerts a significant peripheral anti insulin effect that heavily prevents optimal maternal cellular glucose utilization?", options: ["Human placental lactogen", "Maternal circulating estrogen", "Placental derived progesterone", "Maternal circulating prolactin"], correct: 0, rationale: "Human placental lactogen secreted from the placenta has a peripheral anti-insulin effect that prevents the utilization of glucose." },
  { id: 10, question: "How frequently should a patient with normal postpartum glucose tolerance testing undergo lifelong systemic diabetes screening?", options: ["Every one to three years", "Every four to six months", "Every five to ten years", "Every six to twelve months"], correct: 0, rationale: "If postpartum results are normal, patients should undergo lifelong diabetes screening every 1 to 3 years." },
  { id: 11, question: "What is the preferred pharmacological treatment for gestational diabetes when strict dietary and exercise modifications completely fail?", options: ["Maternal insulin therapy", "Oral metformin administration", "Intravenous dextrose infusion", "Subcutaneous glucagon injection"], correct: 0, rationale: "If diet and exercise fail to achieve glycemic targets, insulin is officially considered the preferred treatment." },
  { id: 12, question: "The routine delivery of the placenta causes a rapid decline in placental hormones resulting in a marked increase in maternal insulin resistance.", options: ["True", "False"], correct: 1, rationale: "Delivery of the placenta causes a rapid decline in placental hormones, which actually results in a marked decrease (not increase) in insulin resistance." },
  { id: 13, question: "How much fast acting carbohydrate should be promptly administered to a fully conscious pregnant woman experiencing symptomatic hypoglycemia?", options: ["Fifteen to twenty grams", "Five to ten grams", "Twenty five to thirty grams", "Thirty five to forty grams"], correct: 0, rationale: "Conscious women experiencing hypoglycemia should be treated with 15 to 20 grams of fast-acting carbohydrate." },
  { id: 14, question: "The definitive three hour oral glucose tolerance test requires an overnight fasting period followed by the administration of how much oral glucose?", options: ["One hundred grams", "Fifty grams", "Seventy five grams", "One hundred fifty grams"], correct: 0, rationale: "The three-hour glucose tolerance test involves an overnight fast and the administration of a 100-gram oral glucose load." },
  { id: 15, question: "Routine screening of maternal urine for glucose is considered a highly reliable diagnostic method for detecting active gestational diabetes.", options: ["True", "False"], correct: 1, rationale: "Testing the urine for glucose in pregnancy is unreliable because renal glucosuria is a common physiological occurrence." },
  { id: 16, question: "What is the explicitly recommended daily dosage of folic acid prior to conception and continuing until twelve weeks of early pregnancy?", options: ["Five milligrams daily", "One milligram daily", "Ten milligrams daily", "Two milligrams daily"], correct: 0, rationale: "Preconception care for diabetic patients involves prescribing folic acid at a dose of 5 mg/day until 12 weeks of pregnancy." },
  { id: 17, question: "What is the specific target range for strictly maintaining maternal blood glucose levels during the active stages of clinical labor?", options: ["Seventy to one hundred ten milligrams", "Ninety to one hundred forty milligrams", "Fifty to ninety five milligrams", "One hundred to one hundred fifty milligrams"], correct: 0, rationale: "During labor, maternal glucose should be maintained strictly between 70 and 110 mg/dL using insulin and glucose infusions as needed." },
  { id: 18, question: "Which specific pharmacological class is officially identified as a potential chemical inducer of secondary maternal diabetes mellitus?", options: ["Systemic glucocorticoid medications", "Routine multivitamin supplementations", "Intravenous electrolyte replacements", "Subcutaneous anticoagulant therapies"], correct: 0, rationale: "Specific types of diabetes include drug- or chemical-induced diabetes resulting directly from agents such as glucocorticoids." },
  { id: 19, question: "When is formal induction of delivery generally recommended for a pregnant patient diagnosed with medication controlled gestational diabetes?", options: ["Thirty nine weeks gestation", "Forty weeks gestation", "Thirty seven weeks gestation", "Forty one weeks gestation"], correct: 0, rationale: "For medication-controlled GDM or pregestational diabetes, delivery is usually planned at 39 weeks unless maternal or fetal complications develop earlier." },
  { id: 20, question: "What immediate metabolic neonatal complication requires close clinical observation and monitoring in the newborn of a diabetic mother?", options: ["Severe neonatal hypoglycemia", "Profound neonatal hyperglycemia", "Systemic diabetic ketoacidosis", "Congenital renal glucosuria"], correct: 0, rationale: "Care of the newborn dictates early feeding and close monitoring specifically for neonatal hypoglycemia." },
  { id: 21, question: "Why do women with pre existing type one diabetes frequently require substantially reduced insulin doses during the first trimester of pregnancy?", options: ["Increased maternal insulin sensitivity", "Decreased placental lactogen production", "Accelerated hepatic glycogen depletion", "Impaired pancreatic beta cell function"], correct: 0, rationale: "In the first trimester, an increased insulin sensitivity alongside reduced glucose levels often requires lowering the usual insulin doses." },
  { id: 22, question: "According to the International Diabetes Federation what precise global percentage of live births is affected by maternal hyperglycemia during pregnancy?", options: ["Approximately seventeen percent", "Approximately twenty five percent", "Approximately ten percent", "Approximately thirty percent"], correct: 0, rationale: "Approximately 1 in 6 live births, which constitutes about 17%, is affected by hyperglycemia during pregnancy." },
  { id: 23, question: "Pregnant women clinically diagnosed with diabetes exhibit an overall incidence rate of preeclampsia that is how much higher than in non diabetic women?", options: ["Three times higher", "Two times higher", "Four times higher", "Five times higher"], correct: 0, rationale: "Maternal complications of diabetes include an increased incidence of pre-eclampsia that is three times higher than in non-diabetic pregnancies." },
  { id: 24, question: "A definitive clinical diagnosis of gestational diabetes using the three hour oral glucose tolerance test requires how many elevated glucose test values?", options: ["Two or more elevated values", "One single elevated value", "Three or more elevated values", "All four tested elevated values"], correct: 0, rationale: "Gestational diabetes is firmly diagnosed when two or more glucose tolerance test levels equal or heavily exceed the stated diagnostic thresholds." },
  { id: 25, question: "When is an oral glucose tolerance test medically recommended following childbirth for a patient previously diagnosed with gestational diabetes?", options: ["Four to twelve weeks postpartum", "One to three weeks postpartum", "Six to twelve months postpartum", "Immediately following placental delivery"], correct: 0, rationale: "Postpartum care entails performing a 75-g OGTT at 4 to 12 weeks postpartum to evaluate the maternal glucose status accurately." }
]

            "heart": {
                title: "Heart Disease in Pregnancy",
                author: "عبدالحليم رزق",
                icon: "fa-heart-pulse",
                color: "text-rose-600",
                bg: "bg-rose-50",
                data: [
  { id: 1, question: "Which bacterial infection is identified as the most common precipitating cause of rheumatic heart disease in pregnant women?", options: ["Streptococcal bacterial infections causing subsequent valvular damage", "Staphylococcal bacterial infections causing widespread systemic sepsis", "Viral respiratory infections causing acute myocardial inflammation", "Fungal opportunistic infections causing localized subacute endocarditis"], correct: 0, rationale: "Rheumatic heart disease involves heart muscles and valves damage due to rheumatic fever caused by streptococcal bacterial infections." },
  { id: 2, question: "Approximately how much blood is expelled from the actively contracting uterus into the general maternal circulation during each contraction?", options: ["Three hundred to five hundred milliliters of total blood volume", "One hundred to two hundred milliliters of total blood volume", "Six hundred to eight hundred milliliters of total blood volume", "Eight hundred to one thousand milliliters of total blood volume"], correct: 0, rationale: "Each uterine contraction is associated with the expulsion of 300-500ml of blood from the uterus to the general circulation, leading to increased stroke volume." },
  { id: 3, question: "Oxytocin administration is highly recommended during the first and second stages of labor for patients with cardiac disease.", options: ["True", "False"], correct: 1, rationale: "Oxytocin is strictly contraindicated for heart disease in the first and second stages of labor according to labor management guidelines." },
  { id: 4, question: "What is the primary dietary modification recommended for pregnant women managing symptomatic cardiac disease?", options: ["Decreased sodium intake combined with increased protein consumption", "Increased carbohydrate intake combined with restricted fat consumption", "Elevated sodium intake combined with reduced protein consumption", "Decreased caloric intake combined with limited iron supplementation"], correct: 0, rationale: "The diet should contain low salt, less carbohydrate, less fat, but more protein, iron, and essential nutrients to support the mother and reduce cardiac workload." },
  { id: 5, question: "Why is there a significant increase in maternal cardiac output immediately following the delivery of the placenta?", options: ["Increased venous return secondary to the absent placental vascular pool", "Decreased systemic vascular resistance lowering peripheral blood pressure", "Rapid depletion of intravascular volume from normal postpartum bleeding", "Acute parasympathetic stimulation slowing the maternal resting heart rate"], correct: 0, rationale: "Immediately following labor there is an increase in cardiac output due to increased venous return secondary to the absence of the placenta pool." },
  { id: 6, question: "Which condition represents an absolute maternal indication for performing a therapeutic abortion in early pregnancy?", options: ["Cyanotic congenital heart disease complicated by pulmonary hypertension", "Rheumatic valvular disease with documented previous endocarditis", "Gestational hypertension without significant target organ involvement", "Uncomplicated mild maternal anemia presenting in the first trimester"], correct: 0, rationale: "Therapeutic abortion is specifically indicated in cyanotic congenital heart disease, such as pulmonary hypertension, or cases of Class III and IV that do not respond to medical treatment." },
  { id: 7, question: "In pregnant women with cardiac disease Class three and Class four patients must remain hospitalized throughout the entire pregnancy.", options: ["True", "False"], correct: 0, rationale: "According to antenatal management protocols, Class III and Class IV patients must be hospitalized throughout pregnancy due to their high risk of decompensation." },
  { id: 8, question: "Which specific clinical finding during labor requires immediate evaluation for early signs of maternal cardiac decompensation?", options: ["Maternal respiratory rate exceeding twenty five breaths per minute", "Maternal heart rate dropping below sixty regular beats per minute", "Maternal systolic pressure falling below ninety peripheral millimeters", "Maternal oxygen saturation remaining above ninety five percent overall"], correct: 0, rationale: "A pulse rate greater than 100 beats per minute or a respiration rate greater than 25 per minute require careful evaluation to detect early signs of decompensation." },
  { id: 9, question: "At which specific gestational age do maternal cardiac output and total blood volume typically reach their absolute maximum levels?", options: ["At thirty two weeks of active gestational development", "At twenty four weeks of active gestational development", "At thirty eight weeks of active gestational development", "At twenty eight weeks of active gestational development"], correct: 0, rationale: "The critical period during which heart failure is liable to occur is at 32 weeks, as the cardiac output and blood volume are at their absolute maximum." },
  { id: 10, question: "Which classification describes a patient who is severely compromised and experiences cardiac discomfort even while completely at rest?", options: ["Class four functional cardiac classification", "Class three functional cardiac classification", "Class two functional cardiac classification", "Class one functional cardiac classification"], correct: 0, rationale: "Class IV indicates a patient is severely compromised, with an inability to perform any physical activity without discomfort, and the patient experiences discomfort even at rest." },
  { id: 11, question: "What is the primary purpose of administering diuretic medications during the active stages of clinical labor?", options: ["To decrease maternal venous return and reduce acute pulmonary congestion", "To increase maternal blood volume and enhance direct placental perfusion", "To stimulate frequent uterine contractions and accelerate active labor progress", "To raise maternal blood pressure and prevent sudden neurogenic shock"], correct: 0, rationale: "Diuretics are administered to decrease venous return to the heart and to decrease pulmonary and left atrial blood pressure, thereby reducing pulmonary congestion." },
  { id: 12, question: "Pregnant women with Class three functional cardiac disease can safely be discharged from the hospital immediately following a successful delivery.", options: ["True", "False"], correct: 1, rationale: "Discharge guidelines mandate that patients with Class III heart disease should not leave the hospital until their condition improves and reaches Class I." },
  { id: 13, question: "Which specific electrolyte imbalance must be carefully monitored in hospitalized cardiac patients receiving continuous digitalis medication therapy?", options: ["Systemic hypokalemia requiring dietary potassium supplementation", "Systemic hypercalcemia requiring aggressive intravenous fluid therapy", "Systemic hyponatremia requiring strict dietary sodium restriction", "Systemic hypermagnesemia requiring immediate pharmacological reversal"], correct: 0, rationale: "Patients hospitalized for digitalis therapy must be observed for hypokalemia, and nurses must provide food high in potassium to prevent life-threatening arrhythmias." },
  { id: 14, question: "What is the normal physiological increase in maternal blood volume during the first trimester of pregnancy?", options: ["Forty to fifty percent above normal baseline", "Twenty to thirty percent above normal baseline", "Ten to fifteen percent above normal baseline", "Sixty to seventy percent above normal baseline"], correct: 0, rationale: "During the first trimester, the volume of blood increases by 40 to 50 percent and remains high throughout the entire pregnancy." },
  { id: 15, question: "Which position is most beneficial for maximizing uteroplacental blood flow during labor in a patient with heart disease?", options: ["The lateral side lying position or semi upright elevated position", "The supine flat position with the lower extremities significantly elevated", "The prone flat position with soft pillows supporting the maternal abdomen", "The full upright standing position combined with continuous active ambulation"], correct: 0, rationale: "A side-lying or semi-Fowler’s position helps in assuring cardiac emptying, proper oxygenation, and maximum uteroplacental blood flow." },
  { id: 16, question: "The functional classification of heart disease in pregnancy is based strictly on the anatomical diagnosis rather than the physical symptoms.", options: ["True", "False"], correct: 1, rationale: "The classification of heart disease in pregnancy is based purely on function, not diagnosis. Different individuals with the same diagnosis may fall into different functional classes." },
  { id: 17, question: "When therapeutic abortion is indicated for severe cardiac disease which specific method is strictly preferred after the twelfth gestational week?", options: ["The direct intrauterine injection of synthetic prostaglandin medications", "The immediate surgical performance of an open abdominal hysterotomy", "The standard clinical application of manual vacuum aspiration techniques", "The exclusive continuous use of concentrated intravenous oxytocin infusions"], correct: 0, rationale: "Therapeutic abortion is performed by suction curettage before the 12th week, while intrauterine injection of prostaglandins is preferred after that time." },
  { id: 18, question: "During which specific period of labor does the act of maternal straining place the greatest physical stress on the compromised heart?", options: ["Throughout the entire second stage of active clinical labor", "During the initial latent phase of the first clinical labor stage", "Following the complete expulsion of the delivered maternal placenta", "Prior to the spontaneous rupture of the surrounding amniotic membranes"], correct: 0, rationale: "The critical period during which heart failure is liable to occur is in the 2nd stage of labor, where intense straining leads to extreme stress on the heart." },
  { id: 19, question: "How many hours of total daily rest are generally recommended for a pregnant woman diagnosed with functional cardiac disease?", options: ["Twelve total hours including night sleep and daytime resting", "Eight total hours consisting exclusively of uninterrupted night sleep", "Fourteen total hours distributed evenly throughout the entire daytime", "Ten total hours focused entirely on uninterrupted afternoon sleeping"], correct: 0, rationale: "Adequate rest requires the woman to have 10 hours of rest in bed at night and 2 hours in the afternoon, totaling 12 hours to reduce the workload of the heart." },
  { id: 20, question: "Prophylactic ampicillin is frequently recommended to guard against the recurrence of bacterial endocarditis in vulnerable pregnant women.", options: ["True", "False"], correct: 0, rationale: "Prophylactic antibiotics, such as Ampicillin or amoxicillin, are recommended to guard against the recurrence of rheumatic fever or bacterial endocarditis." },
  { id: 21, question: "What is the most severe potential fetal consequence of maternal cardiac disease during the active period of pregnancy?", options: ["Complete intrauterine fetal demise before the actual onset of labor", "Transient fetal tachycardia during early irregular maternal contractions", "Slight overall reduction in fetal movement during the late evening hours", "Accelerated rapid fetal lung maturation throughout the third trimester"], correct: 0, rationale: "Effects of heart disease on the fetus during pregnancy include severe outcomes such as intrauterine growth retardation and intra uterine fetal death." },
  { id: 22, question: "Which vital sign alteration is considered a normal physiological cardiovascular adaptation during a healthy pregnancy?", options: ["An elevated baseline heart rate of ten to fifteen beats per minute", "A dramatic increase in diastolic blood pressure of twenty millimeters", "A severe hazardous reduction in overall peripheral vascular resistance", "A significant dramatic drop in maternal cardiac output by thirty percent"], correct: 0, rationale: "It is normal for the heart rate to physiologically increase by 10 to 15 beats per minute over the baseline during a healthy pregnancy." },
  { id: 23, question: "Which sign or symptom is considered a classic early indicator of active congestive heart failure in a pregnant patient?", options: ["The presence of a persistent nighttime nocturnal cough", "The sudden development of mild transient morning sickness", "The unusual sensation of sporadic irregular fetal movements", "The isolated presentation of diffuse maternal lower back discomfort"], correct: 0, rationale: "Signs of heart failure explicitly include a nocturnal cough, progressive edema, increasing dyspnea, and hemoptysis." },
  { id: 24, question: "How frequently should a pregnant outpatient with Class two cardiac disease be medically evaluated prior to the twenty eighth week?", options: ["Every two weeks continuously until reaching the twenty eighth week", "Every four weeks continuously until reaching the thirty sixth week", "Every week continuously starting directly from the initial diagnosis", "Every three weeks continuously until reaching the active delivery phase"], correct: 0, rationale: "Class I and class II patients are managed as outpatients but should be closely seen every two weeks up to the 28th week, then weekly until delivery." },
  { id: 25, question: "Which postpartum complication is considered most likely to precipitate a sudden maternal cardiac crisis?", options: ["The development of massive acute systemic thromboembolism", "The sudden onset of localized mild peripheral lower extremity edema", "The presentation of completely asymptomatic transient nighttime bradycardia", "The spontaneous gradual resolution of previously existing varicose veins"], correct: 0, rationale: "Postpartum hemorrhage, infection, and thromboembolism can all precipitate life-threatening crises and must be prevented or immediately treated." }
]

            "rh": {
                title: "Rh Incompatibility",
                author: "عبدالحليم رزق",
                icon: "fa-vial-virus",
                color: "text-purple-600",
                bg: "bg-purple-50",
                data: [
  { id: 1, question: "Which type of maternal antibody is primarily produced during the initial exposure to fetal red blood cells and fails to cross the placental barrier?", options: ["Immunoglobulin M antibodies", "Immunoglobulin G antibodies", "Immunoglobulin A antibodies", "Immunoglobulin E antibodies"], correct: 0, rationale: "During the first pregnancy, the initial exposure causes the mother's B cells to secrete IgM antibodies, which are too large to cross the placental barrier." },
  { id: 2, question: "Which fetal complication is directly caused by the accumulation of waste products resulting from excessive red blood cell destruction?", options: ["Systemic kernicterus toxicity", "Generalized hydrops fetalis", "Complete bone marrow failure", "Severe cardiac enlargement"], correct: 0, rationale: "Kernicterus is listed specifically as a complication resulting from the waste products of excessive hemolysis." },
  { id: 3, question: "If both the mother and the father have rhesus negative blood types there is a high risk for rhesus incompatibility in the newborn.", options: ["True", "False"], correct: 1, rationale: "If both parents are Rh-negative, the child will be Rh-negative, resulting in absolutely no risk for Rh incompatibility." },
  { id: 4, question: "At which specific gestational age is the prophylactic administration of rhesus immunoglobulin routinely recommended during an uncomplicated pregnancy?", options: ["Twenty eight weeks gestation", "Twenty four weeks gestation", "Thirty two weeks gestation", "Thirty six weeks gestation"], correct: 0, rationale: "Primary prevention dictates administering the prophylactic Rh immunoglobulin injection at 28 weeks of gestation." },
  { id: 5, question: "Which specific diagnostic test is utilized to detect maternal antibodies that have already attached to the circulating fetal red blood cells?", options: ["The direct Coombs test", "The indirect Coombs test", "The complete blood count", "The maternal antibody titer"], correct: 0, rationale: "The direct Coombs test specifically detects maternal anti-D antibodies that have already bound directly to the fetal red blood cells." },
  { id: 6, question: "Which non fetal exposure event significantly increases the maternal risk of developing rhesus sensitization during a first pregnancy?", options: ["Previous bone marrow transplantation", "Routine external cephalic version", "Diagnostic chorionic villus sampling", "Unexplained antepartum placental hemorrhage"], correct: 0, rationale: "Bone marrow transplantation is classified as a non-fetal exposure to Rh-positive blood, whereas the others involve fetal exposure." },
  { id: 7, question: "Sensitization to the rhesus antigen occurs in approximately ten percent of all pregnancies involving a rhesus negative mother and a rhesus positive fetus.", options: ["True", "False"], correct: 1, rationale: "The incidence of carrying an Rh-positive fetus is about 10%, but actual sensitization only occurs in about 5% of these cases." },
  { id: 8, question: "Which specific biological material was transfused into laboratory animals by Landsteiner and Wiener to isolate the newly discovered antibody?", options: ["Rhesus monkey red cells", "Guinea pig blood plasma", "Domestic rabbit white cells", "Laboratory mouse red cells"], correct: 0, rationale: "In 1940, Landsteiner and Wiener reported an antibody found in guinea pigs and rabbits when they were transfused specifically with rhesus monkey red cells." },
  { id: 9, question: "Which intrapartum clinical practice must be strictly avoided to heavily decrease the entry of incompatible blood into the maternal circulation?", options: ["Umbilical cord milking", "Early membrane rupture", "Delayed cord clamping", "Placental manual removal"], correct: 0, rationale: "Primary prevention guidelines include a specific note to completely avoid cord milking during labor to decrease Rh- blood entry into the maternal circulation." },
  { id: 10, question: "What approximate percentage of the general human population inherits the specific rhesus protein and is therefore classified as rhesus positive?", options: ["Eighty five percent", "Seventy five percent", "Ninety five percent", "Sixty five percent"], correct: 0, rationale: "The majority of people in the general population, approximately 85%, inherit the protein and are Rh-positive." },
  { id: 11, question: "Repeated fetal stillbirths resulting from severe blood incompatibility can lead to long term relative infertility in the affected mother.", options: ["True", "False"], correct: 0, rationale: "Relative infertility and obstetric complications from repeated stillbirths are officially listed under the complications of Rh incompatibility on the mother." },
  { id: 12, question: "Which maternal immune cells are primarily responsible for mounting a targeted destructive response against fetal blood cells during subsequent pregnancies?", options: ["Immunoglobulin memory B cells", "Circulating helper T lymphocytes", "Activated natural killer cells", "Specialized cytotoxic T cells"], correct: 0, rationale: "In subsequent pregnancies, the IgG memory B cells mount an immune response and produce antibodies that cross the placenta to destroy fetal red blood cells." },
  { id: 13, question: "Which fetal physiological consequence is a direct result of the absolute reduction in circulating red blood cells rather than the accumulation of metabolic waste?", options: ["Fetal splenic enlargement", "Fetal hepatic enlargement", "Complete hepatic failure", "Complete renal failure"], correct: 0, rationale: "Splenomegaly is grouped strictly under the complications resulting from the absolute reduction of red blood cells, not from waste products." },
  { id: 14, question: "What is the primary therapeutic purpose of utilizing maternal plasmapheresis as a secondary prevention strategy during a complicated pregnancy?", options: ["To temporarily remove targeted immune antibodies from the maternal circulation", "To permanently suppress the maternal immune response against fetal antigens", "To actively stimulate fetal red blood cell production within the bone marrow", "To continuously enhance fetal lung maturation before early cesarean delivery"], correct: 0, rationale: "Plasmapheresis is a temporary treatment designed to remove maternal antibodies, knowing they can later be reproduced by the mother's immune response." },
  { id: 15, question: "The indirect Coombs test is utilized to precisely identify maternal antibodies that are circulating freely within the fetal blood serum.", options: ["True", "False"], correct: 1, rationale: "The indirect Coombs test is used to find free anti-D antibodies circulating in the mother's serum, not the fetal blood serum." },

                nav.classList.replace('bg-white', 'bg-slate-800');
                nav.classList.replace('border-slate-200', 'border-slate-700');
                footer.classList.replace('bg-white', 'bg-slate-800');
                footer.classList.replace('border-slate-200', 'border-slate-700');
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                body.classList.replace('bg-slate-900', 'bg-slate-50');
                body.classList.replace('text-slate-100', 'text-slate-800');
                nav.classList.replace('bg-slate-800', 'bg-white');
                nav.classList.replace('border-slate-700', 'border-slate-200');
                footer.classList.replace('bg-slate-800', 'bg-white');
                footer.classList.replace('border-slate-700', 'border-slate-200');
                icon.classList.replace('fa-sun', 'fa-moon');
            }
            if (!currentQuizKey) renderHome();
            else renderQuiz();
        }

        function showHome() {
            currentQuizKey = null;
            renderHome();
            window.scrollTo(0,0);
        }

        function startQuiz(key) {
            currentQuizKey = key;
            const originalData = quizzes[key].data;
            currentQuestions = originalData.map(q => {
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return { 
                    ...q, 
                    options: opts.map(o => o.text), 
                    correct: opts.findIndex(o => o.isCorrect) 
                };
            });
            
            for (let i = currentQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
            }

            score = 0;
            answeredCount = 0;
            renderQuiz();
            window.scrollTo(0,0);
        }

        function renderHome() {
            const cardClass = isDark ? "bg-slate-800 border-slate-700" : "bg-white border-slate-200";
            const textClass = isDark ? "text-slate-200" : "text-slate-600";
            
            let html = `
                <div class="text-center mb-10 fade-in">
                    <h2 class="text-3xl font-bold mb-4">Antenatal Quizzes</h2>
                    <p class="${textClass}">قال النبي ﷺ: «من صلى عليّ رد الله عليّ روحي حتى أرد عليه السلام</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 fade-in">
            `;

            for (const [key, quiz] of Object.entries(quizzes)) {
                html += `
                    <div onclick="startQuiz('${key}')" class="card-hover cursor-pointer rounded-2xl p-6 border ${cardClass} transition-all duration-300 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-24 h-24 ${quiz.bg} rounded-bl-full opacity-50 transition-transform group-hover:scale-110"></div>
                        <div class="relative z-10">
                            <div class="w-12 h-12 rounded-xl ${quiz.bg} ${quiz.color} flex items-center justify-center text-2xl mb-4 shadow-sm">
                                <i class="fas ${quiz.icon}"></i>
                            </div>
                            <h3 class="text-lg font-bold mb-2 ltr-text text-left">${quiz.title}</h3>
                            <div class="flex items-center justify-between mt-4">
                                <span class="text-xs font-semibold px-2 py-1 rounded-full ${isDark ? 'bg-slate-700 text-slate-300' : 'bg-slate-100 text-slate-500'}">
                                    <i class="fas fa-list-ol me-1"></i> ${quiz.data.length} Questions
                                </span>
                                <span class="text-xs text-slate-400 flex items-center gap-1">
                                    <i class="fas fa-user-edit"></i> ${quiz.author.split(' ')[0]}..
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
            appContainer.innerHTML = html;
        }

        function renderQuiz() {
            const quizInfo = quizzes[currentQuizKey];
            const cardBg = isDark ? "bg-slate-800" : "bg-white";
            const borderColor = isDark ? "border-slate-700" : "border-slate-200";
            const textColor = isDark ? "text-slate-300" : "text-slate-600";
            
            let html = `
                <div class="max-w-3xl mx-auto fade-in mb-8">
                    <div class="${cardBg} rounded-2xl shadow-sm p-6 mb-8 text-center border-t-4 border-pink-600 relative overflow-hidden">
                        <h1 class="text-2xl font-bold mb-2 ltr-text" dir="auto">${quizInfo.title}</h1>
                        <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-xs mt-2">
                            <i class="fas fa-check-circle"></i> "${quizInfo.author}"
                        </div>
                    </div>
                    
                    <div id="questions-list">
                        ${currentQuestions.map((q, index) => renderQuestionCard(q, index, cardBg, borderColor, textColor)).join('')}
                    </div>

                    <div id="result-summary" class="hidden ${cardBg} rounded-2xl shadow-lg p-8 text-center mt-8 border ${borderColor}">
                        <h2 class="text-2xl font-bold mb-4">Exam Completed!</h2>
                        <div class="text-5xl font-bold text-pink-600 mb-2">
                            <span id="score-display">0</span> <span class="text-2xl text-slate-400">/ ${currentQuestions.length}</span>
                        </div>
                        <p id="score-message" class="text-lg mb-6 text-slate-500"></p>
                        <div class="flex justify-center gap-4">
                            <button onclick="startQuiz('${currentQuizKey}')" class="bg-pink-600 text-white px-6 py-3 rounded-xl hover:bg-pink-700 transition shadow-lg">
                                <i class="fas fa-redo me-2"></i> إعادة الاختبار
                            </button>
                            <button onclick="showHome()" class="bg-slate-200 text-slate-700 px-6 py-3 rounded-xl hover:bg-slate-300 transition shadow-lg">
                                <i class="fas fa-home me-2"></i> القائمة
                            </button>
                        </div>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderQuestionCard(q, index, cardBg, borderColor, textColor) {
            const isTF = q.options.length === 2;
            return `
                <div class="card ${cardBg} rounded-xl p-6 mb-6 border ${borderColor} shadow-sm transition-all" id="card-${index}">
                    <div class="flex justify-between items-center mb-4 border-b ${isDark ? 'border-slate-700' : 'border-slate-100'} pb-3">
                        <span class="bg-pink-100 text-pink-800 text-xs font-bold px-3 py-1 rounded-full">Q ${index + 1}</span>
                        ${isTF ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="${isDark ? 'text-slate-100' : 'text-slate-800'} font-bold mb-6 text-lg leading-relaxed ltr-text text-left">${q.question}</h3>
                    <div class="grid gap-3 ${isTF ? 'grid-cols-2' : 'grid-cols-1'}">
                        ${q.options.map((opt, i) => `
                            <button onclick="checkAnswer(${index},${i})" 
                                class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border${isDark ? 'border-slate-600 hover:bg-slate-700' : 'border-slate-200 hover:bg-pink-50'} focus:outline-none flex items-center justify-between group transition-all ltr-text">
                                <span class="font-medium ${isDark ? 'text-slate-300' : 'text-slate-700'}">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden mt-6 bg-pink-50 rounded-xl p-5 border border-pink-100 fade-in text-left ltr-text">
                        <p class="text-pink-800 text-sm leading-relaxed"><strong class="font-bold">Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>
            `;
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = currentQuestions[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            
            if (!feedback.classList.contains('hidden')) return;
            
            feedback.classList.remove('hidden');
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-pink-50', 'hover:bg-slate-700');
                
                if (i === q.correct) {
                    btn.classList.add('correct-answer');
                    btn.innerHTML += '<i class="fas fa-check float-right mt-1"></i>';
                } else if (i === optIndex) {
                    btn.classList.add('wrong-answer');
                    btn.innerHTML += '<i class="fas fa-times float-right mt-1"></i>';
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            if (optIndex === q.correct) score++;
            answeredCount++;

            if (answeredCount === currentQuestions.length) {
                const summary = document.getElementById('result-summary');
                summary.classList.remove('hidden');
                document.getElementById('score-display').innerText = score;
                
                const percentage = (score / currentQuestions.length) * 100;
                const msg = document.getElementById('score-message');
                if (percentage >= 90) msg.innerText = "Excellent! Outstanding performance! 🌟";
                else if (percentage >= 75) msg.innerText = "Great Job! You know your stuff. 👍";
                else if (percentage >= 50) msg.innerText = "Good effort, but review the rationales. 📚";
                else msg.innerText = "Keep studying and try again! 💪";

                setTimeout(() => summary.scrollIntoView({ behavior: 'smooth' }), 500);
            }
        };

        renderHome();

    </script>
</body>
</html>
