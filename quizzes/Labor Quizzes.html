                    {q:"Which fetal condition is considered a direct indication for an episiotomy?",o:["Fetal distress","Postterm delivery","Normal presentation","Low birth weight"],c:0,r:"Fetal distress, along with a large baby, preterm baby, and malpresentation, are key fetal indications for the procedure."},
                    {q:"The sutures used to close an episiotomy require manual removal by a healthcare provider after 6 weeks.",o:["True","False"],c:1,r:"The sutures used to close an episiotomy reabsorb in the tissues within 6 to 8 weeks and do not require manual removal."},
                    {q:"In a mediolateral episiotomy, the incision is directed at what angle to the midline?",o:["30 degrees","45 degrees","60 degrees","90 degrees"],c:1,r:"The mediolateral incision is precisely directed at a 45-degree angle to the midline towards the ischial tuberosity."},
                    {q:"What is a major disadvantage associated with a median episiotomy?",o:["Higher risk of anal sphincter damage","Increased risk of blood loss","Longer wound healing time","Severe postpartum pain"],c:0,r:"A notable disadvantage of a median episiotomy is the higher incidence of damage to the anal sphincter compared to other types."},
                    {q:"Which block provides anesthesia for the lower two thirds of the vagina and perineum?",o:["Spinal block","Epidural block","Pudendal block","Cervical block"],c:2,r:"A pudendal nerve block involves injecting lidocaine near the ischial spines to provide anesthesia for the lower vagina and perineum."},
                    {q:"What is another medical term commonly used to describe an episiotomy?",o:["Perineoplasty","Preniotomy","Vulvotomy","Colpotomy"],c:1,r:"Another name for episiotomy, which describes the surgical cut of the perineum, is preniotomy."},
                    {q:"Which maternal condition is considered a clinical indication for an episiotomy?",o:["Hypotension","Gestational diabetes","Asthma","Hyperthyroidism"],c:1,r:"Maternal indications for an episiotomy include heart disease, preeclampsia, and gestational diabetes."},
                    {q:"A J-shaped episiotomy starts from the median at the fourchette and is directed laterally upward.",o:["True","False"],c:1,r:"A J-shaped episiotomy is a combination technique that starts from the median at the fourchette and then is directed laterally downward."},
                    {q:"During the repair of an episiotomy, which type of suture is typically used?",o:["1-0 silk","2-0 vicryl","4-0 nylon","5-0 prolene"],c:1,r:"Either 2-0 or 3-0 vicryl or catgut sutures are commonly used for the repair of episiotomy tissues."},
                    {q:"What is the recommended duration for applying ice packs to the perineum after an episiotomy?",o:["The first 12 hours","The first 24 hours","The first 48 hours","The first 72 hours"],c:1,r:"Ice packs should be actively applied during the first 24 hours to effectively decrease local pain and swelling."},
                    {q:"Which simple intervention helps stimulate urination in a postpartum woman?",o:["Administering diuretics","Pouring water over the vulva","Performing uterine massage","Encouraging strict bed rest"],c:1,r:"Urination can be gently stimulated by opening a tap of running water or pouring water over the vulva."},
                    {q:"What is the primary reason some practitioners strongly advise against lateral episiotomy incisions?",o:["Risk of injury to the urethra","Risk of injury to Bartholins duct","Risk of injury to the clitoris","Risk of injury to the cervix"],c:1,r:"There is a distinct risk of injury to Bartholin's duct, which secretes fluid that helps lubricate the vagina."},
                    {q:"The pudendal nerve block can sometimes reduce the mothers urge to bear down during the second stage of labor.",o:["True","False"],c:0,r:"A known disadvantage of the pudendal block is that it may block the maternal urge to bear down during the second stage of labor."},
                    {q:"Which finding indicates a potential complication requiring the patient to contact their healthcare provider?",o:["Mild perineal pain","Passing a blood clot larger than a walnut","Clear vaginal discharge","Body temperature of 37 degrees"],c:1,r:"The patient should immediately call the provider if they pass a blood clot larger than a walnut, indicating potential hemorrhage."},
                    {q:"How many centimeters long is the typical cut made during a standard episiotomy?",o:["1 to 2 cm","2 to 3 cm","4 to 5 cm","6 to 7 cm"],c:2,r:"A single, controlled cut 4 to 5 cm long is made at the correct angle to enlarge the opening."},
                    {q:"Which dietary component is specifically encouraged for a woman recovering from an episiotomy to prevent constipation?",o:["Calcium","Fruits and vegetables","Refined carbohydrates","Dairy products"],c:1,r:"Women are heavily encouraged to take fruits and vegetables, which provide fiber, to prevent constipation after delivery."},
                    {q:"What does the letter R stand for in the REEDA scale used for assessing the episiotomy site?",o:["Reaction","Redness","Recovery","Rupture"],c:1,r:"In the REEDA assessment scale, R stands specifically for Redness."},
                    {q:"What should the practitioner do if blood is aspirated while injecting a local anesthetic into the perineum?",o:["Continue injecting slowly","Withdraw the needle completely and discard it","Reposition the needle and aspirate again","Administer intravenous fluids immediately"],c:2,r:"If blood is aspirated, it indicates a blood vessel was hit. The needle should be repositioned and the procedure repeated until no blood is withdrawn."},
                    {q:"A second-degree perineal laceration involves the muscles of the perineal body and the sphincter ani.",o:["True","False"],c:1,r:"A second-degree laceration extends through the muscles of the perineal body but strictly does not involve the sphincter ani."},
                    {q:"How many fingers are safely inserted into the vagina along the proposed incision line to protect the fetal head?",o:["1 finger","2 fingers","3 fingers","4 fingers"],c:1,r:"Two fingers are inserted into the vagina behind the proposed incision line to protect the fetal head from injury."},
                    {q:"When is the most appropriate time to physically perform the episiotomy incision?",o:["At the onset of labor","During the first stage of labor","At the time of crowning","Immediately after delivery"],c:2,r:"The most appropriate time for the incision is the time of crowning when the presenting part is directly applied to the tissues."},
                    {q:"What is the primary advantage of a mediolateral episiotomy compared to a median episiotomy?",o:["It is easier to repair","It avoids danger of damage to the anal sphincter","It is associated with reduced blood loss","It has a more rapid healing time"],c:1,r:"The mediolateral episiotomy completely avoids the danger of damage to the anal sphincter and provides more enlargement of the vaginal opening."},
                    {q:"Which distance accurately describes the endpoint of a mediolateral incision in relation to the anus?",o:["1.5 cm","2.5 cm","3.5 cm","4.5 cm"],c:1,r:"The mediolateral incision correctly runs diagonally in a straight line about 2.5 cm away from the anus."},
                    {q:"Which specific action should a woman take to avoid contaminating the episiotomy site when changing a sanitary pad?",o:["Remove the pad forwards","Remove the pad backwards","Wash the pad with soap","Use cotton wool instead"],c:1,r:"When changing the pad she should remove the used one backwards to avoid contaminating the episiotomy site."},
                    {q:"Which outcome is considered a significant maternal benefit of performing an episiotomy?",o:["Increasing the duration of the second stage","Stretching the pelvic floor muscles extensively","Avoiding severe perineal tears","Preventing the need for any sutures"],c:2,r:"A primary maternal benefit is directly avoiding severe perineal tears and subsequent damage to the anal sphincter."},
                    {q:"Why is heat applied to the perineum 24 hours after the procedure is completed?",o:["To numb the local nerves","To stop active bleeding","To increase blood supply and promote healing","To dissolve the surgical sutures"],c:2,r:"Following the first 24 hours, heat application is effectively used to increase blood supply and promote tissue healing."}
                ]
            },
            q3: {
                title: "Fetal Skull Quiz",
                data: [
                    {q:"How many minutes does it take for Syntocinon to begin its action?",o:["2.5","5","7.5","10"],c:0,r:"Syntocinon is short acting and starts within 2.5 minutes, whereas Methergin takes 7 to 10 minutes."},
                    {q:"Which condition describes a moulding degree of 2?",o:["Bones are touching","Bones overlap but reduce easily","Bones overlap and are irreducible","Bones are widely separated"],c:1,r:"A degree 2 moulding indicates that the parietal bones overlap but can be easily reduced, unlike degree 3 which is irreducible."},
                    {q:"What is the measurement in centimeters of the bitemporal diameter of the fetal head?",o:["8","9.5","10","11.5"],c:0,r:"The bitemporal diameter is the distance between the anterior ends of the coronal suture and measures 8 centimeters."},
                    {q:"Which gland secretes naturally produced oxytocin into the bloodstream?",o:["Anterior pituitary","Posterior pituitary","Adrenal cortex","Thyroid gland"],c:1,r:"Oxytocin is produced by the hypothalamus and secreted from the posterior pituitary gland."},
                    {q:"Caput succedaneum crosses the suture lines of the fetal skull.",o:["True","False"],c:0,r:"Caput succedaneum involves fluid collection above the periosteum and readily crosses the suture lines."},
                    {q:"Which measurement in centimeters represents the suboccipito bregmatic diameter?",o:["9.5","10","11.5","13.5"],c:0,r:"The suboccipito bregmatic diameter extends from below the occipital protuberance to the center of the bregma and measures 9.5 centimeters."},
                    {q:"Which condition is an absolute contraindication for administering oxytocin?",o:["Grand multipara","Polyhydramnios","Placenta previa","Multiple gestation"],c:2,r:"Placenta previa is an absolute contraindication for vaginal birth and therefore for oxytocin administration."},
                    {q:"At how many weeks after birth does the posterior fontanelle close?",o:["6","8","12","24"],c:0,r:"The posterior fontanelle, also known as lambda, closes at 6 weeks after birth."},
                    {q:"How many bones form the face area of the fetal skull?",o:["5","8","12","14"],c:3,r:"The face extends from the orbital ridge to the junction of the neck with the chin and is composed of 14 small bones."},
                    {q:"How many liters per minute of oxygen should be administered by face mask if uterine hyperstimulation occurs?",o:["2 to 4","4 to 6","6 to 8","8 to 10"],c:2,r:"If hyperstimulation occurs, the nurse should immediately give oxygen at a rate of 6 to 8 liters per minute by face mask."},
                    {q:"Methergin can be administered during stage 1 of labor.",o:["True","False"],c:1,r:"Methergin is indicated only for stage 3 of labor and postpartum to control bleeding."},
                    {q:"Which fetal presentation is associated with the occipito frontal diameter as the engagement diameter?",o:["Occipito posterior","Occipito anterior","Brow presentation","Face presentation"],c:0,r:"The occipito frontal diameter is 11.5 centimeters and serves as the engagement diameter in the occipito posterior position."},
                    {q:"What is the maximum length in centimeters of the anterior fontanelle?",o:["2","4","6","8"],c:1,r:"The anterior fontanelle is a diamond shaped membranous space that is about 3 to 4 centimeters long."},
                    {q:"What is the maximum number of doses recommended for intravenous administration of Methergin?",o:["1","2","3","4"],c:1,r:"Methergin is given intravenously or intramuscularly at a dose of 0.2 milligrams for not more than 2 doses."},
                    {q:"Which anatomical landmarks define the boundaries of the vertex region on the fetal skull?",o:["Anterior fontanel and posterior fontanel","Orbital ridge and anterior fontanel","Orbital ridge and neck junction","Posterior fontanel and skull base"],c:0,r:"The vertex is the area midway between the anterior fontanel, the 2 parietal bones, and the posterior fontanel."},
                    {q:"At how many hours after birth does a cephalohematoma typically begin to develop?",o:["1 to 12","12 to 24","24 to 48","48 to 72"],c:2,r:"The swelling associated with cephalohematoma is not present at birth and develops within the first 24 to 48 hours."},
                    {q:"Craniosynostosis occurs when 1 or more of the skull sutures fuse too early.",o:["True","False"],c:0,r:"Craniosynostosis is the condition where early fusion of the sutures occurs, potentially affecting brain growth."},
                    {q:"Which medication is a synthetic form of oxytocin used in obstetric practice?",o:["Prolactin","Syntocinon","Estrogen","Progesterone"],c:1,r:"Syntocinon and Methergin are both synthetic forms of oxytocin utilized for clinical indications."},
                    {q:"What is the measurement in centimeters of the mento vertical diameter?",o:["9.5","10","11.5","13.5"],c:3,r:"The mento vertical diameter extends from the midpoint of the chin to the highest point on the vertex and measures 13.5 centimeters."},
                    {q:"Which complication is specifically associated with the administration of Syntocinon?",o:["Uterine atony","Hypertonic uterus","Placenta accreta","Cervical incompetence"],c:1,r:"Complications of Syntocinon include a hypertonic uterus, ruptured uterus, and fetal distress."},
                    {q:"Breastfeeding acts as a natural stimulant for the secretion of oxytocin.",o:["True","False"],c:0,r:"Natural stimulants for oxytocin secretion include childbirth, breastfeeding, laughter, and massage."},
                    {q:"Which suture separates the frontal and parietal bones on the fetal skull?",o:["Frontal suture","Coronal suture","Sagittal suture","Lambdoidal suture"],c:1,r:"The coronal suture is the membranous line that separates the frontal and parietal bones."},
                    {q:"Which adverse effect is linked to the metabolic and nutritional impact of oxytocin?",o:["Hypoglycemia","Hypercalcemia","Water intoxication","Protein deficiency"],c:2,r:"The metabolic and nutritional side effects of oxytocin include water intoxication with convulsions, coma, and even death."},
                    {q:"Within how many days does caput succedaneum typically absorb and disappear?",o:["1 to 2","3 to 4","7 to 10","14 to 21"],c:1,r:"The edema of caput succedaneum is gradually absorbed and disappears around day 3 or 4 of life."},
                    {q:"Which nursing intervention is most appropriate if uterine hyperstimulation occurs during oxytocin infusion?",o:["Increase the oxytocin rate","Change position to left side","Administer oral fluids","Instruct the mother to push"],c:1,r:"If hyperstimulation occurs, the nurse should turn off the oxytocin, speed up the primary infusion, change position to the left side, and give oxygen."},
                    {q:"The submento bregmatic diameter measures 11.5 centimeters in a completely extended face presentation.",o:["True","False"],c:1,r:"The submento bregmatic diameter measures 9.5 centimeters and is the engagement diameter in complete face presentation. The submento vertical measures 11.5 centimeters."},
                    {q:"How many distinct layers comprise the scalp tissue of the fetal head?",o:["3","4","5","6"],c:2,r:"There are 5 layers of scalp tissue: skin, subcutaneous tissue, muscle layer, connective tissue, and periosteum."},
                    {q:"Which condition is a medical indication to administer oxytocin?",o:["Complete abortion","Incomplete abortion","Ectopic pregnancy","Molar pregnancy"],c:1,r:"Medical indications for oxytocin include inducing labor, controlling postpartum bleeding, and managing an incomplete abortion."},
                    {q:"Which shape describes the physical structure of the posterior fontanelle?",o:["Diamond","Circular","Square","Triangular"],c:3,r:"The posterior fontanelle is a small triangular membranous space formed at the junction of the sagittal and lambdoidal sutures."},
                    {q:"Which symptom is a documented side effect of administering Methergin?",o:["Blurred vision","Chest pain","Muscle weakness","Hearing loss"],c:1,r:"Side effects of Methergin include abdominal cramps, chest pain, palpitation, and dyspnea."},
                    {q:"Which suture separates the 2 parietal bones on the fetal skull vault?",o:["Sagittal suture","Coronal suture","Frontal suture","Lambdoidal suture"],c:0,r:"The sagittal suture is responsible for separating the 2 parietal bones on the vault of the fetal skull."},
                    {q:"At how many centimeters of cervical dilatation should the oxytocin infusion generally be stopped?",o:["3 to 4","5 to 6","7 to 8","9 to 10"],c:1,r:"Once the desired contractions and a cervical dilatation of 5 to 6 centimeters are reached, the oxytocin infusion should be stopped."},
                    {q:"Which diameter serves as the primary engagement measurement during a brow presentation?",o:["Occipito frontal diameter","Suboccipito bregmatic diameter","Mento vertical diameter","Submento vertical diameter"],c:2,r:"The mento vertical diameter is 13.5 centimeters and is the engagement diameter in a brow presentation, making it too large to enter the pelvis."},
                    {q:"How many units of Syntocinon are typically added to a 500 milliliter electrolyte solution?",o:["1 to 3","5 to 10","12 to 15","20 to 25"],c:1,r:"The standard dosage for Syntocinon administration is 5 to 10 units added to a 500 milliliter electrolyte solution given intravenously."},
                    {q:"Which structures define the vertical boundaries of the fetal face region?",o:["Anterior fontanel and lower jaw","Orbital ridge and neck junction","Frontal suture and collarbone","Sagittal suture and upper lip"],c:1,r:"The face area extends from the orbital ridge down to the junction of the neck with the chin."}
                ]
            },
            q4: {
                title: "Non-pharmacological pain relief",
                data: [
                    {q:"Which physiological response is commonly associated with the experience of pain during labor?",o:["Dilated pupils","Decreased pulse","Lowered pressure","Slowed breathing"],c:0,r:"Physiological responses to pain include dilated pupils, rapid breathing, and elevated blood pressure and pulse."},
                    {q:"According to the gate control theory pain is transmitted by large sensory nerve fibers.",o:["True","False"],c:1,r:"Pain is transmitted by small sensory nerve fibers, while large fibers transmit sensations like touch and temperature."},
                    {q:"What is the approximate respiratory rate for modified paced breathing during labor contractions?",o:["32 to 40","6 to 8","12 to 20","45 to 60"],c:0,r:"Modified paced breathing is shallower and approximately twice the normal rate, which is 32 to 40 breaths per minute."},
                    {q:"Which type of nerve fibers are believed to inhibit the transmission of pain impulses in the dorsal horn?",o:["Rapidly conducting large fibers","Slowly conducting small fibers","Rapidly conducting small fibers","Slowly conducting large fibers"],c:0,r:"Large rapidly conducting A alpha and A beta fibers inhibit the transmission of pain impulses through central transmission cells."},
                    {q:"Hydrotherapy involves immersing the mother in warm water for the actual delivery of the baby.",o:["True","False"],c:1,r:"Hydrotherapy is used during labor for comfort, whereas water birth involves delivering the baby underwater."},
                    {q:"Which cognitive technique uses self suggestion and relaxation images similar to daydreaming?",o:["Self hypnosis","Guided imagery","Focal point","Aromatherapy"],c:0,r:"Self hypnosis uses self suggestion and images of relaxation, which resembles daydreaming to change the level of awareness."},
                    {q:"Which phase of labor is associated with perineal pressure and episiotomy as primary sources of pain?",o:["Stage 2","Stage 1","Stage 3","Stage 4"],c:0,r:"The second stage of labor involves perineal pressure, strong uterine contractions, and possible episiotomy or lacerations."},
                    {q:"What volume of sterile water is used for each intradermal water block injection?",o:["0.05 to 0.1","0.5 to 1.0","1.5 to 2.0","2.5 to 3.0"],c:0,r:"Intradermal water blocks consist of four injections using 0.05 to 0.1 milliliters of sterile water."},
                    {q:"Intradermal water blocks consist of four injections of sterile water to decrease back pain during labor.",o:["True","False"],c:0,r:"The method consists of four intradermal injections of sterile water to decrease back pain and to some extent abdominal pain."},
                    {q:"What action is performed at the beginning and end of every breathing pattern during labor?",o:["Cleansing breath","Rapid panting","Holding breath","Forced pushing"],c:0,r:"Each breathing pattern begins and ends with a cleansing breath, which is a deep inspiration through the nose and expiration through the mouth."},
                    {q:"Which area is typically targeted for the application of cold packs during labor?",o:["The face","The abdomen","The perineum","The groin"],c:0,r:"Cold is usually applied to the woman's back, chest, and face during labor, whereas heat is applied to the abdomen, groin, and perineum."},
                    {q:"Transcutaneous electrical nerve stimulation reduces contraction pain awareness by sending impulses through surface electrodes.",o:["True","False"],c:0,r:"Transcutaneous electrical nerve stimulation uses surface electrodes to transmit low voltage electrical impulses, which blocks pain signals or releases endorphins."},
                    {q:"What is the suggested ratio for pattern paced breathing during the transition phase of labor?",o:["3 to 1","2 to 1","4 to 1","5 to 1"],c:0,r:"The pattern paced breathing technique uses a 3 to 1 pattern of breathing in and out three times followed by blowing."},
                    {q:"Which non pharmacological tool allows the laboring woman to sit comfortably with spread legs?",o:["Birthing ball","Labor sling","Birthing chair","Massage table"],c:0,r:"A birthing ball is a larger gym ball that allows the mother to exercise and sit comfortably with spread legs."},
                    {q:"The slow paced breathing rate during labor is approximately 32 to 40 breaths per minute.",o:["True","False"],c:1,r:"Slow paced breathing is 6 to 8 breaths per minute. Modified paced breathing is 32 to 40 breaths per minute."},
                    {q:"According to the endorphin theory what triggers the release of natural morphine like substances in the body?",o:["Stress and pain","Rest and sleep","Food and drink","Heat and cold"],c:0,r:"Stress and pain activate endorphins, increasing their levels during pregnancy and reaching a peak during labor."},
                    {q:"Which technique requires the woman to fix her eyes on a particular spot in the room?",o:["Focal point","Guided imagery","Visual hypnosis","Audio analgesia"],c:0,r:"The focal point technique involves fixing the eyes on a picture, an object, or a specific spot in the room to direct thought away from contractions."},
                    {q:"Non pharmacological pain relief methods carry a high risk of adverse drug effects if not applied early.",o:["True","False"],c:1,r:"Non pharmacological methods carry no risk of allergy or adverse drug effects and do not harm the mother or fetus."},
                    {q:"Which anatomical region experiences ischemia and anaerobic metabolism due to blocked blood flow during contractions?",o:["Uterus","Cervix","Bladder","Rectum"],c:0,r:"Blood flow to the uterus is blocked during contractions, leading to tissue ischemia and anaerobic metabolism, causing pain."},
                    {q:"What limits the success of non pharmacological pain management methods?",o:["Methods must be practiced before labor","Methods must be practiced after labor","They slow down the progress of labor","They pose high risks to the fetus"],c:0,r:"A limitation of non pharmacological methods is that preparation and practice should occur before labor begins."},
                    {q:"Effleurage is a light massage of the abdomen in rhythm with breathing during contractions.",o:["True","False"],c:0,r:"Effleurage is a light massage usually applied to the abdomen in rhythm with breathing to distract from contraction pain."},
                    {q:"Which type of nerve fibers are responsible for transmitting pain signals to the brain?",o:["A delta and C fibers","A alpha and A beta fibers","A beta and C fibers","A alpha and A delta fibers"],c:0,r:"Small slowly conducting A delta and C fibers facilitate the transmission of pain impulses, opening the gate to pain perception."},
                    {q:"What is a primary benefit of using a labor sling during childbirth?",o:["Supporting an upright position","Decreasing the respiratory rate","Lowering maternal blood pressure","Increasing abdominal circulation"],c:0,r:"The labor sling is a soft ribbon of cloth that supports the expecting mother in an upright position during labor."},
                    {q:"Endorphin levels decrease during pregnancy and reach their lowest point during labor.",o:["True","False"],c:1,r:"Endorphin levels actually increase during pregnancy and reach their peak during labor."},
                    {q:"Which action describes the behavioral response to pain during labor?",o:["Rubbing the painful part","Experiencing intense nausea","Feeling intense hopelessness","Sweating on the forehead"],c:0,r:"Behavioral responses include crying, moaning, rubbing the painful part, and focusing on the pain."},
                    {q:"Which psychological state acts as a stressor that lowers a patient's pain tolerance?",o:["Uncertainty","Familiarity","Confidence","Relaxation"],c:0,r:"Uncertainty is specifically noted as a stressor that may lower a patient's ability to tolerate pain."},
                    {q:"According to traditional Chinese medicine acupuncture stimulates points to release the flow of energy.",o:["True","False"],c:0,r:"Acupuncture stimulates specific anatomic points to release energy which then travels through meridians for healing."},
                    {q:"Which procedure causes pain during the fourth stage of labor?",o:["Episiotomy repair","Fetal presentation","Cervical dilation","Fundal pressure"],c:0,r:"The fourth stage of labor involves the repair of the episiotomy, which is a significant source of pain."},
                    {q:"How many injections are administered to form the small papules in an intradermal water block?",o:["4","2","3","5"],c:0,r:"The intradermal water block consists of four injections of sterile water to form small blebs or papules."},
                    {q:"Women with heart disease are considered good candidates for water immersion during labor.",o:["True","False"],c:1,r:"Heart disease in mothers is listed as a clear contraindication for water immersion during labor."},
                    {q:"Which concept refers to the amount of pain a client is willing to endure without seeking relief?",o:["Pain tolerance","Pain intensity","Pain threshold","Pain perception"],c:0,r:"Pain tolerance is the duration or intensity of pain that a client is willing to endure without pain relief."},
                    {q:"What intervention helps prevent hyperventilation and maternal fatigue during intense contractions?",o:["Combining breathing patterns","Holding breath completely","Panting continuously rapidly","Pushing firmly downwards"],c:0,r:"Combining slow and modified paced breathing helps conserve maternal energy, lessens fatigue, and reduces the likelihood of hyperventilation."},
                    {q:"What is a known maternal benefit of water immersion therapy during labor?",o:["Reduced pain perception","Increased drug requirement","Prolonged labor stages","Increased perineal trauma"],c:0,r:"Water birth and hydrotherapy lead to reduced pain perception, increased birth satisfaction, and shorter stages of labor."},
                    {q:"Which non pharmacological technique involves placing electrodes near the spine to deliver electrical impulses?",o:["Transcutaneous electrical stimulation","Electromagnetic signal conduction","Central nervous system acupressure","Intracutaneous sterile water block"],c:0,r:"Transcutaneous electrical nerve stimulation transmits low voltage electrical impulses to the skin via surface electrodes to block pain."},
                    {q:"What point defines when a woman first feels the sensation of pain?",o:["Pain threshold","Pain tolerance","Pain intensity","Pain perception"],c:0,r:"Pain threshold is defined as the point at which women first feel pain."},
                    {q:"Which maternal factor is considered a contraindication for water immersion during labor?",o:["Maternal fever greater than 38","Maternal fever less than 37","History of rapid progression","History of prolonged stages"],c:0,r:"A maternal fever greater than 38 degrees Celsius or 100 degrees Fahrenheit is a contraindication for water immersion."},
                    {q:"Which essential oils are specifically noted for promoting comfort and relaxation during labor?",o:["Rose and lavender","Lemon and orange","Mint and eucalyptus","Tea tree and cedar"],c:0,r:"Aromatherapy uses fragrances like rose and lavender oils, which are believed to promote comfort, relaxation, and decrease pain."},
                    {q:"Which emotional response is considered an affective reaction to pain?",o:["Hopelessness","Moaning loudly","Rubbing skin","Rapid breathing"],c:0,r:"Affective responses to pain include withdrawal, fatigue, hopelessness, anxiety, anger, and fear."},
                    {q:"What describes the severity of the pain sensation described as mild or strong?",o:["Pain intensity","Pain tolerance","Pain threshold","Pain perception"],c:0,r:"Pain intensity refers to the severity of the sensation itself, which is described as mild, moderate, or strong."},
                    {q:"Which pain relief method involves applying firm pressure against the sacral area during contractions?",o:["Sacral pressure","Abdominal effleurage","Cutaneous stimulation","Intradermal injection"],c:0,r:"Sacral pressure involves applying firm continuous pressure against the sacral area to relieve strain on the sacroiliac joint."}
                ]
            },
            q5: {
                title: "PARTOGRAPH",
                data: [
                    {q:"At what cervical dilatation does the active phase begin on the modified World Health Organization partograph?",o:["2 centimeters","3 centimeters","4 centimeters","5 centimeters"],c:2,r:"The modified World Health Organization partograph removed the latent phase and defined the beginning of the active phase at 4 centimeters cervical dilatation instead of 3 centimeters."},
                    {q:"How is a uterine contraction lasting 35 seconds shaded on the partograph grid?",o:["Filled in solid black","Shaded with italic lines","Shaded with small dots","Left completely blank"],c:1,r:"Contractions lasting between 20 and 40 seconds are considered moderate and should be shaded with italic lines on the partograph."},
                    {q:"Increasing moulding of the fetal skull bones while the fetal head remains high in the pelvis is a warning sign of cephalopelvic disproportion.",o:["True","False"],c:0,r:"Increasing moulding with the head high in the pelvis indicates that the pelvis cannot adequately accommodate the fetal head, which is a warning sign of cephalopelvic disproportion."},
                    {q:"How frequently should maternal blood pressure and temperature be recorded during normal labor on the partograph?",o:["Once every 1 hour","Once every 2 hours","Once every 4 hours","Once every 8 hours"],c:2,r:"Maternal blood pressure and temperature should be assessed and recorded once every 4 hours, or more frequently if clinically indicated."},
                    {q:"Which gestational age is considered a contraindication for initiating a partograph?",o:["Less than 30 weeks","Less than 34 weeks","Less than 37 weeks","Less than 40 weeks"],c:0,r:"A female with less than 30 weeks gestation is listed among the contraindications for using a partograph."},
                    {q:"When an abnormal fetal heart rate is detected, how often must the clinician listen to the fetal heart sound?",o:["Every 5 minutes","Every 10 minutes","Every 15 minutes","Every 30 minutes"],c:2,r:"If an abnormal fetal heart rate is heard, the clinician must listen every 15 minutes for at least 1 minute."},
                    {q:"A woman is admitted at 14:00 with 1 centimeter cervical dilatation, reaches 5 centimeters at 17:00, and achieves 10 centimeters at 20:00. What is the total length of the first stage of labor observed in the unit?",o:["3 hours","5 hours","6 hours","8 hours"],c:2,r:"From admission at 14:00 to full cervical dilatation at 20:00 represents a total observed duration of 6 hours in the unit."},
                    {q:"During abdominal examination using the rule of fifths, if the entire fetal head is felt above the pelvic brim, how is it recorded?",o:["0 over 5","1 over 5","4 over 5","5 over 5"],c:3,r:"If the fetal head is completely above the pelvic brim and accommodates the full width of 5 fingers above the symphysis pubis, it is recorded as 5 over 5."},
                    {q:"The action line on the partograph is drawn 2 hours to the right of the alert line.",o:["True","False"],c:1,r:"The action line is drawn 4 hours to the right of the alert line, not 2 hours."},
                    {q:"Which letter is recorded on the partograph when the membranes have ruptured and no amniotic fluid is seen?",o:["Letter A","Letter B","Letter C","Letter I"],c:0,r:"If the membranes are ruptured and liquor is absent, it is recorded on the partograph using the letter A."},
                    {q:"When oxytocin is administered during labor, it should be titrated every 30 minutes until contractions reach what frequency in 10 minutes?",o:["2 contractions","3 contractions","4 contractions","5 contractions"],c:1,r:"Oxytocin should be titrated against uterine contractions and increased every 30 minutes until contractions are 3 in 10 minutes, each lasting 40 to 50 seconds."},
                    {q:"What is the maximum normal duration of the latent phase on the composite World Health Organization partograph before progress is considered abnormal?",o:["4 hours","6 hours","8 hours","12 hours"],c:2,r:"The latent phase from 0 to 3 centimeters dilatation should normally not last longer than 8 hours."},
                    {q:"When labor transitions from the latent phase to the active phase, what letters are written on the broken line transferring the plot to the alert line?",o:["Letters AC","Letters AL","Letters LP","Letters TR"],c:3,r:"When the active phase begins, plotting of cervical dilatation is immediately transferred from the latent phase area to the alert line using the letters TR."},
                    {q:"A partograph helps identify pre-existing maternal risk factors that were present before the onset of labor.",o:["True","False"],c:1,r:"The partograph is a tool for managing labor progress and condition during labor only; it does not help identify other risk factors present before labor started."},
                    {q:"What symbol is used to plot the descent of the fetal head on the central graph of the partograph?",o:["Symbol O","Symbol X","Symbol +","Symbol 0"],c:0,r:"Descent of the fetal head is plotted using the symbol O, while cervical dilatation is plotted using the symbol X."},
                    {q:"In which maternal position should the fetal heart sound be auscultated immediately after a uterine contraction?",o:["Dorsal position","Lateral position","Lithotomy position","Prone position"],c:1,r:"The fetal heart sound is listened to immediately after a contraction for 1 minute with the woman in the lateral position."},
                    {q:"How is moulding recorded on the partograph when the fetal skull bones are separated and the suture is easily felt?",o:["Symbol 0","Symbol +","Symbol ++","Symbol +++"],c:0,r:"When the fetal skull bones are separated and the suture can be felt easily, moulding is recorded as 0."},
                    {q:"What is the minimum expected rate of cervical dilatation during the active phase of normal labor?",o:["0.5 centimeters per hour","1 centimeter per hour","1.5 centimeters per hour","2 centimeters per hour"],c:1,r:"During the active phase from 3 centimeters to 10 centimeters, cervical dilatation should progress at a rate of at least 1 centimeter per hour."},
                    {q:"Descent of the fetal head may not occur until cervical dilatation reaches approximately 7 centimeters.",o:["True","False"],c:0,r:"Although dilatation should be accompanied by descent, descent of the fetal head may not take place until the cervix has reached about 7 centimeters dilatation."},
                    {q:"How often should the maternal pulse rate be monitored and recorded on the partograph?",o:["Every 15 minutes","Every 30 minutes","Every 60 minutes","Every 120 minutes"],c:1,r:"Maternal pulse rate should be recorded every 30 minutes on the maternal condition section of the partograph."},
                    {q:"During which specific time window of an observation interval are uterine contractions counted and assessed?",o:["First 5 minutes","First 10 minutes","Last 5 minutes","Last 10 minutes"],c:3,r:"Uterine contractions are assessed in the last 10 minutes of each half-hour or 1-hour observation period."},
                    {q:"Which cervical dilatation range on admission is a contraindication to starting a partograph?",o:["1 to 2 centimeters","3 to 4 centimeters","5 to 6 centimeters","9 to 10 centimeters"],c:3,r:"Admission at 9 centimeters to 10 centimeters cervical dilatation is a contraindication for starting a partograph because the woman is already near full dilatation."},
                    {q:"What is the normal baseline range for fetal heart rate in beats per minute as defined in the partograph guidelines?",o:["100 to 140","110 to 150","120 to 160","130 to 170"],c:2,r:"The normal fetal heart rate defined in the document is 120 to 160 beats per minute."},
                    {q:"When a woman is admitted in the active phase of labor, the initial cervical dilatation must be plotted at hour 0 in the latent phase section.",o:["True","False"],c:1,r:"When admission takes place in the active phase of labor, the recording of cervical dilatation should be started directly on the alert line, whereas hour 0 is used when she arrives in the latent phase."},
                    {q:"How often should the woman be encouraged to pass urine so that volume, protein, and acetone can be checked?",o:["Every 1 to 2 hours","Every 2 to 4 hours","Every 4 to 6 hours","Every 6 to 8 hours"],c:1,r:"Urine volume is measured by encouraging the woman to pass urine every 2 to 4 hours, checking for protein and acetone."},
                    {q:"Over how many consecutive 15-minute observations must an abnormal fetal heart rate persist before urgent action is required?",o:["2 observations","3 observations","4 observations","5 observations"],c:1,r:"If an abnormal fetal heart rate is heard, it is checked every 15 minutes, and if it remains abnormal over 3 observations, action should be taken."},
                    {q:"Which obstetric condition is an absolute contraindication to starting a partograph because it requires immediate delivery or intervention?",o:["Mild contractions","Intact membranes","Antepartum hemorrhage","Latent phase admission"],c:2,r:"Complications of pregnancy requiring immediate action, such as antepartum hemorrhage, eclampsia, fetal distress, and malpresentation, are contraindications to using a partograph."},
                    {q:"In the latent phase of labor, how frequently are uterine contractions observed and recorded on the partograph?",o:["Every 15 minutes","Every 30 minutes","Every 60 minutes","Every 120 minutes"],c:2,r:"Observations of uterine contractions are made every 1 hour in the latent phase and every 30 minutes in the active phase."},
                    {q:"The descent of the fetal head must always be assessed by abdominal examination immediately before performing a vaginal examination.",o:["True","False"],c:0,r:"Descent of the fetal head should always be assessed by abdominal examination using the rule of fifths immediately before doing a vaginal examination."},
                    {q:"Where is the section for recording amniotic liquor located on the partograph sheet?",o:["Immediately below fetal heart rate","Immediately below moulding section","Immediately below time line","Immediately below oxytocin section"],c:0,r:"The state of membranes and liquor is recorded on the partograph immediately below the fetal heart rate section, while moulding is directly beneath liquor."},
                    {q:"What does each square along the vertical axis of the cervical dilatation graph represent?",o:["1 centimeter dilatation","2 centimeters dilatation","1 hour of labor","2 hours of labor"],c:0,r:"Along the vertical line on the left side of the cervical dilatation graph, there are numbers from 0 to 10 against squares, where each square represents 1 centimeter of dilatation."},
                    {q:"When uterine contractions last less than 20 seconds, how should the corresponding squares on the partograph be shaded?",o:["Filled in solid black","Shaded with italic lines","Shaded with small dots","Marked with letter X"],c:2,r:"Contractions lasting less than 20 seconds are classified as mild and the squares should be shaded with dots."},
                    {q:"If fetal distress develops during an oxytocin infusion, which maternal side should the woman be turned onto after stopping the infusion?",o:["Left side","Right side","Supine side","Prone side"],c:0,r:"In case of fetal distress, after stopping oxytocin and starting intravenous fluids and oxygen, the woman can be turned to the left side for better fetal circulation."},
                    {q:"As labor progresses normally, the plotted symbols for fetal head descent should gradually rise higher on the partograph grid.",o:["True","False"],c:1,r:"As the cervical dilatation symbol X rises up the graph, the descent symbol O should drop down the graph and should never go up."},
                    {q:"Why was the latent phase removed when designing the modified World Health Organization partograph?",o:["Differentiating it from false labor is difficult","Latent phase always causes poor fetal outcomes","Cervical dilatation cannot be measured below 4 centimeters","Uterine contractions do not occur in latent phase"],c:0,r:"Because prolonged latent phase is infrequent, not usually associated with poor perinatal outcome, and differentiating it from false labor is often difficult, the modified partograph removed the latent phase."},
                    {q:"How is moulding recorded when the fetal skull bones are just touching each other without overlapping?",o:["Symbol 0","Symbol +","Symbol ++","Symbol +++"],c:1,r:"When the fetal skull bones are just touching each other, moulding is recorded on the partograph as a single plus sign +."},
                    {q:"What is the recommended interval between routine vaginal examinations during normal labor unless otherwise indicated?",o:["Every 1 hour","Every 2 hours","Every 3 hours","Every 4 hours"],c:3,r:"Vaginal examinations should be performed once every 4 hours unless contraindicated or in advanced labor in a multipara."},
                    {q:"What action is indicated when the cervical dilatation plot moves to the right of the alert line in a facility without obstetric emergency capabilities?",o:["Transfer the woman to a hospital","Perform an immediate cesarean section","Discharge the woman to await active labor","Continue routine observation for 8 hours"],c:0,r:"If cervical dilatation moves to the right of the alert line and adequate facilities to deal with obstetric emergencies are not available, the woman must be transferred to a hospital."},
                    {q:"Uterine contractions are recorded every 30 minutes during the active phase of labor.",o:["True","False"],c:0,r:"Observations of uterine contractions are made every 1 hour in the latent phase and every 30 minutes in the active phase."},
                    {q:"When transferring cervical dilatation from the latent phase to the alert line, how is the space between the original plot and the transferred plot handled?",o:["Left completely blank","Shaded with solid black","Filled with hourly X marks","Shaded with diagonal lines"],c:0,r:"When transferring the plot to the alert line using the broken TR line, the area between the transferred recording is left blank because the transfer line is not part of the process of labor."}
                ]
            },
            q6: {
                title: "Cardiotocography (CTG)",
                data: [
                    {q:"What is the normal baseline fetal heart rate range in beats per minute?",o:["90 to 130 beats per minute","100 to 150 beats per minute","110 to 160 beats per minute","120 to 180 beats per minute"],c:2,r:"The normal average fetal heart rate excluding accelerations and decelerations is 110 to 160 beats per minute."},
                    {q:"Which nursing intervention is performed before starting the cardiotocography procedure?",o:["Performing maternal Leopold maneuvers","Positioning the woman on her side","Measuring maternal vital signs","Discontinuing ongoing oxytocin infusions"],c:2,r:"Measuring maternal vital signs, preparing equipment, and educating the patient are performed before the cardiotocography procedure."},
                    {q:"Internal cardiotocography can be safely performed when the amniotic membranes remain intact.",o:["True","False"],c:1,r:"Internal cardiotocography is an invasive method that is only possible during labor after the rupture of membranes; intact membranes are a contraindication."},
                    {q:"At what gestational age range does cardiotocography monitoring typically begin?",o:["From 20 to 24 weeks of gestation","From 24 to 28 weeks of gestation","From 28 to 32 weeks of gestation","From 32 to 36 weeks of gestation"],c:2,r:"The timing of cardiotocography starts from 28 to 32 weeks of gestation."},
                    {q:"Which deceleration pattern shows an abrupt onset and offset due to umbilical cord compression?",o:["Early deceleration pattern","Late deceleration pattern","Variable deceleration pattern","Prolonged deceleration pattern"],c:2,r:"Variable decelerations have an abrupt onset and offset and are often caused by umbilical cord compression."},
                    {q:"Which instrument is placed on the maternal abdomen to measure uterine contractions during external monitoring?",o:["External ultrasound transducer","Abdominal tocodynamometer sensor","Fetal scalp electrode","Intrauterine pressure catheter"],c:1,r:"External monitoring uses a tocodynamometer on the abdomen to measure uterine contractions and an ultrasound transducer to detect fetal heart rate."},
                    {q:"What amplitude range defines moderate baseline variability in beats per minute?",o:["1 to 5 beats per minute","6 to 25 beats per minute","15 to 30 beats per minute","26 to 40 beats per minute"],c:1,r:"Moderate variability has an amplitude range between 6 and 25 beats per minute and is considered a normal and reassuring sign."},
                    {q:"A reactive non-stress test requires at least 2 accelerations within a 20-minute window.",o:["True","False"],c:0,r:"A normal reactive non-stress test is defined by 2 or more accelerations occurring within 20 minutes."},
                    {q:"Which condition is classified as a fetal indication for performing cardiotocography?",o:["Severe maternal pyelonephritis","Chronic maternal hypertension","Meconium stained amniotic fluid","Confirmed placenta previa"],c:2,r:"Meconium-stained liquor is a fetal indication for cardiotocography, whereas hypertension, pyelonephritis, and placenta previa are maternal indications."},
                    {q:"How many uterine contractions in a 10-minute window indicate a risk for tachysystole?",o:["More than 3 contractions","More than 4 contractions","More than 5 contractions","More than 6 contractions"],c:2,r:"Having more than 5 contractions in a 10-minute window is considered excessive and indicates a risk of tachysystole."},
                    {q:"Which condition is an absolute contraindication for applying a fetal scalp electrode?",o:["Maternal gestational diabetes","Active maternal genital herpes","Post-term pregnancy status","Meconium stained amniotic fluid"],c:1,r:"Maternal infections that can be transmitted to the fetus, such as active genital herpes, human immunodeficiency virus, and hepatitis B or C, contraindicate internal monitoring."},
                    {q:"What is the primary purpose of the contraction stress test during pregnancy?",o:["Evaluating fetal heart rate during spontaneous fetal movement","Measuring direct intrauterine pressure after membrane rupture","Assessing fetal tolerance to temporary oxygen reduction during contractions","Detecting congenital cardiac anomalies before labor begins"],c:2,r:"The contraction stress test evaluates whether the fetus can tolerate the temporary reduction in oxygen supply caused by spontaneous or induced uterine contractions."},
                    {q:"Early decelerations begin after the contraction peak and indicate uteroplacental insufficiency.",o:["True","False"],c:1,r:"Late decelerations begin after the contraction peak and indicate uteroplacental insufficiency, whereas early decelerations mirror contractions and are benign."},
                    {q:"What is the primary underlying cause of early decelerations on a cardiotocography tracing?",o:["Fetal head compression","Umbilical cord compression","Uteroplacental vascular insufficiency","Maternal systemic hypovolemia"],c:0,r:"Early decelerations mirror contractions, are benign, and are most often caused by fetal head compression."},
                    {q:"In a term fetus, an acceleration is defined as a sudden heart rate rise of at least 15 beats per minute lasting how long?",o:["At least 5 seconds","At least 10 seconds","At least 15 seconds","At least 20 seconds"],c:2,r:"For a term fetus, an acceleration is a transient rise of at least 15 beats per minute above baseline lasting at least 15 seconds."},
                    {q:"Over what duration is the 10-minute uterine contraction count averaged during cardiotocography evaluation?",o:["Over a 15-minute period","Over a 20-minute period","Over a 30-minute period","Over a 60-minute period"],c:2,r:"Uterine contractions are counted within a 10-minute window and averaged over a 30-minute period."},
                    {q:"Which variability category describes a detectable amplitude range of 5 beats per minute or less?",o:["Absent baseline variability","Minimal baseline variability","Moderate baseline variability","Marked baseline variability"],c:1,r:"Minimal variability occurs when the amplitude range of fluctuations is detectable but is 5 beats per minute or less."},
                    {q:"Which corrective nursing action is initiated immediately when fetal distress is detected during labor?",o:["Increasing the rate of oxytocin infusion","Placing the mother in a supine position","Increasing intravenous fluid administration","Performing routine patient education"],c:2,r:"Corrective actions for fetal distress include increasing intravenous fluids to correct maternal hypovolemia, lateral repositioning, administering oxygen, and stopping oxytocin."},
                    {q:"During auscultation, 1 transducer is placed on the uterine fundus and the 2nd is placed according to the fetal position.",o:["True","False"],c:0,r:"When placing transducers, 1 is placed on the fundus and the other is positioned according to the position of the fetus."},
                    {q:"What does the first letter D represent in the mnemonic used for reading cardiotocography tracings?",o:["Determining fetal deceleration patterns","Assessing maternal and fetal risk context","Documenting contraction duration","Detecting baseline heart rate drops"],c:1,r:"The initial DR stands for defining risk, which requires considering maternal and fetal risk context such as comorbidities and gestational age."},
                    {q:"What gestational age threshold defines a post-term pregnancy as a maternal indication for cardiotocography?",o:["Greater than 38 weeks","Greater than 39 weeks","Greater than 40 weeks","Greater than 41 weeks"],c:3,r:"Post-term pregnancy is defined as a gestation greater than 41 weeks and serves as a maternal indication for cardiotocography."},
                    {q:"Why is suspected fetal prematurity considered a contraindication for internal cardiotocography?",o:["Risk of severe maternal hemorrhage","Risk of fetal scalp injury","Risk of umbilical cord prolapse","Risk of vertical infection transmission"],c:1,r:"Suspected prematurity is a contraindication for internal cardiotocography due to the risk of fetal scalp injury from the electrode."},
                    {q:"Over what minimum time frame should the baseline fetal heart rate be determined while excluding accelerations and decelerations?",o:["Over a 2-minute period","Over a 5-minute period","Over a 10-minute period","Over a 20-minute period"],c:2,r:"The baseline fetal heart rate is determined by averaging the rate over a 10-minute period while ignoring accelerations and decelerations."},
                    {q:"Marked baseline variability is defined by an amplitude range greater than 25 beats per minute.",o:["True","False"],c:0,r:"Marked variability occurs when the amplitude range of fetal heart rate fluctuations is greater than 25 beats per minute."},
                    {q:"Which clinical technique is performed by the nurse during the procedure to identify the fetal position?",o:["Contraction stress testing","External abdominal auscultation","Abdominal Leopold maneuver","Intrauterine catheter insertion"],c:2,r:"During the cardiotocography procedure, nurses perform Leopold maneuvers to identify the fetal position for accurate transducer placement."}
                ]
            },
            q7: {
                title: "Fetal Circulation",
                data: [
                    {q:"After birth, what anatomical structure does the closing ductus arteriosus atrophy to become?",o:["The ligamentum arteriosum","The ligamentum venosum","The ligamentum teres","The hypogastric ligament"],c:0,r:"At birth, as blood flows to the expanding lungs, the ductus arteriosus closes and atrophies to become the ligamentum arteriosum."},
                    {q:"Approximately what percentage of blood entering the right atrium from the inferior vena cava shunts through the foramen ovale?",o:["75%","25%","50%","90%"],c:0,r:"Most of the blood entering the right atrium from the inferior vena cava, specifically 75%, shunts through the foramen ovale into the left atrium."},
                    {q:"The vascular structures formed early in gestation primarily support the metabolic needs of the fetus just before birth.",o:["True","False"],c:1,r:"Early vascular structures provide an initial platform for gas exchange and nutrient delivery, whereas specialized circulatory structures form later in gestation to support metabolic needs before birth."},
                    {q:"Which fetal vessel connects the umbilical vein directly with the inferior vena cava?",o:["The ductus venosus","The ductus arteriosus","The portal sinus","The hepatic vein"],c:0,r:"The ductus venosus is the temporary structure that connects the umbilical vein with the inferior vena cava."},
                    {q:"Approximately how many seconds does the entire process of fetal blood circulation take to complete 1 full cycle?",o:["30 seconds","15 seconds","45 seconds","60 seconds"],c:0,r:"The entire fetal circulation process takes about 30 seconds to complete a cycle."},
                    {q:"Following birth, the collapsed ductus venosus becomes the ligamentum venosum and later forms a structural support for which vessel?",o:["The portal vein","The hepatic vein","The umbilical vein","The pulmonary vein"],c:0,r:"After the umbilical vein collapses at birth, the ductus venosus collapses to become the ligamentum venosum and later forms a support for the portal vein."},
                    {q:"The hypogastric arteries branch directly off from which specific blood vessels in the fetus?",o:["The internal iliac arteries","The external iliac arteries","The superior vesical arteries","The descending aortic arteries"],c:0,r:"The hypogastric arteries branch off from the internal iliac arteries and become the umbilical arteries when they enter the umbilical cord."},
                    {q:"Before joining the ductus venosus, a portion of the blood in the umbilical vein branches to supply the liver through which structure?",o:["The portal sinus","The hepatic vein","The foramen ovale","The vena cava"],c:0,r:"Just before the umbilical vein joins the ductus venosus, part of it branches to supply the liver through the portal sinus."},
                    {q:"The deoxygenated blood from the head, neck, and arms returns to the right atrium through the inferior vena cava.",o:["True","False"],c:1,r:"Deoxygenated blood from the head, neck, and arms returns through the superior vena cava to the right atrium, not the inferior vena cava."},
                    {q:"Where does the ductus arteriosus enter the descending arch of the aorta to bypass the pulmonary circulation?",o:["Just after the subclavian and carotid arteries","Just before the coronary and carotid arteries","Just after the internal iliac and vesical arteries","Just before the pulmonary and hepatic arteries"],c:0,r:"The ductus arteriosus carries deoxygenated blood from the pulmonary artery to the descending arch of the aorta, entering it just after the subclavian and carotid arteries branch off."},
                    {q:"After birth, the abdominal portion of the umbilical vein gradually atrophies and becomes obliterated to form which structure?",o:["The ligamentum teres","The ligamentum venosum","The ligamentum arteriosum","The hypogastric ligament"],c:0,r:"The abdominal portion of the umbilical vein atrophies and becomes obliterated to form the ligamentum teres, which runs between the umbilicus and the liver."},
                    {q:"Which heart chamber receives the blood that has the highest oxygen content for distribution to the brain and heart?",o:["The left ventricle","The right ventricle","The right atrium","The pulmonary trunk"],c:0,r:"Blood shunted through the foramen ovale enters the left atrium and passes into the left ventricle, where it enters the aorta with the highest oxygen content to supply the brain and heart."},
                    {q:"At birth, what exact pressure changes occur between the 2 atria to cause the closure of the foramen ovale?",o:["Right atrial pressure decreases and left increases","Right atrial pressure increases and left decreases","Both right and left atrial pressures increase","Both right and left atrial pressures decrease"],c:0,r:"Collapse of the umbilical vein reduces pressure in the right atrium, while established respiration and pulmonary circulation increase pressure in the left atrium, closing the foramen ovale."},
                    {q:"Interchange between fetal and maternal blood in the placenta for oxygenation takes place through the processes of osmosis and diffusion.",o:["True","False"],c:0,r:"Umbilical arteries transport deoxygenated blood back to the placenta where interchange between fetal and maternal blood takes place through osmosis and diffusion."},
                    {q:"When the hypogastric arteries atrophy after birth, a few centimeters remain patent to become the internal iliac and which other arteries?",o:["The superior vesical arteries","The inferior vesical arteries","The external iliac arteries","The middle sacral arteries"],c:0,r:"The hypogastric arteries atrophy to become obliterated hypogastric ligaments except for a few centimeters that remain patent and become the internal iliac and superior vesical arteries."},
                    {q:"In fetal circulation, what happens to the blood that passes from the right ventricle into the pulmonary artery?",o:["A small amount nourishes the lungs and most enters the aorta","All of the blood bypasses the lungs and enters the left atrium","Most of the blood goes to the lungs and a small amount to the aorta","The blood flows backward into the inferior vena cava"],c:0,r:"From the right ventricle, blood passes into the pulmonary artery; a small amount goes to supply and nourish the lungs while the rest flows through the ductus arteriosus into the aorta."},
                    {q:"Which vessel carries pure oxygenated blood from the placenta through the abdominal wall to the undersurface of the liver?",o:["The umbilical vein","The umbilical artery","The ductus venosus","The hepatic vein"],c:0,r:"From the placenta, the umbilical vein carrying pure oxygenated blood passes through the abdominal wall to the undersurface of the liver."},
                    {q:"As the ductus venosus carries blood to the inferior vena cava, it mixes with impure blood returning from which region?",o:["The lower part of the body","The head and the neck","The upper limbs and arms","The pulmonary venous system"],c:0,r:"The ductus venosus carries blood to the inferior vena cava where it mixes with the impure blood returning from the lower part of the body."},
                    {q:"After birth, the ligamentum teres runs anatomically between the umbilicus and the right atrium of the heart.",o:["True","False"],c:1,r:"The ligamentum teres is formed from the obliterated abdominal portion of the umbilical vein and runs between the umbilicus and the liver."},
                    {q:"Along with the blood from the ductus venosus and lower body, which other vessel empties its content directly into the inferior vena cava?",o:["The hepatic vein","The portal vein","The pulmonary vein","The umbilical vein"],c:0,r:"Before the blood enters the right atrium, the hepatic vein also empties its content into the inferior vena cava."},
                    {q:"In the right atrium, the deoxygenated blood returning via the superior vena cava joins a small stream from the inferior vena cava to flow into where?",o:["The right ventricle","The left atrium","The left ventricle","The ascending aorta"],c:0,r:"Deoxygenated blood from the superior vena cava enters the right atrium, joins the small remaining stream from the inferior vena cava, and flows into the right ventricle."},
                    {q:"What do the hypogastric arteries become as soon as they enter the umbilical cord to return blood to the placenta?",o:["The umbilical arteries","The internal iliac arteries","The superior vesical arteries","The placental venules"],c:0,r:"The hypogastric arteries branch off from the internal iliac arteries and become the umbilical arteries when they enter the umbilical cord."},
                    {q:"At birth, when the infant cries and the lungs expand, blood returns from the lungs to the left atrium via which vessel?",o:["The pulmonary vein","The pulmonary artery","The superior vena cava","The ductus arteriosus"],c:0,r:"Once pulmonary circulation is established at birth, blood returns from the expanding lungs via the pulmonary vein to the left atrium."},
                    {q:"What is the primary function of the vascular structures that are formed early in gestation?",o:["Gas exchange and nutrient delivery","Systemic metabolic regulation","Bypassing the hepatic circulation","Preparing the lungs for respiration"],c:0,r:"Vascular structures formed early in gestation provide an initial platform for gas exchange and nutrient delivery."},
                    {q:"The ductus venosus branches just before it reaches the inferior vena cava in order to supply the liver.",o:["True","False"],c:0,r:"As stated in the description of temporary structures, the ductus venosus connects the umbilical vein with the inferior vena cava and branches just before reaching the vena cava to supply the liver."}
                ]
            },
            q8: {
                title: "Oxytocin",
                data: [
                    {q:"During oxytocin administration, at what cervical dilatation measurement should the infusion be stopped once desired contractions are reached?",o:["2 to 3 cm","3 to 4 cm","5 to 6 cm","8 to 9 cm"],c:2,r:"Once the desired contraction and cervical dilatation of 5 to 6 cm are reached, the oxytocin infusion should be stopped."},
                    {q:"Which of the following is classified as a relative contraindication for oxytocin administration?",o:["Grand multipara","Placenta previa","Fetal distress","Active vaginal herpes"],c:0,r:"Grand multipara and over-distention of the uterus are relative contraindications because they increase the risk of uterine rupture, whereas placenta previa, fetal distress, and active vaginal herpes are absolute contraindications."},
                    {q:"How fast does the action of Syntocinon begin after administration?",o:["Within 1.5 minutes","Within 2.5 minutes","Within 5.5 minutes","Within 7.5 minutes"],c:1,r:"Syntocinon is a short-acting synthetic oxytocin that starts working within 2.5 minutes."},
                    {q:"Natural oxytocin is produced by the posterior pituitary gland and stored in the hypothalamus.",o:["True","False"],c:1,r:"Oxytocin is produced by the hypothalamus and stored and secreted by the posterior pituitary gland."},
                    {q:"Which of the following side effects of oxytocin is categorized under miscellaneous reactions?",o:["Premature contraction","Water intoxication","Absence of fibrinogen","Abnormal heart rate"],c:2,r:"Severe allergic reaction, absence of fibrinogen, and a clot in the pelvic region are categorized as miscellaneous side effects of oxytocin."},
                    {q:"When should the nurse monitor the fetal heart rate before starting oxytocin administration to establish a baseline database?",o:["During uterine contractions","Between uterine contractions","Immediately after contractions","Only during fetal movement"],c:1,r:"Before administration, the nurse must monitor the fetal heart rate in between contractions to establish a baseline database."},
                    {q:"What is the standard intravenous dosage and preparation for Syntocinon?",o:["1 to 4 units in 250 ml solution","5 to 10 units in 500 ml solution","10 to 15 units in 500 ml solution","15 to 20 units in 1000 ml solution"],c:1,r:"The dosage and route for Syntocinon is 5 to 10 units added to 500 ml of intravenous electrolyte solution."},
                    {q:"According to the mechanism of action diagram, what does oxytocin stimulate the placenta to produce?",o:["Estrogen","Progesterone","Prostaglandins","Relaxin"],c:2,r:"Oxytocin from the fetus and pituitary stimulates the uterus to contract and stimulates the placenta to make prostaglandins, which stimulate more contractions."},
                    {q:"Methergin can be safely administered during the 1st, 2nd, and 3rd stages of labor.",o:["True","False"],c:1,r:"Syntocinon can be given in the 1st, 2nd, and 3rd stages of labor, whereas Methergin is only given in the 3rd stage and postpartum to control bleeding."},
                    {q:"Which medical indication requires oxytocin to induce or stimulate labor?",o:["Invasive cervical carcinoma","Classic uterine incision","Maternal diabetes","Fetal malpresentation"],c:2,r:"Medical indications to induce or stimulate labor with oxytocin include Rh problems, maternal diabetes, preeclampsia, and premature rupture of membranes."},
                    {q:"If uterine hyperstimulation occurs during oxytocin administration, what oxygen flow rate should be given via face mask?",o:["2 to 4 liters per minute","4 to 6 liters per minute","6 to 8 liters per minute","8 to 10 liters per minute"],c:2,r:"If hyperstimulation occurs, the nurse must turn off the oxytocin, speed up the primary infusion, position the patient on the left side, and give oxygen at 6 to 8 liters per minute by face mask."},
                    {q:"Which of the following side effects is specifically associated with Methergin rather than Syntocinon?",o:["Chest pain and dyspnea","Rupture of the uterus","Hypertonic uterus","Fetal distress"],c:0,r:"Side effects of Methergin include abdominal cramps, chest pain, palpitation, and dyspnea, whereas uterine rupture, hypertonic uterus, and fetal distress are complications of Syntocinon."},
                    {q:"Why does a nurse start the primary intravenous line with an electrolyte solution during oxytocin administration?",o:["To prevent hypertensive episodes","To minimize water intoxication","To prevent premature contractions","To minimize allergic reactions"],c:1,r:"Starting a primary line infusion of an electrolyte solution is done specifically to minimize the risk for water intoxication."},
                    {q:"Oxytocin acts primarily upon uterine muscle and breast tissue.",o:["True","False"],c:0,r:"Oxytocin is a hormone produced by the hypothalamus and secreted from the posterior pituitary gland that acts upon uterine muscle and breast tissue."},

        let currentQuizData = [];
        let score = 0;
        let answeredCount = 0;

        function openQuiz(quizId) {
            const quiz = quizDataBank[quizId];
            document.getElementById('quiz-title').innerText = quiz.title;
            
            // Generate active questions with shuffles
            currentQuizData = quiz.data.map(q => {
                const opts = q.o.map((text, i) => ({ text, isCorrect: i === q.c }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
            });

            score = 0;
            answeredCount = 0;
            document.getElementById('result-summary').classList.add('hidden-content');
            renderQuiz();

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden-content');
            window.scrollTo(0, 0);
        }

        function closeQuiz() {
            document.getElementById('quiz-view').classList.add('hidden-content');
            document.getElementById('main-menu').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${currentQuizData.length}`;
            const container = document.getElementById('quiz-container');
            
            container.innerHTML = currentQuizData.map((q, index) => {
                return `
                <div class="card bg-purple-50 rounded-xl p-6 mb-6 border border-purple-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4 border-b border-purple-100 pb-3">
                        <span class="bg-purple-700 text-white text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-fuchsia-600 text-white text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-purple-950 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.q}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-purple-200 hover:bg-purple-100 hover:border-purple-400 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-purple-900 group-hover:text-purple-950 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 rounded-xl p-5 border animate-fade-in text-left">
                        <p class="text-sm leading-relaxed"><strong>Rationale:</strong> ${q.r}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = currentQuizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });

            if (optIndex === q.correct) {
                score++;
                feedback.classList.add('correct-answer');
            } else {
                feedback.classList.add('wrong-answer');
            }
            
            answeredCount++;
            
            if (answeredCount === currentQuizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/currentQuizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
    </script>
