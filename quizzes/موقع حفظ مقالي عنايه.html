<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>حفظ الأسئلة</title>
<style>
:root{--bg:#f4f1ff;--bg2:#e9f6ff;--card:rgba(255,255,255,.86);--solid:#fff;--ink:#1d1b3a;--mut:#6b6990;--line:rgba(80,70,160,.14);--pri:#7c5cff;--pri2:#ff6fb1;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--sh:0 10px 30px -12px rgba(76,60,170,.28);--r:22px;--fs:17px}
html[data-t=dark]{--bg:#14122b;--bg2:#0e1f33;--card:rgba(36,33,72,.82);--solid:#25224a;--ink:#f1efff;--mut:#a9a5d6;--line:rgba(180,170,255,.16);--sh:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;min-height:100vh;font-size:var(--fs);line-height:1.6;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
body:before{width:340px;height:340px;background:#ffb3d9;top:-90px;left:-80px}
body:after{width:380px;height:380px;background:#a8d8ff;bottom:-120px;right:-100px}
html[data-t=dark] body:before,html[data-t=dark] body:after{opacity:.22}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.app{max-width:1100px;margin:0 auto;padding:14px 14px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;box-shadow:var(--sh)}
.logo svg{width:26px;height:26px}
.top h1{margin:0;font-size:1.25em;line-height:1.15}
.top small{color:var(--mut);font-size:.68em;direction:ltr;display:block;text-align:right;white-space:nowrap}
.sp{flex:1}
.ibtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;border:1px solid var(--line)}
.lv{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:700;font-size:.8em;box-shadow:var(--sh)}
.lv b{color:var(--warn)}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g3.keep{grid-template-columns:repeat(3,1fr)}}
.hero{background:linear-gradient(135deg,#7c5cff,#c05cff 55%,#ff6fb1);color:#fff;border:0;position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);left:-60px;top:-70px}
.hero h2{margin:0 0 4px;font-size:1.35em}
.hero p{margin:0 0 12px;opacity:.92;font-size:.9em}
.hero .txt{flex:1;min-width:210px;position:relative;z-index:1}
.ringw{position:relative;width:132px;height:132px;flex:none;z-index:1}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ringw .c b{font-size:1.9em}.ringw .c span{font-size:.7em;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;background:var(--pri);color:#fff;box-shadow:0 8px 18px -8px var(--pri);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.w{background:#fff;color:#6a45f0;box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.btn.g{background:var(--solid);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 8px 18px -8px var(--ok)}
.btn.bad{background:var(--bad);box-shadow:0 8px 18px -8px var(--bad)}
.btn.wr{background:var(--warn);box-shadow:0 8px 18px -8px var(--warn)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{text-align:center;padding:12px 6px}
.stat b{display:block;font-size:1.5em;line-height:1.2}
.stat span{font-size:.75em;color:var(--mut)}
.stat .i{width:1.6em;height:1.6em}
.sec{margin:20px 4px 10px;font-weight:800;font-size:1.05em;display:flex;align-items:center;gap:8px}
.lec{position:relative;overflow:hidden;--h:260;display:flex;flex-direction:column;gap:10px}
.lec:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 40) 90% 66%))}
.lec .hd{display:flex;gap:12px;align-items:center}
.lic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 80% 58%),hsl(calc(var(--h) + 40) 85% 64%));box-shadow:0 8px 16px -8px hsl(var(--h) 80% 50%);flex:none}
.lic svg{width:28px;height:28px}
.lec h3{margin:0;font-size:.95em;direction:ltr;text-align:left;line-height:1.3;flex:1}
.lec .meta{font-size:.78em;color:var(--mut)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,hsl(var(--h,260) 85% 60%),hsl(calc(var(--h,260) + 40) 90% 65%));transition:width .5s}
.mini{padding:8px 12px;font-size:.82em;border-radius:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:30px;background:var(--solid);border:1px solid var(--line);font-size:.8em;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
.chip.lc.on{background:linear-gradient(135deg,hsl(var(--h) 80% 58%),hsl(calc(var(--h) + 40) 85% 64%))}
.search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;color:inherit;padding:10px 0;direction:ltr;text-align:left;min-width:0}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tabs .in{pointer-events:auto;display:flex;gap:2px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 12px 34px -10px rgba(60,40,160,.4);width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:16px;font-size:.68em;font-weight:700;color:var(--mut);transition:.2s}
.tab svg{width:22px;height:22px}
.tab.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 16px -8px var(--pri)}
.qcard{--h:260;position:relative;overflow:hidden;padding:0}
.qhead{padding:18px 18px 14px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 45) 80% 62%));position:relative}
.qhead:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14);left:-40px;bottom:-80px}
.qtag{font-size:.72em;opacity:.92;display:flex;align-items:center;gap:6px;direction:ltr;justify-content:flex-start;margin-bottom:6px;position:relative;z-index:1}
.qtag .badge{background:rgba(255,255,255,.25);padding:1px 9px;border-radius:20px;font-weight:700}
.qtxt{font-size:1.18em;font-weight:800;direction:ltr;text-align:left;line-height:1.4;position:relative;z-index:1}
.qact{display:flex;gap:6px;z-index:2}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;position:relative;z-index:2;direction:ltr}.qtop .qtag{margin:0}.qact button{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center}
.qact button.on{background:#fff;color:hsl(var(--h) 75% 50%)}
.qbody{padding:14px 16px 8px;direction:ltr;text-align:left}
.pt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:hsl(var(--h) 90% 97%);border:1px solid hsl(var(--h) 60% 90%);animation:pop .3s both}
html[data-t=dark] .pt{background:hsl(var(--h) 25% 22%);border-color:hsl(var(--h) 25% 30%)}
.pn{width:26px;height:26px;border-radius:9px;background:hsl(var(--h) 75% 58%);color:#fff;font-size:.75em;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.pt .tx{flex:1;min-width:0;word-wrap:break-word;overflow-wrap:anywhere}
.pt.hid{cursor:pointer;color:var(--mut)}
.pt.hid .tx{display:flex;align-items:center;gap:8px;font-size:.88em}
.pt.hid .ph{height:12px;border-radius:8px;flex:1;background:repeating-linear-gradient(90deg,hsl(var(--h) 50% 80%) 0 14px,transparent 14px 20px);opacity:.7}
.sub{font-weight:800;font-size:.85em;color:hsl(var(--h) 70% 42%);margin:12px 2px 6px;display:flex;align-items:center;gap:8px}
html[data-t=dark] .sub{color:hsl(var(--h) 80% 75%)}
.sub:after{content:"";flex:1;height:2px;background:hsl(var(--h) 60% 85%);border-radius:2px}
.bl{display:inline-block;min-width:2.2em;padding:0 4px;border-radius:7px;background:hsl(var(--h) 70% 85%);color:transparent;cursor:pointer;text-align:center;user-select:none;font-size:.9em}
.bl:before{content:"___";color:hsl(var(--h) 60% 45%)}
.bl.sh{background:hsl(var(--h) 80% 90%);color:inherit}.bl.sh:before{content:""}
html[data-t=dark] .bl{background:hsl(var(--h) 35% 35%)}
.ul{display:inline-block;border-bottom:2px solid hsl(var(--h) 55% 62%);margin:0 2px 0 1px;height:.8em;vertical-align:baseline;opacity:.8}
.fb{display:flex;gap:8px;padding:10px 14px 16px;flex-wrap:wrap}
.fb .btn{flex:1;min-width:120px}
.modes{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode{padding:8px 14px;border-radius:14px;font-size:.8em;font-weight:700;background:var(--solid);border:1px solid var(--line);white-space:nowrap;display:flex;gap:6px;align-items:center}
.mode.on{background:var(--ink);color:var(--bg);border-color:transparent}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.nav .ibtn{width:52px;height:52px;border-radius:18px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1;padding:0 6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.m{background:var(--ok)}.dot.s{box-shadow:0 0 0 2px var(--warn)}.dot.c{transform:scale(1.7);background:var(--pri)}
.note{width:100%;min-height:70px;border-radius:14px;border:1px dashed var(--line);background:var(--solid);color:inherit;font:inherit;padding:10px;resize:vertical;margin:0 0 10px;direction:auto;font-size:.88em}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(0);border:5px solid var(--ok);color:var(--ok);font-weight:900;font-size:2em;padding:2px 22px;border-radius:16px;pointer-events:none;opacity:0;z-index:5;background:rgba(255,255,255,.7)}
.stamp.go{animation:stamp .9s ease both}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.5);opacity:0}30%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
.ql{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;--h:260;direction:ltr;text-align:left}
.ql .n{width:38px;height:38px;border-radius:12px;color:#fff;font-weight:800;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 45) 80% 62%));flex:none;font-size:.8em}
.ql .t{flex:1;font-size:.9em;line-height:1.4}
.ql .st{display:flex;gap:6px;color:var(--mut)}
.ql .st .m{color:var(--ok)}.ql .st .s{color:var(--warn)}
.ordit{display:block;width:100%;text-align:left;direction:ltr;padding:12px;border-radius:14px;background:var(--solid);border:2px solid var(--line);margin-bottom:8px;font-size:.9em}
.ordit.used{opacity:.3;pointer-events:none}
.slot{min-height:48px;border-radius:14px;border:2px dashed var(--line);padding:10px 12px;margin-bottom:8px;direction:ltr;text-align:left;font-size:.88em;display:flex;gap:8px}
.slot.f{border-style:solid;border-color:var(--ok);background:rgba(16,185,129,.1)}
.big{font-size:2.4em;font-weight:900}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,10,50,.5);display:grid;place-items:end center;backdrop-filter:blur(4px)}
.sheet{background:var(--solid);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .3s both}
@media(min-width:700px){.modal{place-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 10px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.7em;padding:12px 6px;opacity:.38;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none}
.bdg .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f59e0b,#ff6fb1)}
.bdg .ic svg{width:24px;height:24px}
.timer{font-variant-numeric:tabular-nums;font-size:2.2em;font-weight:900;letter-spacing:1px;direction:ltr}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:700;font-size:.85em;box-shadow:var(--sh);animation:pop .3s both;max-width:90vw;text-align:center}
#cf{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.pbar{position:sticky;top:0;z-index:10;height:5px;background:transparent}
.hint{font-size:.75em;color:var(--mut)}
textarea.imp{width:100%;height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:inherit;direction:ltr;font-size:.7em;padding:8px}
.kb{font-size:.7em;color:var(--mut);text-align:center;margin-top:6px}
@media(max-width:480px){.app{padding:10px 10px 110px}.hero h2{font-size:1.15em}.ringw{width:112px;height:112px}}
</style>
</head>

<div class="app" id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<canvas id="cf"></canvas>
<div id="modal"></div>
<script>
var D={"titles": ["Cardiac Surgery", "Ventilator-Associated Events (VAP & VAE)", "Acid-Base Disorders", "Stress Ulcer in ICU Patients", "Glycemic Control in Critically Ill Patients"], "qs": [{"id": "1-1", "l": 0, "n": 1, "q": "List the 5 main types of Cardiac Surgery.", "a": [{"t": "Coronary artery bypass grafting (CABG): Creates a new route using a healthy blood vessel from another part of the body to detour around blocked coronary arteries.", "h": false}, {"t": "Heart valve surgery: Repairs or replaces a faulty heart valve (such as the aortic or mitral valve) using mechanical or biological tissue valves.", "h": false}, {"t": "Aortic aneurysm surgery: Replaces a damaged, bulging section of the aorta with a fabric graft to restore safe blood flow.", "h": false}, {"t": "Heart transplant surgery: Replaces a failing heart with a healthy donor heart for patients with end-stage heart failure.", "h": false}, {"t": "Left Ventricular Assist Device (LVAD) placement: Implants a battery-powered mechanical pump to help the left ventricle circulate blood to the aorta when the heart fails.", "h": false}]}, {"id": "1-2", "l": 0, "n": 2, "q": "List the indications for CABG.", "a": [{"t": "Chronic and pre-infarction angina.", "h": false}, {"t": "Angina or ischemia unresponsive to medical therapy.", "h": false}, {"t": "Triple vessel disease.", "h": false}, {"t": "Myocardial Infarction (MI) within 6 hours of the onset of symptoms (emergency CABG).", "h": false}, {"t": "MI when thrombolytic therapy, Percutaneous Transluminal Coronary Angioplasty (PTCA), or both have been unsuccessful.", "h": false}]}, {"id": "1-3", "l": 0, "n": 3, "q": "List the causes of Heart Valve Diseases.", "a": [{"t": "Rheumatic fever.", "h": false}, {"t": "Other infections that destroy the valve components.", "h": false}, {"t": "Congenital defects.", "h": false}, {"t": "Degenerative changes (such as calcium deposits or torn leaflets with advanced age).", "h": false}]}, {"id": "1-4", "l": 0, "n": 4, "q": "List the main types of Heart Valve Diseases.", "a": [{"t": "Stenosis: Narrow or stiff valve opening that resists opening, leading to increased pressure within the heart (e.g., mitral stenosis causes high left atrial pressure, pulmonary congestion, and decreased left ventricular output).", "h": false}, {"t": "Regurgitation: Valves do not close properly, allowing blood leakage during the cardiac cycle, resulting in fluid overload and dilatation of the left atrium.", "h": false}, {"t": "Prolapse: Valve flaps stretch or bulge backward into the heart chamber.", "h": false}, {"t": "Atresia: The valve is not formed properly and lacks an opening entirely.", "h": false}]}, {"id": "1-5", "l": 0, "n": 5, "q": "List the nursing interventions to prevent/manage Post-Cardiotomy Psychosis (Sensory Overload).", "a": [{"t": "Monitor the patient for signs of denial preoperatively.", "h": false}, {"t": "Provide opportunities for the patient to express emotions before surgery.", "h": false}, {"t": "Explain all procedures carefully to keep the patient oriented postoperatively.", "h": false}, {"t": "Provide continuity of care with familiar nursing staff and a consistent approach.", "h": false}]}, {"id": "1-6", "l": 0, "n": 6, "q": "List the factors related to Decreased Cardiac Output (CO) post-cardiac surgery.", "a": [{"t": "Hypothermia.", "h": false}, {"t": "Anesthesia.", "h": false}, {"t": "Myocardial edema.", "h": false}, {"t": "Electrolyte imbalances.", "h": false}]}, {"id": "1-7", "l": 0, "n": 7, "q": "List the contraindications for CABG.", "a": [{"t": "Acute cerebrovascular accident (CVA).", "h": false}, {"t": "Bleeding disorders.", "h": false}]}, {"id": "1-8", "l": 0, "n": 8, "q": "List the preoperative diagnostic studies for cardiac surgery.", "a": [{"t": "CBC, electrolytes, BUN, creatinine, PT, PTT, bleeding time, and ABG.", "h": false}, {"t": "Chest X-ray and ECG.", "h": false}, {"t": "Urinalysis and dental consultation.", "h": false}, {"t": "Pulmonary function tests.", "h": false}, {"t": "Echocardiogram, cardiac catheterization, and MRI.", "h": false}, {"t": "Carotid screening, type and cross match, and hepatitis B and HIV serology.", "h": false}]}, {"id": "1-9", "l": 0, "n": 9, "q": "List the lines, tubes, and equipment attached to the patient after cardiac surgery.", "a": [{"t": "Endotracheal tube (ETT) connected to a ventilator.", "h": false}, {"t": "Mediastinal, pericardial, and pleural drains.", "h": false}, {"t": "Pulse oximetry.", "h": false}, {"t": "Central, arterial, and peripheral lines.", "h": false}, {"t": "Epicardial pacing wires.", "h": false}, {"t": "Nasogastric tube, urinary catheter, and temperature probe.", "h": false}]}, {"id": "1-10", "l": 0, "n": 10, "q": "List the signs of Decreased Cardiac Output (CO) after cardiac surgery.", "a": [{"t": "Urine output below 30 mL/hour.", "h": false}, {"t": "High urine specific gravity.", "h": false}, {"t": "Cool, moist, cyanotic skin and delayed capillary refill.", "h": false}, {"t": "Tachycardia, bradycardia, or dysrhythmias.", "h": false}, {"t": "Changes in mental status and orientation.", "h": false}]}, {"id": "1-11", "l": 0, "n": 11, "q": "List the risks after cardiopulmonary bypass.", "a": [{"t": "Fluid volume deficit (blood loss, mannitol diuresis, inadequate replacement).", "h": false}, {"t": "Bleeding (surgical, heparin reversal, abnormal clotting factors).", "h": false}, {"t": "Ineffective airway clearance or impaired gas exchange.", "h": false}, {"t": "Decreased cardiac output (hypothermia, anesthesia, myocardial edema, electrolyte imbalance).", "h": false}]}, {"id": "1-12", "l": 0, "n": 12, "q": "List the points of postoperative patient teaching after cardiac surgery.", "a": [{"t": "Activities of daily living, incision care, and exercise.", "h": false}, {"t": "Driving, lifting, rest, diet, and sexual activity.", "h": false}, {"t": "Prevention of infection and medication regimen.", "h": false}, {"t": "When to call the doctor, follow-up care, and emotional status.", "h": false}]}, {"id": "2-1", "l": 1, "n": 1, "q": "List the sources of bacterial colonization of the lungs in VAP.", "a": [{"t": "Oropharynx.", "h": false}, {"t": "Sinus cavities.", "h": false}, {"t": "Nares.", "h": false}, {"t": "Dental plaque.", "h": false}, {"t": "Gastrointestinal tract.", "h": false}, {"t": "Patient-to-patient contact.", "h": false}, {"t": "Ventilator circuit.", "h": false}]}, {"id": "2-2", "l": 1, "n": 2, "q": "List the factors that cause biofilm dislodgement from the endotracheal tube (ETT).", "a": [{"t": "Saline instillation into the endotracheal tube.", "h": false}, {"t": "Endotracheal suctioning.", "h": false}, {"t": "Coughing.", "h": false}, {"t": "Repositioning of the endotracheal tube.", "h": false}]}, {"id": "2-3", "l": 1, "n": 3, "q": "List the non-infectious conditions that may cause pulmonary infiltrates on chest X-ray in mechanically ventilated patients.", "a": [{"t": "Atelectasis.", "h": false}, {"t": "Aspiration.", "h": false}, {"t": "Pulmonary embolism.", "h": false}, {"t": "Pulmonary edema.", "h": false}, {"t": "Alveolar hemorrhage.", "h": false}, {"t": "Pulmonary infarction.", "h": false}, {"t": "Acute respiratory distress syndrome (ARDS).", "h": false}]}, {"id": "2-4", "l": 1, "n": 4, "q": "List the host-related risk factors of Ventilator-Associated Pneumonia (VAP).", "a": [{"t": "Older age.", "h": false}, {"t": "Underlying medical conditions.", "h": false}, {"t": "Immunosuppression.", "h": false}, {"t": "COPD.", "h": false}, {"t": "ARDS.", "h": false}, {"t": "Supine body position.", "h": false}, {"t": "Decreased level of consciousness.", "h": false}, {"t": "Multiple intubations.", "h": false}, {"t": "Use of certain medications.", "h": false}]}, {"id": "2-5", "l": 1, "n": 5, "q": "List the device-related and personnel-related risk factors of Ventilator-Associated Pneumonia (VAP).", "a": [{"t": "Device-related factors:", "h": true}, {"t": "Endotracheal tube.", "h": false}, {"t": "Ventilator circuits.", "h": false}, {"t": "Nasogastric tubes.", "h": false}, {"t": "Orogastric tubes.", "h": false}, {"t": "Personnel-related factors:", "h": true}, {"t": "Improper handwashing.", "h": false}, {"t": "Failure to change gloves between patient contacts.", "h": false}, {"t": "Failure to use appropriate PPE when antibiotic-resistant organisms are identified.", "h": false}]}, {"id": "2-6", "l": 1, "n": 6, "q": "List the eight elements of the VAP bundle.", "a": [{"t": "Subglottic Suction: Use subglottic suction ETT or tracheostomy tubes for patients expected to need ventilation > 72 hours.", "h": false}, {"t": "Orotracheal Intubation and Cuff Pressure: Use orotracheal tubes and maintain cuff pressure between 20–30 cmH2O (optimal 25 cmH2O).", "h": false}, {"t": "Cuff Pressure Monitoring: Measure every 4–6 hours and after significant patient movement.", "h": false}, {"t": "Sedation Management: Perform daily sedation holds or target RASS score.", "h": false}, {"t": "Patient Positioning: Nurse patients in a semi-recumbent position.", "h": false}, {"t": "Ventilator Tubing and Suction Systems: Change only when visibly soiled or indicated.", "h": false}, {"t": "Stress Ulcer Prophylaxis (SUP): Use judiciously only for high-risk GI bleeding patients.", "h": false}, {"t": "Oral Hygiene: Maintain regular oral care according to patient risk.", "h": false}]}, {"id": "2-7", "l": 1, "n": 7, "q": "List the reasons for the shift from VAP surveillance to VAE surveillance.", "a": [{"t": "Traditional VAP diagnosis is subjective with no single gold standard.", "h": false}, {"t": "VAP focuses mainly on pneumonia and misses other mechanical ventilation complications.", "h": false}, {"t": "VAP may be overdiagnosed.", "h": false}, {"t": "VAE is more closely related to poor patient outcomes.", "h": false}, {"t": "VAE is objective and can be detected electronically, reducing time and effort.", "h": false}]}, {"id": "2-8", "l": 1, "n": 8, "q": "List the non-infectious causes of Ventilator-Associated Events (VAEs).", "a": [{"t": "Fluid overload (pulmonary edema).", "h": false}, {"t": "Acute Respiratory Distress Syndrome (ARDS).", "h": false}, {"t": "Atelectasis.", "h": false}, {"t": "Ventilator-Induced Lung Injury (VILI).", "h": false}, {"t": "Mucous plugging.", "h": false}, {"t": "Pulmonary embolism.", "h": false}]}, {"id": "2-9", "l": 1, "n": 9, "q": "List the components of the ABCDEF Bundle in critical care.", "a": [{"t": "A: Assess, Prevent, and Manage Pain (using NRS or CCOT).", "h": false}, {"t": "B: Both Spontaneous Awakening and Breathing Trials (daily SATs and SBTs).", "h": false}, {"t": "C: Choice of Analgesia and Sedation (avoid excessive sedation, use RASS).", "h": false}, {"t": "D: Delirium: Assess, Prevent, and Manage (using CAM-ICU or ICDSC).", "h": false}, {"t": "E: Early Mobility and Exercise.", "h": false}, {"t": "F: Family Engagement and Empowerment.", "h": false}]}, {"id": "2-10", "l": 1, "n": 10, "q": "List the common organisms that cause Ventilator-Associated Pneumonia (VAP).", "a": [{"t": "Pseudomonas aeruginosa.", "h": false}, {"t": "MRSA.", "h": false}, {"t": "Acinetobacter species.", "h": false}, {"t": "Enterobacter species.", "h": false}]}, {"id": "2-11", "l": 1, "n": 11, "q": "List the three tiers of Ventilator-Associated Events (VAE).", "a": [{"t": "Tier 1: Ventilator-Associated Condition (VAC).", "h": false}, {"t": "Tier 2: Infection-Related Ventilator-Associated Complication (IVAC).", "h": false}, {"t": "Tier 3: Possible or Probable VAP.", "h": false}]}, {"id": "2-12", "l": 1, "n": 12, "q": "List the criteria for Ventilator-Associated Condition (VAC).", "a": [{"t": "Worsening oxygenation after at least 2 days of stability or improvement.", "h": false}, {"t": "Increase in daily minimum FiO2 or PEEP (PEEP rise of 3 cmH2O or more).", "h": false}, {"t": "Increase sustained for 2 calendar days or more.", "h": false}]}, {"id": "2-13", "l": 1, "n": 13, "q": "List the strategies to prevent Ventilator-Associated Events (VAE).", "a": [{"t": "Avoid intubation and reintubation; use high-flow oxygen or NIPPV when safe.", "h": false}, {"t": "Lung-protective ventilation: tidal volume 4 to 8 mL/kg predicted body weight.", "h": false}, {"t": "Daily spontaneous awakening and breathing trials.", "h": false}, {"t": "Oral care with toothbrushing.", "h": false}, {"t": "Closed suction systems and cuff pressure maintenance.", "h": false}, {"t": "Remove condensate with the circuit closed.", "h": false}, {"t": "Early mobility.", "h": false}, {"t": "Early enteral nutrition.", "h": false}]}, {"id": "3-1", "l": 2, "n": 1, "q": "List the three lines of response the body uses to maintain pH homeostasis.", "a": [{"t": "Chemical buffers.", "h": false}, {"t": "Respiratory regulation (lungs act within minutes).", "h": false}, {"t": "Renal regulation (kidneys act over hours or days).", "h": false}]}, {"id": "3-2", "l": 2, "n": 2, "q": "List the factors affecting pH homeostasis.", "a": [{"t": "Length of time of the imbalance.", "h": false}, {"t": "Baseline function of the involved organs.", "h": false}, {"t": "The underlying condition resulting in the imbalance.", "h": false}]}, {"id": "3-3", "l": 2, "n": 3, "q": "List the causes of Respiratory Acidosis (pH < 7.35, PaCO2 > 45 mmHg).", "a": [{"t": "Acute asthma exacerbation.", "h": false}, {"t": "COPD.", "h": false}, {"t": "Acute heart failure causing pulmonary edema.", "h": false}, {"t": "Decreased ventilation from anesthesia, alcohol, opioids, or sedatives.", "h": false}]}, {"id": "3-4", "l": 2, "n": 4, "q": "List the signs and symptoms of Respiratory Acidosis (pH < 7.35, PaCO2 > 45 mmHg).", "a": [{"t": "Anxiety.", "h": false}, {"t": "Mild dyspnea.", "h": false}, {"t": "Daytime sluggishness.", "h": false}, {"t": "Headaches.", "h": false}, {"t": "Hypersomnolence.", "h": false}, {"t": "Delirium.", "h": false}, {"t": "Paranoia.", "h": false}, {"t": "Depression.", "h": false}, {"t": "Confusion.", "h": false}, {"t": "Seizures.", "h": false}, {"t": "Coma.", "h": false}]}, {"id": "3-5", "l": 2, "n": 5, "q": "List the nursing management of Respiratory Acidosis (pH < 7.35, PaCO2 > 45 mmHg).", "a": [{"t": "Assess ABCs and respiratory distress.", "h": false}, {"t": "Obtain ABG.", "h": false}, {"t": "Remove airway restrictions.", "h": false}, {"t": "Correct oversedation.", "h": false}, {"t": "Give nebulizers.", "h": false}, {"t": "Apply BiPAP or CPAP.", "h": false}, {"t": "Prepare for endotracheal intubation and mechanical ventilation.", "h": false}]}, {"id": "3-6", "l": 2, "n": 6, "q": "List the causes of Respiratory Alkalosis (pH > 7.45, PaCO2 < 35 mmHg).", "a": [{"t": "Hyperventilation due to anxiety, panic attacks, pain, fear, or head injuries.", "h": false}, {"t": "Mechanical ventilation.", "h": false}, {"t": "Salicylate overdose.", "h": false}, {"t": "Early acute asthma exacerbation.", "h": false}, {"t": "Pulmonary embolism.", "h": false}]}, {"id": "3-7", "l": 2, "n": 7, "q": "List the signs and symptoms of Respiratory Alkalosis (pH > 7.45, PaCO2 < 35 mmHg).", "a": [{"t": "Shortness of breath.", "h": false}, {"t": "Dizziness.", "h": false}, {"t": "Light-headedness.", "h": false}, {"t": "Chest pain or tightness.", "h": false}, {"t": "Paresthesias.", "h": false}, {"t": "Palpitations.", "h": false}]}, {"id": "3-8", "l": 2, "n": 8, "q": "List the treatment of Respiratory Alkalosis (pH > 7.45, PaCO2 < 35 mmHg).", "a": [{"t": "Treat the underlying cause.", "h": false}, {"t": "Provide patient reassurance and stress management.", "h": false}, {"t": "Breathing retraining (diaphragmatic breathing).", "h": false}, {"t": "Administer a short-acting benzodiazepine (e.g., lorazepam) if severe symptoms persist.", "h": false}]}, {"id": "3-9", "l": 2, "n": 9, "q": "List the causes of Metabolic Acidosis (pH < 7.35, HCO3 < 22 mEq/L).", "a": [{"t": "Accumulation of acids:", "h": true}, {"t": "Diabetic ketoacidosis (DKA).", "h": false}, {"t": "Lactic acidosis.", "h": false}, {"t": "Renal failure (uremia).", "h": false}, {"t": "Salicylate intoxication.", "h": false}, {"t": "Methanol/alcohol intoxication.", "h": false}, {"t": "Starvation.", "h": false}, {"t": "GI bicarbonate loss:", "h": true}, {"t": "Severe diarrhea.", "h": false}, {"t": "Pancreatic or biliary fistula.", "h": false}, {"t": "Ileostomy.", "h": false}, {"t": "Small bowel drains.", "h": false}, {"t": "Ureterosigmoidostomy.", "h": false}]}, {"id": "3-10", "l": 2, "n": 10, "q": "List the signs and symptoms of Metabolic Acidosis (pH < 7.35, HCO3 < 22 mEq/L).", "a": [{"t": "Rapid deep breathing (Kussmaul's breathing).", "h": false}, {"t": "Confusion.", "h": false}, {"t": "Decreased level of consciousness.", "h": false}, {"t": "Hypotension.", "h": false}, {"t": "Hyperkalemia.", "h": false}]}, {"id": "3-11", "l": 2, "n": 11, "q": "List the management of Metabolic Acidosis (pH < 7.35, HCO3 < 22 mEq/L).", "a": [{"t": "Identify and treat underlying cause.", "h": false}, {"t": "Assess ABG.", "h": false}, {"t": "Administer IV fluids.", "h": false}, {"t": "Manage glucose.", "h": false}, {"t": "Provide circulatory support.", "h": false}, {"t": "Administer IV sodium bicarbonate if pH drops below 7.1.", "h": false}]}, {"id": "3-12", "l": 2, "n": 12, "q": "List the systemic complications of Metabolic Acidosis.", "a": [{"t": "Cardiovascular:", "h": true}, {"t": "Decreased cardiac contractility.", "h": false}, {"t": "Decreased fibrillation threshold.", "h": false}, {"t": "Decreased sensitivity to catecholamines.", "h": false}, {"t": "Decreased renal and hepatic blood flow.", "h": false}, {"t": "Respiratory:", "h": true}, {"t": "Increased minute ventilation.", "h": false}, {"t": "Dyspnea.", "h": false}, {"t": "Decreased diaphragmatic contractility.", "h": false}, {"t": "Respiratory muscle fatigue.", "h": false}, {"t": "Neurologic:", "h": true}, {"t": "Obtundation.", "h": false}, {"t": "Increased cerebral blood flow.", "h": false}, {"t": "Decreased sympathetic discharge.", "h": false}, {"t": "Decreased cerebral metabolism.", "h": false}, {"t": "Metabolic:", "h": true}, {"t": "Inhibition of anaerobic metabolism.", "h": false}, {"t": "Hyperkalemia.", "h": false}, {"t": "Hyperphosphatemia.", "h": false}, {"t": "Increased protein metabolism.", "h": false}, {"t": "Increased metabolic rate.", "h": false}]}, {"id": "3-13", "l": 2, "n": 13, "q": "List the causes of Metabolic Alkalosis (pH > 7.45, HCO3 > 26 mEq/L).", "a": [{"t": "GI loss of hydrogen ions (prolonged vomiting, nasogastric suctioning).", "h": false}, {"t": "Excessive urine acid loss (diuretics, mineralocorticoids).", "h": false}, {"t": "IV sodium bicarbonate administration.", "h": false}, {"t": "Shift of hydrogen ions into cells (hypokalemia).", "h": false}, {"t": "Concurrent calcium antacids with Kayexalate.", "h": false}]}, {"id": "3-14", "l": 2, "n": 14, "q": "List the signs and symptoms of Metabolic Alkalosis (pH > 7.45, HCO3 > 26 mEq/L).", "a": [{"t": "Slow shallow respiration.", "h": false}, {"t": "Hypertonic muscles (tetany).", "h": false}, {"t": "Mental dullness.", "h": false}]}, {"id": "3-15", "l": 2, "n": 15, "q": "List the management of Metabolic Alkalosis (pH > 7.45, HCO3 > 26 mEq/L).", "a": [{"t": "Treat underlying cause (stop vomiting, NG suctioning, or diuretics).", "h": false}, {"t": "Treat hypokalemia.", "h": false}, {"t": "Stop bicarbonate administration.", "h": false}, {"t": "Perform dialysis in renal failure patients.", "h": false}]}, {"id": "4-1", "l": 3, "n": 1, "q": "List the risk factors for Stress Ulcer in ICU patients.", "a": [{"t": "Hypotension or shock.", "h": false}, {"t": "Coagulopathy.", "h": false}, {"t": "Respiratory failure requiring mechanical ventilation.", "h": false}, {"t": "Sepsis.", "h": false}, {"t": "Use of vasopressors and cardiac inotropes.", "h": false}, {"t": "Lack of enteral feedings.", "h": false}, {"t": "Prolonged stay in the ICU.", "h": false}, {"t": "Hepatic or renal failure.", "h": false}, {"t": "Multiple or severe trauma.", "h": false}, {"t": "Head or spinal cord injury.", "h": false}, {"t": "Major surgery lasting more than 4 hours.", "h": false}]}, {"id": "4-2", "l": 3, "n": 2, "q": "List the clinical manifestations of Stress Ulcer.", "a": [{"t": "Occult bleeding: Positive Guaiac Fecal Occult Blood Test (gFOBT).", "h": false}, {"t": "Overt bleeding: Hematemesis, coffee-ground emesis, melena, bloody nasogastric aspirate.", "h": false}, {"t": "Clinically important bleeding: Overt bleeding plus spontaneous BP drop, orthostatic pulse increase, or hemoglobin drop.", "h": false}]}, {"id": "4-3", "l": 3, "n": 3, "q": "List the preventive measures for Stress Ulcer in the ICU.", "a": [{"t": "Assess risk factors.", "h": false}, {"t": "Control gastric pH.", "h": false}, {"t": "Initiate early enteral feeding.", "h": false}, {"t": "Hemodynamic management.", "h": false}, {"t": "Oxygen supplementation.", "h": false}]}, {"id": "4-4", "l": 3, "n": 4, "q": "List the factors used to assess a patient's nutritional requirements.", "a": [{"t": "Age.", "h": false}, {"t": "Sex.", "h": false}, {"t": "Clinical condition.", "h": false}, {"t": "Body weight.", "h": false}, {"t": "Nutritional status and nutrient losses.", "h": false}, {"t": "Therapeutic requirements.", "h": false}]}, {"id": "4-5", "l": 3, "n": 5, "q": "List the nursing interventions for managing clinically significant stress ulcer bleeding.", "a": [{"t": "Ensure adequate fluid resuscitation and blood transfusion.", "h": false}, {"t": "Monitor Central Venous Pressure (CVP) and intake/output chart to maintain positive balance.", "h": false}, {"t": "Reverse coagulopathy using platelet or fresh frozen plasma (FFP) transfusions.", "h": false}, {"t": "Perform gastric lavage through a large-bore tube with room-temperature saline to remove clots and reduce gastric distention.", "h": false}, {"t": "Ensure optimal ventilatory support for tissue oxygenation.", "h": false}, {"t": "Apply aseptic techniques and infection control measures.", "h": false}]}, {"id": "4-6", "l": 3, "n": 6, "q": "List the complications of Stress Ulcers.", "a": [{"t": "Gastrointestinal bleeding (most common and life-threatening).", "h": false}, {"t": "Perforation leading to peritonitis.", "h": false}, {"t": "Gastric outlet obstruction.", "h": false}]}, {"id": "4-7", "l": 3, "n": 7, "q": "List the drugs used for pharmacological prophylaxis of Stress Ulcer.", "a": [{"t": "Proton pump inhibitors: Omeprazole, lansoprazole, dexlansoprazole, and pantoprazole.", "h": false}, {"t": "H2 receptor antagonists: Ranitidine and cimetidine.", "h": false}]}, {"id": "4-8", "l": 3, "n": 8, "q": "List the benefits of early enteral feeding in preventing Stress Ulcer.", "a": [{"t": "Prevents bacterial translocation across the gut wall.", "h": false}, {"t": "Optimizes splanchnic blood flow.", "h": false}, {"t": "Enhances mucosal immunity (gut-associated lymphoid tissue).", "h": false}]}, {"id": "5-1", "l": 4, "n": 1, "q": "List the three levels of glycemic control in the ICU and their target blood glucose ranges.", "a": [{"t": "Tight or strict glycemic control (TGC): 80–110 mg/dL (increases hypoglycemia risk by 5 times).", "h": false}, {"t": "Conventional or loose glycemic control: 180–200 mg/dL.", "h": false}, {"t": "Moderate glycemic control (Recommended standard): 140–180 mg/dL (associated with lower mortality and lower hypoglycemia risk).", "h": false}]}, {"id": "5-2", "l": 4, "n": 2, "q": "List the positive health outcomes of good glycemic control in critically ill patients.", "a": [{"t": "Decreased mortality and morbidity in the ICU.", "h": false}, {"t": "Decreased rate of infections.", "h": false}, {"t": "Improved wound healing.", "h": false}, {"t": "Decreased ICU length of stay and fewer mechanical ventilation days.", "h": false}, {"t": "Better functional outcomes and lower mortality after stroke, traumatic brain injury, and myocardial infarction.", "h": false}, {"t": "Better cost savings.", "h": false}]}, {"id": "5-3", "l": 4, "n": 3, "q": "List the risk factors of Hypoglycemia in ICU patients.", "a": [{"t": "Continuous renal replacement therapy with bicarbonate fluid.", "h": false}, {"t": "Discontinuation of nutrition without adjusting insulin.", "h": false}, {"t": "History of diabetes.", "h": false}, {"t": "Sepsis.", "h": false}, {"t": "Vasopressor therapy.", "h": false}, {"t": "Mechanical ventilation.", "h": false}]}, {"id": "5-4", "l": 4, "n": 4, "q": "List the clinical manifestations of Hypoglycemia in ICU patients.", "a": [{"t": "Neuroglycopenic manifestations:", "h": true}, {"t": "Headaches.", "h": false}, {"t": "Fatigue.", "h": false}, {"t": "Confusion.", "h": false}, {"t": "Dysarthria.", "h": false}, {"t": "Impaired judgment.", "h": false}, {"t": "Adrenergic manifestations:", "h": true}, {"t": "Sweating.", "h": false}, {"t": "Tremor.", "h": false}, {"t": "Tachycardia.", "h": false}, {"t": "Agitation.", "h": false}, {"t": "Palpitations.", "h": false}, {"t": "Nervousness.", "h": false}, {"t": "Seizures.", "h": false}, {"t": "Coma.", "h": false}, {"t": "Death.", "h": false}]}, {"id": "5-5", "l": 4, "n": 5, "q": "List the preventive nursing interventions for Hypoglycemia.", "a": [{"t": "Hold insulin or start dextrose when nutrition is interrupted.", "h": false}, {"t": "Carefully titrate insulin in renal/hepatic dysfunction.", "h": false}, {"t": "Reduce insulin doses during corticosteroid tapers.", "h": false}]}, {"id": "5-6", "l": 4, "n": 6, "q": "List the immediate management nursing interventions for Hypoglycemia.", "a": [{"t": "Stop insulin infusion immediately.", "h": false}, {"t": "Administer 10–20 g of hypertonic (50%) IV dextrose.", "h": false}, {"t": "Recheck blood glucose after 5–15 minutes, repeating dextrose as needed until BG > 70 mg/dL.", "h": false}]}, {"id": "5-7", "l": 4, "n": 7, "q": "List the endogenous and exogenous risk factors of Stress-Induced Hyperglycemia (SIH).", "a": [{"t": "Endogenous factors:", "h": true}, {"t": "Bed rest.", "h": false}, {"t": "Counter-regulatory hormones.", "h": false}, {"t": "Increased cytokines.", "h": false}, {"t": "Insufficient insulin.", "h": false}, {"t": "Volume depletion.", "h": false}, {"t": "Exogenous factors:", "h": if(mode==='full'||shown){h+='<div class="pt"><span class="pn">'+n+'</span><div class="tx">'+esc(a.t)+'</div></div>'}
else if(mode==='hidden'){h+='<div class="pt hid" data-a="rv" data-k="'+key+'"><span class="pn">'+n+'</span><div class="tx"><span class="ph"></span>'+ic('eye')+'</div></div>'}
