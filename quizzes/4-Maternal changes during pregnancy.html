<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Maternal Changes during Pregnancy</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY (GENERATE 50 QUESTIONS HERE) ---
        const rawQuizData = [
            {
                id: 1,
                question: "In normal pregnancy, the total blood volume increases more in hemoglobin mass than in plasma volume.",
                options: ["True", "False"],
                correct: 1,
                rationale: "The blood volume increases more in the plasma volume (about 50%) than in the total red cell mass (about 20%), leading to haemodilution and physiological anemia."
            },
            {
                id: 2,
                question: "Which factor contributes to the occurrence of renal glucosuria during pregnancy?",
                options: [
                    "Reduced renal threshold",
                    "Increased maternal insulin",
                    "Decreased filtration rate",
                    "Enhanced tubular reabsorption"
                ],
                correct: 0,
                rationale: "Renal glucosuria is not uncommon due to a reduced renal threshold for glucose in pregnancy and should be differentiated from gestational diabetes."
            },
            {
                id: 3,
                question: "At which gestational age does the uterus typically regain a pyriform shape after being globular?",
                options: [
                    "Eighth week",
                    "Twelfth week",
                    "Sixteenth week",
                    "Twentieth week"
                ],
                correct: 2,
                rationale: "The nonpregnant uterus is an inverted pear shape. At the 8th and 12th weeks, it is globular, and at the 16th week, it becomes pyriform again."
            },
            {
                id: 4,
                question: "What causes the delayed emptying of the stomach and reduced intestinal peristalsis during pregnancy?",
                options: [
                    "Smooth muscle relaxing effect",
                    "Mechanical abdominal compression",
                    "Increased gastric acid secretion",
                    "Elevated gonadotropin levels"
                ],
                correct: 0,
                rationale: "The smooth muscle relaxing effect of progesterone causes delayed emptying of the stomach and reduced intestinal peristalsis, leading to flatulence and constipation."
            },
            {
                id: 5,
                question: "Cell-mediated immunity is depressed during pregnancy to prevent the rejection of the fetus.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Helper T cells decrease and cell-mediated immunity is depressed in pregnancy. This suppressed immune system is necessary to prevent the rejection of the fetus, which is considered foreign."
            },
            {
                id: 6,
                question: "What is the primary cause of growth and branching of the breast ducts during pregnancy?",
                options: [
                    "Progesterone excess",
                    "Estrogen excess",
                    "Prolactin increase",
                    "Oxytocin release"
                ],
                correct: 1,
                rationale: "During pregnancy, estrogen excess causes the growth and branching of the breast ducts, while progesterone excess causes proliferation of the glandular epithelium."
            },
            {
                id: 7,
                question: "Which skin change is primarily attributed to the stretching of the abdomen and excess corticosteroids?",
                options: [
                    "Chloasma pigmentation",
                    "Linea nigra formation",
                    "Striae gravidarum appearance",
                    "Montgomery tubercles enlargement"
                ],
                correct: 2,
                rationale: "Stretching of the skin of the abdomen and excess corticosteroids in pregnancy are responsible for the appearance of skin striae called striae gravidarum."
            },
            {
                id: 8,
                question: "Oxygen consumption and carbon dioxide production increase by approximately twenty percent over pre-pregnant values.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Oxygen consumption and carbon dioxide production actually increase by approximately 60% over pre-pregnant values."
            },
            {
                id: 9,
                question: "What is the primary mechanism for glucose transport across the placental barriers?",
                options: [
                    "Simple passive diffusion",
                    "Active transport mechanisms",
                    "Facilitated carrier diffusion",
                    "Receptor mediated endocytosis"
                ],
                correct: 2,
                rationale: "Glucose transport across the placental barriers is managed by a carrier-mediated mechanism (facilitated diffusion) to meet the increased fetal demand."
            },
            {
                id: 10,
                question: "Which sign is characterized by the bluish discoloration of the vagina due to increased blood supply?",
                options: [
                    "Goodell sign",
                    "Chadwick sign",
                    "Braxton Hicks sign",
                    "Montgomery sign"
                ],
                correct: 1,
                rationale: "An increased blood supply results in the bluish discoloration of the vagina, which is clinically known as Chadwick's sign."
            },
            {
                id: 11,
                question: "The nervous system remains completely undisturbed functionally throughout the entire duration of normal pregnancy.",
                options: ["True", "False"],
                correct: 1,
                rationale: "The nervous system becomes functionally disturbed by pregnancy, leading to issues like morning sickness of neurotic origin, sleepiness, depression, irritability, and insomnia."
            },
            {
                id: 12,
                question: "Which layer of the uterine muscle consists of a meshwork of interlacing fibers?",
                options: [
                    "Outer longitudinal layer",
                    "Inner circular layer",
                    "Intermediate meshwork layer",
                    "Internal mucosal layer"
                ],
                correct: 2,
                rationale: "The muscle wall of the uterus consists of 3 layers in late pregnancy: an outer thin longitudinal layer, a thin inner circular layer, and a thick intermediate layer consisting of a meshwork of interlacing fibers."
            },
            {
                id: 13,
                question: "When does the cardiac output reach its maximum increase during pregnancy?",
                options: [
                    "Twelfth to sixteenth week",
                    "Twentieth to twenty fourth week",
                    "Twenty eighth to thirty second week",
                    "Thirty sixth to fortieth week"
                ],
                correct: 2,
                rationale: "The cardiac output increases by about 30-50%, starting from the 12th week and reaching a maximum between the 28th and 32nd week of pregnancy."
            },
            {
                id: 14,
                question: "A waddling gait during pregnancy is caused by relaxation of the pelvic joint due to hormonal influences.",
                options: ["True", "False"],
                correct: 0,
                rationale: "A waddling gait occurs due to the relaxation of the pelvic joint because of hormonal influences such as relaxin and progesterone."
            },
            {
                id: 15,
                question: "What is the average total maternal weight gain during pregnancy?",
                options: [
                    "Eight kilograms",
                    "Ten kilograms",
                    "Twelve kilograms",
                    "Fourteen kilograms"
                ],
                correct: 2,
                rationale: "Maternal body weight increases in pregnancy, except in the first trimester due to morning sickness, with an average total gain of 12 kg."
            },
            {
                id: 16,
                question: "Which group is most likely to exhibit marked progressive dilatation of the renal pelvis and ureter?",
                options: [
                    "Multigravida women on the left side",
                    "Primigravida women on the right side",
                    "Multigravida women on the right side",
                    "Primigravida women on the left side"
                ],
                correct: 1,
                rationale: "There is progressive dilatation of the renal pelvis and ureter from the 16th week; this dilatation is marked in primigravida and is more on the right side."
            },
            {
                id: 17,
                question: "Peptic ulcers typically become more active and symptomatic during the course of pregnancy.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Gastric acidity is often reduced during pregnancy, which causes peptic ulcers to become quiet rather than more active."
            },
            {
                id: 18,
                question: "How long does the corpus luteum produce high levels of estrogen and progesterone before the placenta takes over?",
                options: [
                    "Four to six weeks",
                    "Ten to twelve weeks",
                    "Sixteen to eighteen weeks",
                    "Twenty to twenty two weeks"
                ],
                correct: 1,
                rationale: "The corpus luteum enlarges, producing a high level of estrogen and progesterone in the first 10-12 weeks."
            },
            {
                id: 19,
                question: "What defines the decidua basalis?",
                options: [
                    "Decidua that covers the embryo completely",
                    "Uterine lining not in contact with the fetus",
                    "Uterine lining situated beneath implantation",
                    "Mucous plug collected in the cervical canal"
                ],
                correct: 2,
                rationale: "The decidua basalis is defined as the uterine lining located directly beneath the site of implantation."
            },
            {
                id: 20,
                question: "Pregnancy is typically associated with a state of hypercoagulability where fibrinogen becomes doubled.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Normal pregnancy is associated with hyper-coagulability, and fibrinogen levels become doubled."
            },
            {
                id: 21,
                question: "What causes nasal stuffiness and epistaxis in pregnant women?",
                options: [
                    "Decreased atmospheric pressure",
                    "Upward displacement of the diaphragm",
                    "Vascularity of respiratory mucous membranes",
                    "Reduced lung expansion capacity"
                ],
                correct: 2,
                rationale: "Nasal stuffiness and epistaxis occur because the respiratory mucous membranes become highly vascular, edematous, and friable during pregnancy."
            },
            {
                id: 22,
                question: "What is the normal weight of the uterus at term under the influence of hormonal changes?",
                options: [
                    "Five hundred grams",
                    "Eight hundred grams",
                    "One thousand grams",
                    "Twelve hundred grams"
                ],
                correct: 2,
                rationale: "The uterus grows and its weight increases from 50 grams before pregnancy to 1000 grams at term."
            },
            {
                id: 23,
                question: "Plasma urea and creatinine levels progressively increase due to enhanced renal blood flow during pregnancy.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Renal blood flow increases in pregnancy, causing an increase in glomerular filtration which is associated with a FALL in plasma urea and creatinine levels, not an increase."
            },
            {
                id: 24,
                question: "How much protein is typically retained by the end of pregnancy due to positive nitrogen balance?",
                options: [
                    "Two hundred grams",
                    "Three hundred grams",
                    "Four hundred grams",
                    "Five hundred grams"
                ],
                correct: 3,
                rationale: "There is a positive nitrogen balance in pregnancy, and about 500 grams of protein are retained by the end of pregnancy."
            },
            {
                id: 25,
                question: "What causes supine hypotension syndrome in a pregnant woman?",
                options: [
                    "Enlarged uterus pressing on the inferior vena cava",
                    "Significant reduction in maternal blood volume",
                    "Upward displacement of the maternal diaphragm",
                    "Increased peripheral resistance of blood vessels"
                ],
                correct: 0,
                rationale: "Supine hypotension syndrome occurs when the enlarged uterus presses on the inferior vena cava in the supine position, reducing venous return to the heart."
            },
            {
                id: 26,
                question: "Increased activity of sebaceous glands due to progesterone excess can lead to acne and oily skin.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Increased activity of sebaceous glands due to progesterone excess occurs in pregnancy and is manifested by acne, oily skin, and oily hair."
            },
            {
                id: 27,
                question: "From which part of the uterus does the lower uterine segment develop in late pregnancy?",
                options: [
                    "Uterine fundus",
                    "Uterine isthmus",
                    "Cervical canal",
                    "Uterine cornua"
                ],
                correct: 1,
                rationale: "The lower uterine segment becomes developed in late pregnancy from the isthmus of the uterus."
            },
            {
                id: 28,
                question: "How many small tubercles typically form the ring known as Montgomery tubercles on the areola?",
                options: [
                    "Five to ten tubercles",
                    "Twelve to twenty tubercles",
                    "Twenty to thirty tubercles",
                    "Thirty to forty tubercles"
                ],
                correct: 1,
                rationale: "Sebaceous glands on the areola become hypertrophied and are seen as a ring of 12-20 small tubercles termed Montgomery's tubercles."
            },
            {
                id: 29,
                question: "Maternal serum levels of immunoglobulin G and immunoglobulin M decrease during pregnancy.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Serum levels of IgG and IgM decrease in pregnancy as part of the overall adaptation of the maternal immune system."
            },
            {
                id: 30,
                question: "Which substance serves as the major source of stored energy during pregnancy?",
                options: [
                    "Dietary carbohydrates",
                    "Stored tissue fat",
                    "Cellular proteins",
                    "Circulating glucose"
                ],
                correct: 1,
                rationale: "Fat is the major source of stored energy during pregnancy, and excess fat is deposited in the abdominal wall, back, thigh, and breasts."
            }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
