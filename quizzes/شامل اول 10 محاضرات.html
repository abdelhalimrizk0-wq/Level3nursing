            { id: 90, question: "When is the placenta completely formed and functioning?", options: ["Ten to twelve weeks", "Six to eight weeks", "Fourteen to sixteen weeks", "Eighteen to twenty weeks"], correct: 0, rationale: "The placenta is completely formed and functioning from 10–12 weeks after fertilization." },
            { id: 91, question: "Which term describes the absence or stopping of menstruation during reproductive years?", options: ["Amenorrhea", "Menorrhagia", "Metrorrhagia", "Dysmenorrhea"], correct: 0, rationale: "Amenorrhea is the absence or stopping of menstruation during reproductive years." },
            { id: 92, question: "Which stage of labor entails the delivery of the placenta?", options: ["Third stage", "First stage", "Second stage", "Fourth stage"], correct: 0, rationale: "The third (placental) stage involves the delivery of the placenta." },
            { id: 93, question: "What is the normal non pregnant uterus weight?", options: ["Sixty grams", "Forty grams", "Eighty grams", "One hundred grams"], correct: 0, rationale: "The non-pregnant uterus typically weighs about 50 to 60 grams." },
            { id: 94, question: "Implantation is normally complete by which day after ovulation?", options: ["Eleventh day", "Seventh day", "Fourteenth day", "Fourth day"], correct: 0, rationale: "Implantation is normally complete by the 11th day after ovulation." },
            { id: 95, question: "Which reflex inhibition condition can cause urinary retention postpartum?", options: ["Stitched perineum", "Diaphoresis", "Lactosuria", "Autolysis"], correct: 0, rationale: "Reflex inhibition due to a stitched perineum or bruised urethra can lead to urinary retention postpartum." },
            { id: 96, question: "Which process involves the breakdown of uterine muscle protein by enzymes during involution?", options: ["Autolysis", "Ischemia", "Phagocytosis", "Necrosis"], correct: 0, rationale: "Autolysis is the self-digestion of uterine muscle fibers broken down by enzymes." },
            { id: 97, question: "What type of lochia is pinkish yellow and lasts from the fifth to the eighth day postpartum?", options: ["Lochia serosa", "Lochia rubra", "Lochia alba", "Lochia purulenta"], correct: 0, rationale: "Lochia serosa is pinkish-yellow and typically occurs after the rubra phase, for another 3-4 days." },
            { id: 98, question: "Softening of the cervix during early pregnancy is known as Goodell's sign.", options: ["True", "False"], correct: 0, rationale: "Goodell's sign is the softening of the cervix." },
            { id: 99, question: "Which skin change is often referred to as the mask of pregnancy?", options: ["Chloasma", "Linea nigra", "Striae gravidarum", "Montgomery tubercles"], correct: 0, rationale: "Chloasma is increased pigmentation known as the mask of pregnancy." },
            { id: 100, question: "Postpartum blues typically peak on which days following delivery?", options: ["Fourth or fifth day", "First or second day", "Tenth or eleventh day", "Fourteenth or fifteenth day"], correct: 0, rationale: "Postpartum blues generally peak on the 4th or 5th postpartum day." }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
