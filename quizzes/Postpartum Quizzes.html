        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

                    { id: 2, question: "What is a typical pulse characteristic during the early postnatal period?", options: ["Physiological bradycardia", "Persistent tachycardia", "Irregular palpitations", "Ventricular fibrillation"], correct: 0, rationale: "During the early postnatal period, the pulse is usually full and slow, known as physiological bradycardia." },
                    { id: 3, question: "Which characteristic is mostly associated with lochia alba?", options: ["Creamy white discharge", "Bright red bleeding", "Pinkish yellow fluid", "Clear watery secretion"], correct: 0, rationale: "Lochia alba is described as a creamy white or pale yellowish discharge containing leukocytes and decidual cells." },
                    { id: 4, question: "The uterus normally returns to its prepregnant weight of approximately fifty grams by the sixth week postpartum.", options: ["True", "False"], correct: 0, rationale: "As involution is completed around the 6th week, the uterus weighs approximately 50 grams." },
                    { id: 5, question: "During which timeframe does the taking hold phase of maternal adaptation typically begin?", options: ["The third day postpartum", "The second week postpartum", "The first hour postpartum", "The fourth week postpartum"], correct: 0, rationale: "The taking-hold phase starts on the third day postpartum when the mother becomes driven to organize herself." },
                    { id: 6, question: "How long does the postpartum period generally last following a normal full term birth?", options: ["Forty days", "Seven days", "Twenty days", "Ninety days"], correct: 0, rationale: "The duration of the postpartum period is typically 40 days or 6-8 weeks for maximum involution." },
                    { id: 7, question: "Oxytocin acts on the myoepithelial cells to facilitate the expulsion of breast milk.", options: ["True", "False"], correct: 0, rationale: "Oxytocin leads to the contraction of myoepithelial cells and the subsequent expulsion of milk." },
                    { id: 8, question: "What is the estimated blood loss associated with a typical vaginal birth?", options: ["Three to five hundred milliliters", "Five to one thousand milliliters", "One to two hundred milliliters", "Two to three thousand milliliters"], correct: 0, rationale: "The usual blood loss with a vaginal birth ranges from 300 to 500 milliliters." },
                    { id: 9, question: "The external opening of the cervix returns completely to its original nulliparous dimpled shape following childbirth.", options: ["True", "False"], correct: 1, rationale: "The characteristic dimple-like os of the nullipara changes permanently to a transverse slit in multiparous women." },
                    { id: 10, question: "Which process involves the breakdown of uterine muscle fiber protein by specific enzymes?", options: ["Autolysis", "Ischemia", "Diuresis", "Hemostasis"], correct: 0, rationale: "Autolysis is the self-digestion where protein material of uterine muscle fibers is broken down by enzymes." },
                    { id: 11, question: "When do postpartum blues typically reach their highest intensity?", options: ["Fourth or fifth day", "First or second day", "Tenth or twelfth day", "Second or third week"], correct: 0, rationale: "Postpartum blues peak on the 4th or 5th postpartum days and may last from hours to days." },
                    { id: 12, question: "A temporary state of urinary retention may occur in the first few days after labor due to loss of bladder tone.", options: ["True", "False"], correct: 0, rationale: "The parturient may experience retention of urine due to transient loss of bladder tone from the pressure of the fetal head." },
                    { id: 13, question: "What physiological event primarily causes the initial reactionary rise in maternal body temperature?", options: ["Muscle waste absorption", "Breast milk engorgement", "Endometrial tissue infection", "Urinary tract colonization"], correct: 0, rationale: "The reactionary rise in temperature in the first 24 hours is due to the absorption of waste products of muscular contractions and dehydration." },
                    { id: 14, question: "How do clotting factors and fibrinogen behave during the immediate puerperium?", options: ["They remain notably elevated", "They decrease very rapidly", "They vanish completely entirely", "They fluctuate unpredictably"], correct: 0, rationale: "Clotting factors and fibrinogen are normally increased during pregnancy and remain elevated in the immediate puerperium." },
                    { id: 15, question: "Where should the uterine fundus typically be felt at the end of the first week postpartum?", options: ["Midway between umbilicus and symphysis", "At the level of the central umbilicus", "Just above the upper pelvic brim", "Slightly above the umbilicus region"], correct: 0, rationale: "At the end of the 1st week, the fundus is midway between the umbilicus and symphysis pubis." },
                    { id: 16, question: "Which symptom is a common integumentary change during the first week postpartum?", options: ["Excessive sweating", "Severe skin flaking", "Increased pigmentation", "Chronic intense itchiness"], correct: 0, rationale: "Diaphoresis is common during the first week to reduce the fluids retained during pregnancy." },
                    { id: 17, question: "A sudden onset of hypotension during the immediate postpartum period may indicate hemorrhage.", options: ["True", "False"], correct: 0, rationale: "If hypotension is present after birth, postpartum hemorrhage is highly suspected." },
                    { id: 18, question: "Which factor is a significant predisposing cause of diastasis recti abdominis?", options: ["Multiple pregnancies", "Excessive exercising", "Complete strict bedrest", "Uterine underdistention"], correct: 0, rationale: "Over distention of the uterus as in multiple pregnancies pre-disposes a woman to diastasis recti abdominis." },
                    { id: 19, question: "How long does lochia serosa typically last after the initial rubra phase?", options: ["Three to four days", "One to two weeks", "Five to six hours", "Ten to twelve days"], correct: 0, rationale: "Lochia serosa typically lasts for another 3-4 days after the rubra phase." },
                    { id: 20, question: "Which maternal phase involves the woman being passive and highly dependent on others?", options: ["Taking in phase", "Taking hold phase", "Letting go phase", "Moving forward phase"], correct: 0, rationale: "During the taking-in phase, the woman reacts passively and is mostly dependent on others to meet her needs." },
                    { id: 21, question: "How much additional weight loss is typically attributed to the combined effects of diuresis and diaphoresis?", options: ["Two to four kilograms", "Four to five kilograms", "One to two kilograms", "Five to seven kilograms"], correct: 0, rationale: "The rapid diuresis and diaphoresis during the second to fifth days after birth cause a 2 to 4 kg weight loss." },
                    { id: 22, question: "A spontaneous bowel evacuation is guaranteed to occur within the first twenty four hours after childbirth.", options: ["True", "False"], correct: 1, rationale: "A spontaneous bowel evacuation may not occur for 2 to 3 days after birth due to decreased motility." },
                    { id: 23, question: "What condition results from the vigorous contraction of uterine muscle fibers pinching open blood vessels?", options: ["Ischemia", "Autolysis", "Diaphoresis", "Diuresis"], correct: 0, rationale: "Ischemia occurs when vigorous contractions act as living ligatures, reducing blood supply and stopping bleeding." },
                    { id: 24, question: "Lactosuria is most frequently observed on the very first day immediately following childbirth.", options: ["True", "False"], correct: 1, rationale: "Lactosuria is common with milk engorgement on the 4th day at the start of lactation." },
                    { id: 25, question: "By what percentage does the maternal cardiac output normally decrease two weeks after birth?", options: ["Thirty percent", "Fifty percent", "Ten percent", "Seventy percent"], correct: 0, rationale: "By 2 weeks after birth, cardiac output decreases by 30%." },
                    { id: 26, question: "Which abnormal lochia sign strongly suggests the presence of retained placental fragments?", options: ["Prolonged rubra discharge", "Sudden complete suppression", "Fetid offensive odor", "Clear serous weeping"], correct: 0, rationale: "Prolongation of lochia rubra beyond the 7th postpartum day suggests retained parts of the placenta." },
                    { id: 27, question: "Perineal tightening exercises can successfully improve the tone and contractility of the vaginal orifice.", options: ["True", "False"], correct: 0, rationale: "Tone and contractility of the vaginal orifice may be improved by perineal tightening exercises like Kegel exercises." },
                    { id: 28, question: "When do nonlactating mothers generally begin to menstruate following childbirth?", options: ["Six to eight weeks", "One to two weeks", "Ten to twelve weeks", "Three to four months"], correct: 0, rationale: "Mothers begin to menstruate in 6-8 weeks following birth." },
                    { id: 29, question: "Which factor can trigger a transient rise in body temperature on the third or fourth postpartum day?", options: ["Breast milk engorgement", "Severe muscle weakness", "Extreme fluid retention", "Sudden blood volume loss"], correct: 0, rationale: "On the third or fourth day there may be a transient rise of temperature due to breast milk engorgement, constipation, or nervous excitation." },
                    { id: 30, question: "The letting go phase generally occurs after the mother has completely returned to her home environment.", options: ["True", "False"], correct: 0, rationale: "The letting-go phase generally occurs when the mother returns home and establishes her mothering functions." }
                ]
            },
            {
                id: 'quiz-2',
                title: 'Management and Nursing Care of Puerperium',
                theme: 'blue',
                data: [
                    { id: 1, question: "Which position is recommended for a postpartum mother after the first eight hours of labor to facilitate involution and lochia drainage?", options: ["Prone position", "Supine position", "Upright position", "Fowler position"], correct: 0, rationale: "After the first eight hours, the prone or lateral positions should be encouraged to facilitate involution and help drainage of lochia." },
                    { id: 2, question: "Vital signs should be checked every thirty minutes during the first hour following labor.", options: ["True", "False"], correct: 1, rationale: "Assessment of vital signs should occur every fifteen minutes for the first hour after labor, and then every thirty minutes during the second hour." },
                    { id: 3, question: "The physician will order catheterization if the postpartum woman is voiding frequent amounts less than a specific volume. What is this volume?", options: ["Fifty milliliters", "One hundred milliliters", "One hundred fifty milliliters", "Two hundred milliliters"], correct: 1, rationale: "Catheterization is ordered when the bladder is distended and the woman is voiding small amounts of less than one hundred milliliters frequently." },
                    { id: 4, question: "What is the recommended daily caloric requirement for a postpartum woman to maintain a well balanced and nourishing diet?", options: ["Two thousand calories", "Two thousand five hundred calories", "Three thousand five hundred calories", "Four thousand five hundred calories"], correct: 2, rationale: "A daily requirement of three thousand to three thousand five hundred calories is needed in the form of a well-balanced and nourishing diet." },
                    { id: 5, question: "Anti D immunoglobulin must be administered to Rh negative mothers with an Rh positive baby within the first forty eight hours after delivery.", options: ["True", "False"], correct: 1, rationale: "Anti D immunoglobulin should be administered to those Rh negative mothers with an Rh positive baby within the first seventy two hours after delivery." },
                    { id: 6, question: "When should the nurse instruct the postpartum woman that she can safely resume sexual relations?", options: ["Two to four weeks postpartum", "Four to six weeks postpartum", "Six to eight weeks postpartum", "Eight to ten weeks postpartum"], correct: 2, rationale: "Resumption of sexual relations should be discussed and is generally advised after six to eight weeks postpartum." },
                    { id: 7, question: "How should the fundus of the uterus feel upon abdominal palpation during the first hour after birth?", options: ["Large soft and deviated", "Small firm and globular", "Large firm and displaced", "Small boggy and midline"], correct: 1, rationale: "During the first hour after birth, the fundus should be small, firm, globular, and well contracted, and it should be positioned in the midline." },
                    { id: 8, question: "A temperature of thirty eight degrees Celsius or above for two consecutive days after the first twenty four hours is an early sign of puerperal infection.", options: ["True", "False"], correct: 0, rationale: "A temperature of thirty eight degrees Celsius or above for two consecutive days after the first twenty four hours is considered an early sign of puerperal infection until otherwise proved." },
                    { id: 9, question: "Which clinical sign suggests the presence of deep vein thrombosis in a postpartum woman?", options: ["Positive Homan sign", "Positive Chadwick sign", "Positive Goodell sign", "Positive Hegar sign"], correct: 0, rationale: "Signs and symptoms of deep vein thrombosis include pain, warmth, tenderness, swelling, redness, hard or solid veins, and a positive Homan sign." },
                    { id: 10, question: "What is an appropriate nursing intervention if the uterus is found to be soft on palpation during the immediate postpartum period?", options: ["Perform a gentle rotating massage", "Apply a tight abdominal binder", "Position the mother on her back", "Administer intravenous fluids rapidly"], correct: 0, rationale: "If the uterus is soft or boggy on palpation, the nurse should perform a gentle rotating motion massage to help the uterus contract and become firm." },
                    { id: 11, question: "The mother should raise her hands over her head during a breast examination to stretch and thin the breast tissues.", options: ["True", "False"], correct: 0, rationale: "Asking the mother to raise her hands over her head and put them under her head stretches and thins the breast tissues for better inspection and palpation." },
                    { id: 12, question: "Which set of signs is evaluated when observing an episiotomy site during postpartum care?", options: ["Redness edema ecchymosis discharge approximation", "Rash erythema excoriation drainage alignment", "Redness edema excoriation drainage approximation", "Rash erythema ecchymosis discharge alignment"], correct: 0, rationale: "The REEDA signs used for observing an episiotomy stand for Redness, Edema, Ecchymosis, Discharge, and Approximation." },
                    { id: 13, question: "Why is a mother with a boggy uterus encouraged to start breastfeeding immediately?", options: ["It promotes endogenous release of oxytocin", "It increases blood flow to the uterus", "It prevents postpartum bladder distention", "It reduces the risk of breast engorgement"], correct: 0, rationale: "Starting breastfeeding is encouraged because it causes the endogenous release of oxytocin, which helps the uterus contract and control bleeding." },
                    { id: 14, question: "Early ambulation after delivery increases the incidence of puerperal venous thrombosis and pulmonary embolism.", options: ["True", "False"], correct: 1, rationale: "Early ambulation actually reduces the incidence of puerperal venous thrombosis and pulmonary embolism by promoting blood circulation." },
                    { id: 15, question: "What is the recommended daily sleep requirement for a mother admitted to the postnatal ward?", options: ["Eight hours night sleep and two hours afternoon nap", "Six hours night sleep and four hours afternoon nap", "Ten hours night sleep and no afternoon nap", "Seven hours night sleep and one hour afternoon nap"], correct: 0, rationale: "Providing for sufficient periods of rest and sleep requires eight hours of night sleep and a two hour afternoon nap." },
                    { id: 16, question: "How soon after childbirth can a postpartum woman typically show signs of bladder distention due to normal postpartum diuresis?", options: ["One to two hours", "Three to four hours", "Five to six hours", "Seven to eight hours"], correct: 0, rationale: "A postpartum woman can quickly show signs of bladder distention, possibly as soon as one to two hours after childbirth, due to normal postpartum diuresis." },
                    { id: 17, question: "How often should vital signs be checked between the second hour and the end of the first twenty four hours postpartum?", options: ["Every four to six hours", "Every two to three hours", "Every six to eight hours", "Every eight to ten hours"], correct: 0, rationale: "After the second hour, vital signs should be checked every four to six hours until the end of the first twenty four hours." },
                    { id: 18, question: "What physiological change during pregnancy places postpartum women at an increased risk of developing deep vein thrombosis?", options: ["A hypercoagulable state", "A hypotensive state", "A hypervolemic state", "A hypoglycemic state"], correct: 0, rationale: "Post delivery women are at risk of deep vein thrombosis as a result of the hypercoagulable state established during pregnancy." },
                    { id: 19, question: "A physician will order catheterization if a postpartum woman fails to void completely for how many consecutive hours?", options: ["Eight hours", "Six hours", "Ten hours", "Twelve hours"], correct: 0, rationale: "Catheterization is ordered when the bladder is distended and no voiding has occurred in eight hours." },
                    { id: 20, question: "Which behavior should the nurse remain alert for when assessing the emotional status of a postpartum woman?", options: ["Extreme mood swings", "Increased physical energy", "Excessive social interaction", "Consistent independent care"], correct: 0, rationale: "When assessing the woman's emotional status, the nurse should be alert for mood swings, irritability, or crying episodes." }
                ]
            },
            {
                id: 'quiz-3',
                title: 'Cesarean Section',
                theme: 'purple',
                data: [
                    { id: "q1", question: "Which specific incisions define a cesarean section procedure?", options: ["Abdominal and uterine incisions", "Abdominal and cervical incisions", "Uterine and vaginal incisions", "Perineal and uterine incisions"], correct: 0, rationale: "Cesarean section is defined as the delivery of a viable fetus through an abdominal incision and a uterine incision." },
                    { id: "q2", question: "Why is the term 'cesarean birth' often preferred over 'cesarean section'?", options: ["It puts the focus on childbirth rather than the surgical elements", "It emphasizes the prophylactic nature of the operative procedure", "It clearly defines the exact site of the uterine incision", "It categorizes the procedure strictly as an emergency intervention"], correct: 0, rationale: "The term cesarean birth is preferred because it puts the focus on the childbirth rather than the surgical elements of the procedure." },
                    { id: "q3", question: "Which of the following conditions is classified as an absolute indication for a cesarean delivery?", options: ["Contracted pelvis", "Abnormal uterine action", "Severe respiratory disease", "Active genital herpes"], correct: 0, rationale: "Contracted pelvis is listed as an absolute indication, meaning vaginal delivery is impossible or extremely dangerous. The other options are relative maternal indications." },
                    { id: "q4", question: "Which of these conditions represents a placental indication for a cesarean section?", options: ["Umbilical cord prolapse", "Malposition and malpresentation", "Extreme low birth weight", "Fetal distress"], correct: 0, rationale: "Umbilical cord prolapse is categorized under placental indications, alongside placenta previa and premature separation of the placenta." },
                    { id: "q5", question: "What is a major disadvantage associated with the classic cesarean incision?", options: ["It is more often followed by peritonitis and severe bleeding", "It significantly increases the risk of bladder lacerations", "It places the uterine muscle under much greater tension", "It requires a highly complex surgical approach to perform"], correct: 0, rationale: "The classic cesarean incision is more often followed by peritonitis, severe bleeding, and ileus. The scar may also rupture in subsequent pregnancies." },
                    { id: "q6", question: "Under which specific circumstance is a classical cesarean section indicated?", options: ["Impacted shoulder presentation", "Deeply engaged fetal head", "Presence of lateral varicosities", "Suspected fetal macrosomia"], correct: 0, rationale: "An impacted shoulder presentation is an indication for a classical c-section. The other options are indications for a vertical incision on the lower segment." },
                    { id: "q7", question: "Why does a transverse incision on the lower uterine segment decrease the risk of peritoneal contamination?", options: ["The incision is located behind the bladder and covered by peritoneum", "The lower segment contains highly vascularized fibrous tissue", "The incision avoids the predominant muscle fibers entirely", "The surgical approach eliminates the need for an abdominal cut"], correct: 0, rationale: "The transverse incision decreases the risk of peritoneal contamination because it is behind the bladder and covered by peritoneum, preventing infected material from escaping into the peritoneal cavity." },
                    { id: "q8", question: "What is a primary disadvantage of making a vertical incision on the lower uterine segment?", options: ["It easily extends to the corpus or surrounding structures", "It requires a transverse suprapubic abdominal approach", "It guarantees a catastrophic rupture in future pregnancies", "It creates extreme tension on the uterine muscle fibers"], correct: 0, rationale: "A vertical incision on the lower segment has the disadvantage that it easily extends to the corpus, the bladder, or the vagina." },
                    { id: "q9", question: "What is the most effective way to stimulate lower extremity circulation after a cesarean birth?", options: ["Early ambulation", "Deep breathing exercises", "Continuous supine positioning", "Gastric emptying agents"], correct: 0, rationale: "Early ambulation is described as the most effective way to stimulate lower extremity circulation after a cesarean birth." },
                    { id: "q10", question: "Why might a medication like metoclopramide be prescribed prior to cesarean surgery?", options: ["To speed stomach emptying", "To prevent epidural hypotension", "To decrease surgical site bleeding", "To improve neonatal respiration"], correct: 0, rationale: "A gastric emptying agent such as metoclopramide is used to speed stomach emptying prior to surgery to prepare the gastrointestinal tract." },
                    { id: "q11", question: "Why is catheterizing a pregnant woman typically more difficult than catheterizing a nonpregnant woman?", options: ["The pressure of the fetal head distorts anatomic landmarks", "The urethra becomes fully relaxed and overly dilated", "The bladder position shifts completely into the upper abdomen", "The fluid volume in the bladder decreases significantly"], correct: 0, rationale: "Catheterizing a pregnant woman is more difficult because the pressure of the fetal head puts pressure on the urethra and distorts anatomic landmarks, and the vulva may be swollen." },
                    { id: "q12", question: "What size catheter or needle should be used for the intravenous fluid line before surgery?", options: ["18 or 20 gauge", "14 or 16 gauge", "22 or 24 gauge", "26 or 28 gauge"], correct: 0, rationale: "A large-size catheter or needle of 18 or 20 gauge is used so that blood replacement therapy can be administered by the same line if needed." },
                    { id: "q13", question: "At what point during the procedure are prophylactic antibiotics usually administered?", options: ["After clamping the umbilical cord", "During the initial skin preparation", "Before the epidural anesthesia starts", "Immediately after abdominal closure"], correct: 0, rationale: "Prophylactic antibiotics are usually given after clamping the umbilical cord." },
                    { id: "q14", question: "During surgical preparation, why is a towel placed under the woman's right hip?", options: ["To lift the uterus off the vena cava", "To align the spine for spinal anesthesia", "To prevent pooling of the antiseptic scrub", "To stretch the lower segment muscle fibers"], correct: 0, rationale: "A woman is positioned with a towel under her right hip to move abdominal contents away from the surgical field and to lift her uterus off the vena cava." },
                    { id: "q15", question: "Why is the uterus often exteriorized during wound closure?", options: ["To massage the fundus and inspect the adnexa", "To prevent hypotension and intraoperative nausea", "To facilitate immediate extraction of the placenta", "To apply direct pressure to the umbilical cord"], correct: 0, rationale: "The uterus is often exteriorized to massage the fundus, inspect the adnexa, and facilitate visualization of the wound for repair." },
                    { id: "q16", question: "How many layers are typically required to close a vertical uterine incision?", options: ["3 layers", "1 layer", "2 layers", "4 layers"], correct: 0, rationale: "A vertical incision usually is closed in 3 layers because of the myometrial thickness of the upper segment." },
                    { id: "q17", question: "What is a key benefit of applying leg compression with an elastic stocking just before spinal anesthesia?", options: ["It decreases the incidence of spinal-induced hypotension", "It completely stops post-operative abdominal pain", "It reduces the necessary dosage of epidural medication", "It accelerates the post-operative involution of the uterus"], correct: 0, rationale: "Leg compression with an elastic stocking decreases the incidence of spinal-induced hypotension and diminishes the frequency of intraoperative nausea, vomiting, and shivering." },
                    { id: "q18", question: "Which post-operative infection is explicitly listed as a complication of a cesarean section?", options: ["Endometritis", "Thrombophlebitis", "Paralytic ileus", "Placenta previa"], correct: 0, rationale: "Endometritis, wound sepsis, peritonitis, and secondary pelvic adhesions are listed as post-operative infection complications. Thrombophlebitis is an embolism complication, and paralytic ileus is an intestinal obstruction." },
                    { id: "q19", question: "Which of the following represents a relative fetal indication for cesarean delivery?", options: ["Macrosomia", "Soft tissue dystocia", "Contracted pelvis", "Conjoined twins"], correct: 0, rationale: "Macrosomia is a relative fetal indication. Soft tissue dystocia, contracted pelvis, and conjoined twins are all absolute indications." },
                    { id: "q20", question: "What makes a subsequent uterine rupture less catastrophic when a prior transverse lower segment incision was used?", options: ["It is most often a dehiscence of the scar", "It occurs strictly in the fibrous upper segment", "It involves multiple layers of myometrial tearing", "It is contained securely by the exteriorized adnexa"], correct: 0, rationale: "With a transverse incision, decreased risk of uterine rupture exists, and when it occurs, it is usually not catastrophic because most often it is a dehiscence of the scar." },
                    { id: "q21", question: "Cesarean birth is currently used most often as a prophylactic measure to alleviate problems during labor.", options: ["True", "False"], correct: 0, rationale: "Nowadays, cesarean birth is used most often as a prophylactic measure to alleviate problems that can occur during labor." },
                    { id: "q22", question: "A previous cesarean birth via a classic incision is classified as a relative indication for future cesarean sections.", options: ["True", "False"], correct: 1, rationale: "A previous cesarean birth by classic incision is listed under absolute indications, not relative indications." },
                    { id: "q23", question: "Relative indications refer to conditions where vaginal delivery is absolutely impossible.", options: ["True", "False"], correct: 1, rationale: "Relative indications mean vaginal delivery can be attained, but there is undue risk for the fetus or mother. Absolute indications are when vaginal delivery is impossible." },
                    { id: "q24", question: "A primary cesarean section is defined as an operation performed on a woman for the very first time.", options: ["True", "False"], correct: 0, rationale: "A primary cesarean section is done for the first time, whereas a repeated cesarean section is done on a woman with a previous cesarean scar." },
                    { id: "q25", question: "The lower uterine segment is highly vascularized, making surgical stitching more difficult than in the upper segment.", options: ["True", "False"], correct: 1, rationale: "The uterine wall of the lower segment is thin and less vascularized, which actually leads to better stitching." },
                    { id: "q26", question: "Periodic deep breathing exercises post-operatively help prevent the stasis of lung mucus caused by prolonged time in a supine position.", options: ["True", "False"], correct: 0, rationale: "Deep breathing exercises fully aerate the lungs and help prevent the stasis of lung mucus from prolonged supine positioning during surgery." },

            {

                    { id: "q1", question: "What percentage of blood clots that cause a pulmonary embolism form in the deep veins of the leg?", options: ["50%", "70%", "90%", "100%"], correct: 2, rationale: "The text states that 90% of blood clots that cause pulmonary embolism form in the deep veins of the leg." },
                    { id: "q2", question: "Which pathophysiological mechanism initiates the development of most venous thrombi?", options: ["Rapid blood flow through venous valves", "Stagnant hypoxemia behind valve pockets", "Decreased blood viscosity from hemodilution", "Destruction of vessel endothelium by bacteria"], correct: 1, rationale: "Most venous thrombi originate behind valve pockets where flow is slower or stagnant. Stagnant hypoxemia is capable of causing endothelial injury and retaining pro-coagulant factors." },
                    { id: "q3", question: "Which finding is a classic sign of superficial vein thrombosis rather than deep vein thrombosis?", options: ["Positive Homans sign", "Shortness of breath", "Palpable firm thickened cord", "Bluish skin discoloration"], correct: 2, rationale: "A superficial vein thrombosis presents with redness, warmth, swelling, and the affected vein can be palpated as a firm thickened cord. Positive Homans sign and discoloration are signs of DVT." },
                    { id: "q4", question: "What is the definition of phlebothrombosis?", options: ["Inflammation of the blood vessel lining", "Formation of blood clots with inflammation", "Formation of blood clots without inflammation", "Movement of a clot into the lung artery"], correct: 2, rationale: "Phlebothrombosis is defined strictly as the formation of blood clots without inflammation in blood vessels." },
                    { id: "q5", question: "Why does hypercoagulation naturally occur during pregnancy?", options: ["To increase the overall blood volume", "To stop bleeding and achieve hemostasis", "To decrease the viscosity of maternal blood", "To prevent the formation of varicose veins"], correct: 1, rationale: "During pregnancy, blood clotting factors increase and clot dissolving factors decrease for rapid utilization during labor and postpartum to stop bleeding and achieve hemostasis." },
                    { id: "q6", question: "Which nursing intervention is appropriate for a patient diagnosed with deep vein thrombosis?", options: ["Massage the affected leg gently", "Elevate the affected leg on pillows", "Apply a bed cradle over the affected leg", "Encourage immediate vigorous ambulation"], correct: 2, rationale: "Nursing interventions for DVT include bed rest without elevating the affected leg, not massaging the skin, and using a bed cradle to keep bed linen off the affected leg." },
                    { id: "q7", question: "Which medication is contraindicated for treating deep vein thrombosis during pregnancy?", options: ["Heparin", "Fibrinolytic agents", "Warfarin", "Acetaminophen"], correct: 2, rationale: "Warfarin is listed under medical management for DVT but is explicitly noted as contraindicated during pregnancy." },
                    { id: "q8", question: "What is a major limitation of the D-dimer blood test when used to diagnose deep vein thrombosis?", options: ["It requires a radioactive dye injection", "It cannot detect breakdown products", "It produces false positive results in pregnancy", "It fails to visualize veins in the pelvis"], correct: 2, rationale: "The D-dimer test detects breakdown products of a blood clot, but unfortunately, the test can be positive in a number of other situations, such as recent surgery or pregnancy." },
                    { id: "q9", question: "Which complication affects 29 to 79% of patients who develop a deep vein thrombosis?", options: ["Nephrotic syndrome", "Post-phlebitic syndrome", "Endometritis", "Pulmonary embolism"], correct: 1, rationale: "Even if a vessel reopens, the venous valves may be destroyed by the inflammatory reaction, leading to a chronic venous disorder called post-phlebitic syndrome in 29% to 79% of patients." },
                    { id: "q10", question: "Which maternal position should be minimized during labor to prevent deep vein thrombosis?", options: ["Lateral recumbent position", "Semi-Fowler position", "Lithotomy position", "Upright standing position"], correct: 2, rationale: "Primary prevention during labor includes avoiding or minimizing the use of the lithotomy position to reduce pressure on the veins." },
                    { id: "q11", question: "What does a positive Homans sign indicate?", options: ["Chest pain that worsens with deep breaths", "Pain in the calf muscles on dorsiflexion", "Redness and warmth over a superficial vein", "Unexplained rapid heart rate at rest"], correct: 1, rationale: "A positive Homans sign is a clinical sign of deep vein thrombosis characterized by pain in the calf muscles on dorsiflexion." },
                    { id: "q12", question: "Which item should pregnant women avoid to prevent increasing hypercoagulability?", options: ["Folic acid supplements", "Vitamin E preparations", "Progestin hormone therapy", "Daily prenatal vitamins"], correct: 1, rationale: "Primary prevention during pregnancy includes avoiding drugs that increase hypercoagulability, specifically listing neomycin, vitamin E, chloramphenicol, and green tea." },
                    { id: "q13", question: "What is the primary objective of secondary prevention for deep vein thrombosis?", options: ["Specific protection for every pregnant woman", "Early detection and recurrence prevention", "Managing long-term complications of clots", "Providing resources for patient rehabilitation"], correct: 1, rationale: "The objective of secondary prevention is defined as early detection and recurrence prevention." },
                    { id: "q14", question: "Which diagnostic procedure uses high-frequency sound waves to produce images of blood vessels?", options: ["Venography", "D-dimer blood test", "Duplex ultrasound", "Magnetic resonance imaging"], correct: 2, rationale: "During a duplex ultrasound, high-frequency sound waves bounce off the inside of the body, producing images of blood vessels." },
                    { id: "q15", question: "How long does the state of hypercoagulation typically continue after giving birth?", options: ["2 weeks", "4 weeks", "6 weeks", "8 weeks"], correct: 2, rationale: "The text states that hypercoagulation will continue up to 6 weeks postpartum." },
                    { id: "q16", question: "Which medical condition is recognized as a risk factor for developing a blood clot?", options: ["Nephrotic syndrome", "Hyperthyroidism", "Gestational diabetes", "Bronchial asthma"], correct: 0, rationale: "The kidney disorder called nephrotic syndrome is specifically listed under medical conditions that act as risk factors for developing a blood clot." },
                    { id: "q17", question: "What factor contributes significantly to increased blood viscosity during the postpartum period?", options: ["Prolonged time in stirrups", "Increased blood and fluid loss", "Enlarging uterus pressing on veins", "Rapid utilization of dissolving factors"], correct: 1, rationale: "Predisposing factors during the postpartum period include increased viscosity of blood due to increased blood and fluid loss." },
                    { id: "q18", question: "Which symptom suggests that a patient on blood thinners is experiencing a bleed into the stomach?", options: ["Very heavy recurrent nosebleeds", "Sudden weakness and slurred speech", "Vomiting material resembling coffee grounds", "Dark black and sticky tarry bowel movements"], correct: 2, rationale: "Vomiting of bright red blood or something that looks like coffee grounds may indicate a bleed in the esophagus or stomach." },
                    { id: "q19", question: "What is the correct anatomical definition of a pulmonary embolism?", options: ["A blood clot that forms directly in the deep calf veins", "An inflammation of the lining of the pulmonary vessels", "A blood clot that breaks off and lodges in the lung", "A failure of venous valves causing backward blood flow"], correct: 2, rationale: "Pulmonary Embolism is a complication occurring when a blood clot breaks off, travels through the blood stream, and lodges in the lung." },
                    { id: "q20", question: "Which physiological change contributes directly to venous stasis during pregnancy?", options: ["Decreased estrogen and progestin levels", "Compression of large vessels by the uterus", "Increased systemic blood clotting factors", "Use of well padded labor and delivery tables"], correct: 1, rationale: "During pregnancy, the greater pressures of the growing uterus on lower extremities lead to compression of large vessels and vascular dilatation, causing venous stasis." },
                    { id: "q21", question: "A thigh vein is the most common site for a deep vein thrombosis to develop in the body.", options: ["True", "False"], correct: 1, rationale: "False. A calf vein is the common site for a DVT, while a thigh vein is less commonly affected." },
                    { id: "q22", question: "Massaging the skin of an affected leg can cause the blood clot to break off and lead to a pulmonary embolism.", options: ["True", "False"], correct: 0, rationale: "True. The nursing interventions state to never massage the skin in the affected leg because it can cause the clot to break off and result in a pulmonary embolism." },
                    { id: "q23", question: "Venography involves injecting a radioactive dye into a vein on the top of the foot to visualize the anatomy of the veins.", options: ["True", "False"], correct: 0, rationale: "True. During a venography, a doctor injects a radioactive dye into a vein on the top of the foot to highlight the veins on an X-ray." },
                    { id: "q24", question: "Patients diagnosed with deep vein thrombosis should elevate the affected leg while on bed rest to improve circulation.", options: ["True", "False"], correct: 1, rationale: "False. The nursing interventions specify bed rest and advise not to elevate the affected leg to prevent movement of the clot, which can cause complications." },
                    { id: "q25", question: "Thrombophlebitis is defined as the formation of blood clots without any accompanying inflammation in the blood vessels.", options: ["True", "False"], correct: 1, rationale: "False. Thrombophlebitis is defined as inflammation plus clots formation. Phlebothrombosis is the formation of clots without inflammation." },
                    { id: "q26", question: "The use of the lithotomy position during labor is encouraged because it reduces pressure on the veins of the lower extremities.", options: ["True", "False"], correct: 1, rationale: "False. Primary prevention during labor involves avoiding or minimizing the use of the lithotomy position to reduce pressure on the veins." },
                    { id: "q27", question: "Endometritis is a predisposing factor that can lead to pelvic thrombophlebitis during the postpartum period.", options: ["True", "False"], correct: 0, rationale: "True. The presence of endometritis is listed as a predisposing factor for pelvic thrombophlebitis during the postpartum period." },
                    { id: "q28", question: "Duplex ultrasound is highly sensitive and easily detects blood clots located very deep inside the pelvis.", options: ["True", "False"], correct: 1, rationale: "False. The text explicitly notes that the duplex ultrasound test is less sensitive in finding blood clots that are very deep inside the body, such as in the pelvis." },
                    { id: "q29", question: "Tertiary prevention for deep vein thrombosis focuses on managing long-term complications to improve the patient's quality of life.", options: ["True", "False"], correct: 0, rationale: "True. The objective of tertiary prevention is to manage the complications of existing DVT to prevent long-term consequences and improve quality of life." },

                    { question: "The buttocks lift exercise is recommended to be performed on the very first day immediately after giving birth.", options: ["False", "True"], correct: 0, rationale: "The buttocks lift is categorized under Day 2-7 Exercises. Day 1 exercises primarily include Kegel's, pelvic tilt, abdominal breathing, arm raises, and leg rolls." },
                    { question: "What is the primary purpose of performing the huffing exercise after a Cesarean delivery?", options: ["To dislodge mucus from the lungs", "To strengthen the abdominal wall", "To prevent deep vein thrombosis", "To improve pelvic floor muscle tone"], correct: 0, rationale: "Huffing is a quick outward breath designed to dislodge mucus produced in the lungs in response to general anesthesia, preventing small air sacs from closing." },
                    { question: "Postpartum exercise is performed exclusively to help the mother regain her pre-pregnancy weight as quickly as possible.", options: ["False", "True"], correct: 0, rationale: "The text emphasizes that the most important initial focus is resting and getting to know the baby without rushing to regain shape. The primary physiological goal is restoring abdominal and pelvic muscles." },
                    { question: "How should the mother position her legs at the start of the single knee roll exercise?", options: ["One leg straight and the other leg bent at the knee", "Both legs completely straight against the floor", "Both knees bent with feet flat on the floor", "Both legs tightly drawn up toward the abdomen"], correct: 0, rationale: "The single knee roll begins by lying on the back with one leg straight and the other leg bent at the knee before rolling the bent knee over." },
                    { question: "Deep vein thrombosis is a contraindication for postnatal exercises because the physical activity may dislodge the thrombus and cause a pulmonary embolism.", options: ["True", "False"], correct: 0, rationale: "Deep vein thrombosis is an absolute contraindication for postnatal exercise because the thrombus may dislodge, leading to a life-threatening pulmonary embolism." },

                    { question: "Mothers who have undergone a Cesarean delivery under general anesthesia should perform coughing rather than huffing to clear mucus from the lungs.", options: ["False", "True"], correct: 0, rationale: "The text explicitly states that mothers should perform huffing instead of coughing because huffing pulls the abdominal wall in and is much more comfortable." },

                    { question: "During the abdominal breathing exercise on the first day, the mother should inhale deeply through the nose and allow the abdomen to expand upward.", options: ["True", "False"], correct: 0, rationale: "The correct technique for abdominal breathing involves inhaling deeply through the nose and allowing the abdomen to physically expand upward." },
                    { question: "How many days after a Cesarean delivery should the head-up lift exercise be added to the routine?", options: ["7 days", "3 days", "14 days", "1 day"], correct: 0, rationale: "The text specifies that the head-up lift exercise should be added 7 days after surgery, performing it 3 to 5 times, twice a day." },

                    { question: "The back exercise performed after the first week involves lying on the floor like a cat and making the back concave one time and convex another time.", options: ["True", "False"], correct: 0, rationale: "The back exercise is performed by acting like a cat on the floor, alternating between a concave and convex back position." },

                    { question: "Post-partum exercise is defined as an unstructured, random physical activity performed whenever the mother feels energetic.", options: ["False", "True"], correct: 0, rationale: "Post-partum exercise is formally defined as a planned, structured and repetitive physical activity done to restore abdominal and pelvic muscles." },

                    { question: "What is the target number of Kegel exercises a woman should gradually work up to doing each day?", options: ["50 to 100", "10 to 20", "200 to 300", "5 to 10"], correct: 0, rationale: "The mother should begin with 3-second squeezes, 3 times a day, and gradually increase repetitions to work up to doing 50 to 100 Kegels each day." },
                    { question: "The mother should ensure she drinks an adequate amount of fluids before, during, and after her postnatal exercise routine.", options: ["True", "False"], correct: 0, rationale: "One of the fundamental principles of postnatal exercises is to drink adequate amounts of fluids before, during, and after exercise." },
                    { question: "What is a recommended principle regarding the environment and clothing for postnatal exercises?", options: ["Wear loose cotton clothes and maintain a stable environment", "Exercise in a dimly lit room to promote deep relaxation", "Wear tight synthetic clothing for maximum muscle support", "Exercise immediately after eating a full heavy meal"], correct: 0, rationale: "Principles of postnatal exercises include wearing loose, supportive cotton clothes and maintaining a stable environment, actively avoiding dark places or slippery floors." },

                const iconColor = quiz.theme === 'blue' ? 'text-blue-500' : 'text-purple-600';
                const btnColor = quiz.theme === 'blue' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-purple-600 hover:bg-purple-700';

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <i class="fas fa-notes-medical text-3xl ${iconColor}"></i>
                            <span class="text-xs font-semibold text-gray-400 bg-gray-100 px-2 py-1 rounded-full">${quiz.data.length} Qs</span>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800 mb-2 font-cairo">${quiz.title}</h2>
                    </div>
                    <button class="mt-6 w-full text-white py-2 rounded-lg transition ${btnColor}">Start Quiz</button>
                `;
                menuContainer.appendChild(card);
            });
        }

        function startQuiz(quizId) {
            currentQuiz = allQuizzes.find(q => q.id === quizId);
            if(!currentQuiz) return;
            
            // Randomize active data while preserving original code array
            activeQuizData = currentQuiz.data.map(q => {
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
            });

            score = 0;
            answeredCount = 0;
            
            document.getElementById('portal-container').classList.add('hidden-content');
            document.getElementById('active-quiz-container').classList.remove('hidden-content');
            document.getElementById('result-summary').classList.add('hidden-content');
            
            renderQuizHeader();
            renderQuizQuestions();
            updateBodyTheme();
        }

        function updateBodyTheme() {
            const body = document.getElementById('main-body');
            body.className = 'pb-12 theme-' + currentQuiz.theme;
            if (currentQuiz.theme === 'blue') {
                body.classList.add('bg-gray-50');
            } else {
                body.classList.add('bg-violet-200');
            }
        }

        function renderQuizHeader() {
            const headerContainer = document.getElementById('quiz-header');
            
            if (currentQuiz.theme === 'blue') {
                headerContainer.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">${currentQuiz.title}</h1>
                    <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                        <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
                    </div>
                </div>`;
            } else {
                headerContainer.innerHTML = `
                <div class="bg-purple-100 rounded-2xl shadow-md p-8 mb-8 text-center border-t-4 border-purple-700 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-purple-800"></i></div>
                    <h1 class="text-3xl font-bold text-purple-950 mb-2 font-cairo text-center" dir="auto">${currentQuiz.title}</h1>
                    <div class="flex items-center justify-center gap-2 text-purple-900 font-semibold bg-purple-300/60 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                        <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
                    </div>
                </div>`;
            }
        }

        function renderQuizQuestions() {
            const container = document.getElementById('quiz-questions');
            document.getElementById('total-display').innerText = `/ ${activeQuizData.length}`;
            
            container.innerHTML = activeQuizData.map((q, index) => {
                if (currentQuiz.theme === 'blue') {
                    return `
                    <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                             ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                        </div>
                        <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                        <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                            ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                        </div>
                        <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                            <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                        </div>
                    </div>`;
                } else {
                    return `
                    <div class="card bg-purple-100 rounded-xl p-6 mb-6 border border-purple-300 shadow-sm">
                        <div class="flex justify-between items-center mb-4 border-b border-purple-200 pb-3">
                            <span class="bg-purple-700 text-white text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                            ${q.options.length === 2 ? '<span class="bg-fuchsia-700 text-white text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                        </div>
                        <h3 class="text-purple-950 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                        <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                            ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-purple-300 hover:bg-purple-200 hover:border-purple-500 focus:outline-none flex items-center justify-between group bg-purple-50"><span class="font-medium text-purple-900 group-hover:text-purple-950 font-sans">${opt}</span></button>`).join('')}
                        </div>
                        <div id="feedback-${index}" class="hidden-content mt-6 rounded-xl p-5 border animate-fade-in text-left">
                            <p class="text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                        </div>
                    </div>`;
                }
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = activeQuizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            
            if (!feedback.classList.contains('hidden-content')) return;
            
            feedback.classList.remove('hidden-content');
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) {
                    btn.classList.add('correct-answer');
                    btn.innerHTML += '<i class="fas fa-check float-right"></i>';
                } else if (i === optIndex) {
                    btn.classList.add('wrong-answer');
                    btn.innerHTML += '<i class="fas fa-times float-right"></i>';
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            if (optIndex === q.correct) {
                score++;
                if (currentQuiz.theme === 'purple') feedback.classList.add('correct-answer');
            } else {
                if (currentQuiz.theme === 'purple') feedback.classList.add('wrong-answer');
            }
            
            answeredCount++;
            
            if (answeredCount === activeQuizData.length) {
                showResultSummary();
            }
        };

        function showResultSummary() {
            const summary = document.getElementById('result-summary');
            summary.classList.remove('hidden-content');
            
            if(currentQuiz.theme === 'blue') {
                summary.className = "bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100";
                document.getElementById('rs-title').className = "text-2xl font-bold text-gray-800";
                document.getElementById('rs-score-wrapper').className = "mt-4 text-4xl font-bold text-blue-600 mb-2";
                document.getElementById('total-display').className = "text-xl text-gray-400";
                document.getElementById('score-message').className = "text-gray-500 mb-6";
                document.getElementById('btn-restart').className = "bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200 flex items-center justify-center";
            } else {
                summary.className = "bg-purple-100 rounded-2xl shadow-lg p-8 text-center mt-8 border border-purple-300";
                document.getElementById('rs-title').className = "text-2xl font-bold text-purple-950";
                document.getElementById('rs-score-wrapper').className = "mt-4 text-4xl font-bold text-purple-700 mb-2";
                document.getElementById('total-display').className = "text-xl text-purple-500";
                document.getElementById('score-message').className = "text-purple-800 mb-6";
                document.getElementById('btn-restart').className = "bg-purple-700 text-white px-8 py-3 rounded-xl hover:bg-purple-800 transition shadow-lg hover:shadow-purple-300 flex items-center justify-center";
            }

            document.getElementById('score-display').innerText = score;
            document.getElementById('score-message').innerText = (score / activeQuizData.length * 100) >= 50 ? "Good Job!" : "Keep Studying";
            setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
        }

        function restartCurrentQuiz() {
            startQuiz(currentQuiz.id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function returnToPortal() {
            currentQuiz = null;
            document.getElementById('active-quiz-container').classList.add('hidden-content');
            document.getElementById('portal-container').classList.remove('hidden-content');
            
            // Reset to portal theme
            const body = document.getElementById('main-body');
            body.className = 'pb-12 bg-slate-50';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize App
        initPortal();
    </script>
</body>
</html>
